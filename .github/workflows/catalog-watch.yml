name: Catalog watch

# Weekly OSV re-check of every approved component; opens (or updates) one issue when something is found.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: watch
        run: pnpm catalog:watch "$RUNNER_TEMP/catalog-watch.md"
        continue-on-error: true
      - if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog watch: advisories in approved components"
          number=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/catalog-watch.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/catalog-watch.md" --label security || \
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/catalog-watch.md"
          fi
