# Local development services. Production equivalents: see docs/adr/0006-infrastructure-for-speed.md
name: code-api-turbineh
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: turbineh
      POSTGRES_PASSWORD: turbineh_local_only
      POSTGRES_DB: turbineh
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turbineh -d turbineh"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
