    category: content
    provides: ["content.blog"]
    does: "Parses Markdown files with front matter (title, date, tags) for blogs and pages"
    does_not: "Does not render Markdown to HTML"
    use_cases: ["saas-crud", "internal-tool", "landing-waitlist", "bookings", "client-portal", "corporate-site", "storefront"]
  - id: content.reading-time.reading-time
    package: "reading-time"
    category: content
