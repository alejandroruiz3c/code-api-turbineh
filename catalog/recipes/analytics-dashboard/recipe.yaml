id: analytics-dashboard
# Display name and one-line tagline on the home, the catalogue and Discover (ADR-0076): the tagline uses only words
# of the description and of the functions the criteria prove (CI: packages/engine/src/areas.test.ts).
title: "Analytics dashboard"
tagline: "Team dashboards from CSV or entered data, with KPIs and charts."
description: Analytics dashboards for a team — import data from CSV or enter it, KPIs with period comparison, time series and breakdown charts, filters and export
extends: saas-crud
providedEntities: [Dataset, DataPoint, Metric, Kpi, Report, Chart, Dashboard, Record, Measurement, Entry]
defaultCapabilities: [data.csv-import, data.csv-export, data.pagination]
# Implemented by the template itself (native SVG charts, no extra dependencies).
providedCapabilities: [ui.charts]
nav:
  - { label: Analytics, href: /dashboard/analytics }

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Add a KPI or chart"
      where: "src/server/analytics.ts, src/components/charts.tsx, src/app/dashboard/analytics/[id]/page.tsx"
      how: "Compute it on the server (unit-test it), render it with the native SVG charts."
