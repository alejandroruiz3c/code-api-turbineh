# Acceptance criteria → tests for projects (plus saas-crud's). Every regex of a rule must match the criterion.
- test: "tests/e2e/projects.spec.ts › the owner creates a project and a task assigned to them with a priority and a due date; a task past its due date is flagged overdue"
  covers: ["project|task|issue|card", "creat|add|new|assign"]
- test: "tests/e2e/projects.spec.ts › the owner moves a task on the Kanban board from To do to In progress and the new status is persisted"
  covers: ["kanban|board|column|drag|move|status"]
- test: "tests/e2e/projects.spec.ts › a task assigned to the owner shows in My tasks, and the owner adds a comment that is visible on that task"
  covers: ["my tasks|assigned to (me|them|the user)|personal|comment"]
- test: "tests/unit/board.test.ts › flags overdue tasks that are not done"
  covers: ["overdue|due date|deadline|late"]
- test: "tests/unit/board.test.ts › orders my tasks by due date, then priority"
  covers: ["priorit|sort|order(ed)? by"]
- test: "tests/e2e/projects.spec.ts › the owner edits a task's title and the change is saved"
  covers: ["task|todo|item", "edit|modif|renam|(updat|chang)\\w* (the |its )?(task'?s? )?(title|name|text|details|content)"]
- test: "tests/e2e/projects.spec.ts › the owner archives a task: it leaves the board and shows under Archived tasks, and restoring it brings it back"
  covers: ["task|todo|item", "archiv"]
- test: "tests/e2e/projects.spec.ts › the owner deletes a task and it is no longer on the board"
  covers: ["task|todo|item", "delet|remov"]
- test: "tests/e2e/projects.spec.ts › the owner renames a project and the new name is shown"
  covers: ["project", "edit|modif|renam|(updat|chang)\\w* (the |its )?(project'?s? )?(title|name|description|details)"]
- test: "tests/e2e/projects.spec.ts › the owner archives a project: it leaves the project list and shows under Archived projects, and restoring it brings it back"
  covers: ["project", "archiv"]
- test: "tests/e2e/projects.spec.ts › the owner deletes a project and its tasks are removed"
  covers: ["project", "delet|remov"]
