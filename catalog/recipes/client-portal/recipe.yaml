id: client-portal
description: Client portal where clients submit requests with file uploads and follow their status; staff review and update them
extends: saas-crud
providedEntities:
  [Request, ServiceRequest, ClientRequest, Ticket, Case, File, Upload, Document, Attachment, RequestFile, Status]
defaultCapabilities: [ops.rate-limit, data.pagination]
# Implemented by the template: type sniffing by content (magic bytes), size limits and safe downloads.
providedCapabilities: [files.upload, files.type-detection, files.mime]
nav:
  - { label: Requests, href: /dashboard/requests }

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Change request statuses or who sees what"
      where: "src/server/portal.ts, src/app/dashboard/requests/"
      how: "Clients see their own requests, staff see all; keep the access checks on the server."
    - what: "Accept another file type"
      where: "src/server/portal.ts"
      how: "Types are detected by content (magic bytes) with size limits; add the signature and a unit test."
    - what: "Accept an invitation (invitee without an account, or signed in but not a member yet)"
      where: "src/app/<route>/actions.ts, src/server/authz.ts (publicAction, requireSession)"
      how: "No account yet: `publicAction(name, { rateLimit, schema }, handler)` with the hashed, expiring token. Signed in: `await requireSession()` first, then check the invited email."
