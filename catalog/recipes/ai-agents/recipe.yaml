id: ai-agents
description: AI assistants with instructions and allowed tools, chat over a knowledge base of the team's documents, batch AI processing of records (classify, extract, summarise), usage and audit — every AI call through the TurbineH orchestrator with its AI Safety Pack (ADR-0028)
extends: saas-crud
providedEntities:
  [
    Agent,
    Assistant,
    Bot,
    Conversation,
    Chat,
    Message,
    Document,
    Chunk,
    KnowledgeBase,
    Process,
    ProcessItem,
    Ticket,
    Usage,
    AuditLog,
    AiUsage,
    AiUsageMetric,
    UsageMetric,
    AuditEntry,
    AiAudit,
    KnowledgeBaseDocument,
    KnowledgeDocument,
    HelpArticle,
    Escalation,
    EscalationRequest,
    Classification,
    Batch,
    BatchJob,
    Export,
    ExportBatch,
    ImportBatch,
  ]
defaultCapabilities: [data.pagination, ops.rate-limit, ai.orchestrator, security.ai-safety]
# Implemented by the template itself: batch AI processing runs through its own runner (POST /api/jobs/run with
# JOBS_RUNNER_SECRET, also called by Vercel Cron), and the CSV import/export of process items.
providedCapabilities: [jobs.queue, data.csv-import, data.csv-export]
# The template code calls these native components; code selects them in every build (never the decider).
requiredComponents:
  ai.orchestrator: ai.orchestrator.turbineh
  security.ai-safety: security.ai-safety.turbineh
nav:
  - { label: Assistants, href: /dashboard/agents }
  - { label: Knowledge, href: /dashboard/knowledge }
  - { label: AI processes, href: /dashboard/processes }
  - { label: AI usage, href: /dashboard/usage }
  - { label: AI audit, href: /dashboard/ai-audit }
