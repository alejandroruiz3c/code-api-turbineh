id: ai-agents
description: AI assistants with instructions and allowed tools (escalate to a human by email), chat over a knowledge base of the team's documents, batch AI processing of records (classify, extract, summarise), usage and audit — every AI call through the TurbineH orchestrator with its AI Safety Pack (ADR-0028)
extends: saas-crud
providedEntities:
  [
    Agent,
    Assistant,
    Bot,
    Conversation,
    Chat,
    Message,
    ChatMessage,
    ChatSession,
    Document,
    Chunk,
    KnowledgeBase,
    Process,
    ProcessItem,
    Ticket,
    Usage,
    AuditLog,
    AiUsage,
    AiUsageMetric,
    UsageMetric,
    AuditEntry,
    AiAudit,
    KnowledgeBaseDocument,
    KnowledgeDocument,
    HelpArticle,
    Faq,
    FaqEntry,
    FaqItem,
    FaqArticle,
    KnowledgeArticle,
    Escalation,
    EscalationRequest,
    Classification,
    Batch,
    BatchJob,
    Export,
    ExportBatch,
    ImportBatch,
    # Help-centre and escalation names a request may use (ADR-0069): the knowledge base and the escalated
    # conversations already are these records, so no parallel CRUD table is generated for them.
    KnowledgeBaseEntry,
    KnowledgeEntry,
    HelpCenterArticle,
    HelpCentreArticle,
    SupportArticle,
    EscalationTicket,
    HumanEscalation,
    ChatInteraction,
  ]
defaultCapabilities: [data.pagination, ops.rate-limit, ai.orchestrator, security.ai-safety]
# Implemented by the template itself: batch AI processing runs through its own runner (POST /api/jobs/run with
# JOBS_RUNNER_SECRET, also called by Vercel Cron), and the CSV import/export of process items.
providedCapabilities: [jobs.queue, data.csv-import, data.csv-export]
# The template code calls these native components; code selects them in every build (never the decider).
requiredComponents:
  ai.orchestrator: ai.orchestrator.turbineh
  security.ai-safety: security.ai-safety.turbineh
# Tree-shaking (ADR-0064): optional modules ship only when a requirement of the request asks for them. Without
# batch-processes the template has no job runner and no CSV import/export of process items: those provided capabilities
# belong to the module (`provides`) and are claimed only when it ships.
modules:
  - id: knowledge-base
    about: "a knowledge base of uploaded documents used as answer sources"
    capability: ai.knowledge-base
    files:
      [
        src/server/knowledge.ts,
        src/server/chunking.ts,
        src/app/dashboard/knowledge/,
        src/components/knowledge-form.tsx,
      ]
    nav: [/dashboard/knowledge]
  - id: batch-processes
    about: "batch AI processing of records (classify, extract, summarise) with a background job runner"
    capability: ai.batch-processing
    files:
      [
        src/server/processes.ts,
        src/server/process-schema.ts,
        src/app/dashboard/processes/,
        src/app/api/jobs/run/route.ts,
      ]
    env: [JOBS_RUNNER_SECRET]
    nav: [/dashboard/processes]
    provides: [jobs.queue, data.csv-import, data.csv-export]
nav:
  - { label: Assistants, href: /dashboard/agents }
  - { label: Knowledge, href: /dashboard/knowledge }
  - { label: AI processes, href: /dashboard/processes }
  - { label: AI usage, href: /dashboard/usage }
  - { label: AI audit, href: /dashboard/ai-audit }

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Add a tool an assistant can use"
      where: "src/server/tools.ts"
      how: "Declare its schema and handler; irreversible tools need user confirmation. Every model call goes through src/lib/ai/orchestrator.ts."
    - what: "Change how documents are split or searched"
      where: "src/server/chunking.ts, src/server/knowledge.ts"
      how: "Chunking and retrieval are deterministic; embeddings go through embed() of the orchestrator."
    - what: "Add a batch AI process type"
      where: "src/server/processes.ts, src/server/process-schema.ts"
      how: "Define the output schema; orchestrate() validates it."
