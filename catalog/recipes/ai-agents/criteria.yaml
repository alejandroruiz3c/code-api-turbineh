# Canonical acceptance criteria (ADR-0063) of the ai-agents use case: one per function its catalogue text advertises,
# each linked to the test that proves it. Format: catalog/components/domain.bookings.turbineh/criteria.yaml.
- id: ai-agents.assistant-instructions
  criterion: "Creates an assistant that answers from the knowledge base"
  advertises: "AI assistants with instructions"
  says: ["assistant|agent|bot|chatbot|copilot", "creat|configur|instruct|answer|set ?up|define|prompt|respond|reply"]
  terms: >-
    ai assistant assistants agent agents bot bots chatbot chatbots copilot create creates created configure
    configures configured instruction instructions prompt prompts system persona define defines set setup up
    name answer answers answered respond responds reply replies question questions message messages chat
    using use from documents knowledge base company team admin owner
  actors: [owner, admin, member, user, customer]
  tests:
    - "tests/e2e/ai-agents.spec.ts › creates an assistant that answers from the knowledge base"

- id: ai-agents.allowed-tools
  criterion: "An assistant with instructions gets only the tools allowed for it; the irreversible one asks first"
  advertises: "allowed tools"
  says: ["tools?|actions?|escalat|function call|capabilit"]
  terms: >-
    tool tools action actions escalate escalation escalates function call calls capability capabilities allowed
    allow enable enabled only permitted irreversible confirm confirmation confirms asks ask first before email
    human person assistant assistants agent agents admin owner registry
  actors: [owner, admin, member, user]
  tests:
    - "tests/unit/ai-agents.test.ts › an assistant with instructions gets only the tools allowed for it; the irreversible one asks first"
    - "tests/unit/ai-safety.test.ts › only enables registry tools and asks before irreversible ones"

- id: ai-agents.knowledge-base
  criterion: "Adds a document to the knowledge base"
  advertises: "knowledge base"
  says: ["knowledge|document|docs|faq|help ?cent|manual|polic|source|rag|upload"]
  terms: >-
    knowledge base bases document documents doc docs faq faqs help centre center manual manuals policy
    policies source sources rag upload uploads add adds added store stores stored text title team company
    internal content
  actors: [owner, admin, member, user]
  tests:
    - "tests/e2e/ai-agents.spec.ts › adds a document to the knowledge base"

- id: ai-agents.chat-over-documents
  criterion: "An assistant answers from the knowledge base"
  advertises: "chat over a knowledge base"
  says: ["chat|ask|answer|question|convers|respond|reply", "knowledge|document|docs|faq|source|polic|help|manual|base"]
  terms: >-
    chat chats ask asks asked answer answers answered question questions conversation conversations respond
    responds reply replies knowledge base document documents docs faq source sources cited cite cites citing
    policy policies help centre center manual from using based on grounded assistant agent bot customer
    customers team
  actors: [owner, admin, member, user, customer, client, visitor]
  tests:
    - "tests/e2e/ai-agents.spec.ts › creates an assistant that answers from the knowledge base"

- id: ai-agents.batch-classify
  criterion: "Classifies records in a batch process"
  advertises: "classify"
  says: ["classif|categori|label|tag|triag|route|sort"]
  terms: >-
    classify classifies classified classification categorise categorize categorises categorizes category
    categories label labels labelled labeled tag tags triage triages route routes sort sorts record records
    item items ticket tickets support batch batches process processes processing bulk many each every automatic
    automatically ai team queue run
  actors: [owner, admin, member, user]
  tests:
    - "tests/e2e/ai-agents.spec.ts › classifies records in a batch process"

- id: ai-agents.batch-extract-summarise
  criterion: "Summarises and extracts records in batch processes: each item is processed through the orchestrator and its validated structured output is stored"
  advertises: "extract"
  says: ["summar|extract|pars|pull out|key fields|structured"]
  terms: >-
    summarise summarize summarises summarizes summary summaries extract extracts extraction parse parses pull
    out key field fields data structured output outputs record records item items ticket tickets batch
    batches process processes processing bulk each every ai validated stored
  actors: [owner, admin, member, user]
  tests:
    - "tests/e2e/ai-agents.spec.ts › summarises and extracts records in batch processes: each item is processed through the orchestrator and its validated structured output is stored"
    - "tests/unit/ai-agents.test.ts › validates labels and structured outputs of processes"

- id: ai-agents.batch-summarise
  criterion: "Summarises records in batch processes: each item is processed through the orchestrator and its validated structured output is stored"
  advertises: "summarise"
  says: ["summar|digest|tl;?dr|short version"]
  terms: >-
    summarise summarize summarises summarizes summary summaries digest short version record records item items
    ticket tickets batch batches process processes processing bulk each every ai stored output
  actors: [owner, admin, member, user]
  tests:
    - "tests/e2e/ai-agents.spec.ts › summarises and extracts records in batch processes: each item is processed through the orchestrator and its validated structured output is stored"

- id: ai-agents.usage-audit
  criterion: "Shows AI usage and the audit trail"
  advertises: "usage and audit"
  says: ["usage|audit|log|cost|token|track|monitor|history"]
  terms: >-
    ai usage audit trail trails log logs logged cost costs token tokens track tracks tracked monitor monitors
    history request requests calls call blocked admin owner dashboard see view report reports every each
  actors: [owner, admin, manager]
  tests:
    - "tests/e2e/ai-agents.spec.ts › shows AI usage and the audit trail"

- id: ai-agents.safety
  criterion: "Refuses a prompt-injection attempt with a safe message"
  advertises: "TurbineH orchestrator"
  says: ["inject|jailbreak|manipulat|safe|guard|override|system prompt|malicious|abuse"]
  terms: >-
    prompt injection injections jailbreak jailbreaks manipulate manipulation safe safety guard guardrail
    guardrails override overrides system instructions malicious abuse attempt attempts refuse refuses refused
    reject rejects blocked message messages assistant agent chat ai reveal reveals secret
  actors: [owner, admin, member, user, customer, visitor]
  tests:
    - "tests/e2e/ai-agents.spec.ts › refuses a prompt-injection attempt with a safe message"
    - "tests/unit/ai-agent.test.ts › refuses prompt injection before any model call"

- id: ai-agents.escalate-email
  criterion: "Escalating to a human emails the team"
  advertises: "escalate to a human"
  says: ["escalat|hand ?off|human|person|staff", "email|mail|notif|team"]
  terms: >-
    escalate escalates escalation human person staff team email emails notify notifies hand off handoff
    support follow up assistant agent
  actors: [owner, admin, member, user, customer]
  tests:
    - "tests/unit/ai-agents.test.ts › escalating to a human emails the team on ADMIN_EMAILS"
