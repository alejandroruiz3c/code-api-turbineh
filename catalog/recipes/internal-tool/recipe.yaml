id: internal-tool
# Display name and one-line tagline on the home, the catalogue and Discover (ADR-0076): the tagline uses only words
# of the description and of the functions the criteria prove (CI: packages/engine/src/areas.test.ts).
title: "Internal back-office tool"
tagline: "An internal back-office tool with tables, search and CSV import and export."
description: Internal back-office tool with tables, search, CSV import and export
extends: saas-crud
providedEntities: []
defaultCapabilities: [data.csv-import, data.csv-export, data.pagination]
nav: []

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Add a CSV column"
      where: "src/entities/<entity>/schema.ts and src/lib/csv.ts"
      how: "Add the field to the Zod schema; CSV import/export follow the schema."
