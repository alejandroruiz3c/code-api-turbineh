id: storefront
description: Online shop with product catalog and images, product variants (size, colour…) with own SKU, price and stock, cart, shipping options by country, taxes by country, Stripe Checkout payments, orders and stock, and an admin panel
extends: saas-crud
providedEntities:
  [Product, Item, Article, Variant, ProductVariant, ProductOption, Size, Cart, CartItem, Order, OrderItem, OrderLine, Purchase, Payment, Customer, Stock, Inventory, Category, Shipping, ShippingRate, ShippingMethod, Tax, TaxRate]
defaultCapabilities: [email.transactional, ops.rate-limit, data.pagination]
# Implemented by the template itself (native): no SDK, signature verification and money in integer cents.
providedCapabilities:
  [commerce.cart, payments.checkout, security.webhook-signature, data.money, seo.sitemap, seo.structured-data, files.upload, files.type-detection]
nav:
  - { label: Products, href: /dashboard/products }
  - { label: Shipping & taxes, href: /dashboard/shipping }
  - { label: Orders, href: /dashboard/orders }
