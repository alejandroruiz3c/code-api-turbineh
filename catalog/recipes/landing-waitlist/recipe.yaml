id: landing-waitlist
description: Public landing page with a waitlist form, confirmation email and an admin panel
extends: saas-crud
providedEntities: [WaitlistEntry, Waitlist, Signup, Subscriber, Lead, Registration]
defaultCapabilities: [email.transactional, ops.rate-limit, data.pagination]
nav:
  - { label: Waitlist, href: /dashboard/waitlist }

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Change the landing copy"
      where: "src/content/site.ts"
      how: "Plain text read by every section; no test asserts the copy."
    - what: "Add a waitlist field"
      where: "src/db/recipe-tables.ts, src/app/waitlist/actions.ts, src/app/page.tsx"
      how: "Add the column, validate it in joinWaitlist (Zod) and add the input; then `pnpm db:generate`."
    - what: "Add another public form (referral, double opt-in confirmation…)"
      where: "src/app/<route>/actions.ts, src/server/authz.ts (publicAction)"
      how: "Same pattern as joinWaitlist: `publicAction(name, { rateLimit, schema, refuse }, handler)`."
