id: saas-crud
# Display name and one-line tagline on the home, the catalogue and Discover (ADR-0076): the tagline uses only words
# of the description and of the functions the criteria prove (CI: packages/engine/src/areas.test.ts).
title: "Multi-tenant SaaS"
tagline: "A multi-tenant SaaS with sign-in, workspaces, roles and CRUD screens."
description: Multi-tenant SaaS with sign-in, workspaces, roles and CRUD screens
extends: null
providedEntities: []
defaultCapabilities: [auth.session, authz.organizations, authz.roles, data.orm, data.validation, data.pagination, ui.table, ui.form, ui.layout, security.headers, ops.rate-limit]
# Implemented by the template itself: better-auth hashes passwords (scrypt) before storing them; the generated screens
# render their own tables and forms (server components and server actions, no table or form library); the Security
# Pack's limiter (src/security/rate-limit.ts, shared PostgreSQL store) is the app's rate limiting (ADR-0064: a library
# chosen for these would be a decision the app never uses).
providedCapabilities: [security.password-hash, ui.table, ui.form, ops.rate-limit]
# Transversal requirements (ADR-0064): what every app needs whatever the request says. They justify these capabilities
# in the delivery manifest; anything else must be justified by a requirement of the request.
transversal:
  auth: [auth.session, authz.organizations, authz.roles, security.password-hash]
  security: [security.headers, data.validation, ops.rate-limit]
  persistence: [data.orm]
  interface: [ui.layout, ui.table, ui.form, data.pagination]
nav: []

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Add a data entity"
      where: "src/db/tables/<entity>.ts, src/entities/<entity>/, src/app/dashboard/<entity>/"
      how: "Copy an existing generated entity (table, schema, actions, page, E2E spec) and register it in src/entities/index.ts and src/db/schema.ts."
    - what: "Change the role policy"
      where: "src/server/authz.ts (can)"
      how: "Edit can(role, action); keep the unit test tests/unit/authz.test.ts in step."
