# Actor aliases (ADR-0048): who this recipe's tests act as, in the words requests use for that role. From the recipe's
# role model only, never guessed. Applied to the recipe's and the generated tests of an app built on it.
actors:
  - term: owner
    means: [administrator, admin, staff, site owner]
    why: >-
      The E2E owner is the site's administrator: a verified ADMIN_EMAILS staff member (auth.spec.ts "the verified
      owner has staff access"), and the dashboard (messages, posts, site content) is requireAdmin() = staff.
