id: bookings
description: Bookings and appointments with weekly availability, conflict-free booking, a calendar and email confirmations
extends: saas-crud
providedEntities:
  [Booking, Appointment, Reservation, Visit, Session, Availability, AvailabilitySlot, Slot, TimeSlot, Schedule,
   OpeningHour, OpeningHours, WorkingHour, WorkingHours, BusinessHour, BusinessHours, Calendar, CalendarEvent]
defaultCapabilities: [email.transactional, ops.rate-limit, data.pagination]
nav:
  - { label: Bookings, href: /dashboard/bookings }
  - { label: Calendar, href: /dashboard/calendar }
  - { label: Availability, href: /dashboard/availability }

# Agent guide inputs (AGENTS.md / turbineh.json): where to extend this recipe.
guide:
  extend:
    - what: "Change booking rules (duration, notice, conflicts)"
      where: "src/server/bookings.ts, src/app/dashboard/bookings/actions.ts"
      how: "Slots and conflicts are computed on the server; add a unit test for each rule."
    - what: "Change opening hours"
      where: "src/app/dashboard/availability/page.tsx"
      how: "Weekly availability; bookings outside it are refused."
    - what: "Let visitors book or cancel without an account (public booking page, cancel link)"
      where: "src/app/<route>/actions.ts, src/server/authz.ts (publicAction)"
      how: "Export it as `publicAction(name, { rateLimit, schema }, handler)`: per-IP rate limit and Zod validation come first; never a plain exported function."
