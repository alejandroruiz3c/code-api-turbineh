example: |-
  import { cva } from "class-variance-authority";

  const button = cva("btn", {
    variants: { size: { sm: "text-sm", lg: "text-lg" } },
    defaultVariants: { size: "sm" },
  });
  console.log(button()); // → "btn text-sm"
  console.log(button({ size: "lg" })); // → "btn text-lg"
