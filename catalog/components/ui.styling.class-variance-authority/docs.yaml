schema: turbineh.component-docs/v1
id: ui.styling.class-variance-authority
does: Typed component variants for utility-class styling
does_not: Does not include styles itself
use_cases:
  - Creating typed component variants for utility-class styling
  - Managing complex CSS class combinations based on props
when_to_use:
  - When you need to compose variant classes for UI components
when_not_to_use:
  - instead: ui.animation.motion
    why: When you require animation logic rather than class composition
tradeoffs:
  - Does not include styles itself
inputs:
  - name: pnpm add class-variance-authority@0.7.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: cva
    kind: export
    about: Function to define component variants and default values
extension_points: []
dependencies:
  package: class-variance-authority
  version: 0.7.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access required
guarantees:
  - claim: composes variant classes
    test:
      file: contract.test.ts
      title: composes variant classes
limits:
  - Does not provide actual CSS or style definitions
example: |-
  import { cva } from "class-variance-authority";

  const button = cva("btn", {
    variants: {
      size: { sm: "text-sm", lg: "text-lg" }
    },
    defaultVariants: {
      size: "sm"
    }
  });

  button(); // "btn text-sm"
  button({ size: "lg" }); // "btn text-lg"
