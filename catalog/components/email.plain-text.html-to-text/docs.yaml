# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: email.plain-text.html-to-text
does: Plain-text version of HTML emails (better deliverability)
does_not: Does not send emails
use_cases:
  - Generating plain-text versions of HTML emails to improve deliverability
  - Converting HTML documents into readable text with word wrapping
  - Extracting text from HTML while skipping specific elements like images
when_to_use:
  - When you need a plain-text alternative for an HTML email
  - When you require specific formatting like word wrapping or link target preservation
when_not_to_use:
  - instead: email.smtp.nodemailer
    why: This component does not send emails
  - instead: email.parsing.mailparser
    why: Use mailparser if you need to parse existing email structures rather than converting HTML to text
tradeoffs:
  - Provides high customization via selectors but requires configuration for optimal email formatting
inputs:
  - name: pnpm add html-to-text@10.0.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: convert
    kind: export
    about: Parses HTML and returns text based on provided options
  - name: htmlToPlainText
    kind: export
    about: A curated wrapper that converts HTML to plain text with specific email-optimized settings (78 char
      wrap, skips images, preserves links)
extension_points:
  - Custom formatters via the metadata object
dependencies:
  package: html-to-text
  version: 10.0.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Input length is limited to 500,000 characters in the curated glue to prevent excessive CPU usage
guarantees:
  - claim: turns an HTML email into readable plain text
    test:
      file: contract.test.ts
      title: turns an HTML email into readable plain text
  - claim: skips images, keeps link targets once and wraps lines (options used by the curated glue)
    test:
      file: contract.test.ts
      title: skips images, keeps link targets once and wraps lines (options used by the curated glue)
limits:
  - The curated `htmlToPlainText` function throws an error if the input HTML exceeds 500,000 characters
example: |-
  import { htmlToPlainText } from "@/integrations/email-plain-text";

  const text = htmlToPlainText("<h1>Hello</h1><p>World</p>");
keywords:
  - html-to-text
  - email.plain-text
  - email
  - plain
  - text
  - plain-text
  - conversion
  - word-wrap
  - deliverability
