use_cases:
  - Storing files in S3-compatible object storage
  - Interacting with AWS S3 via REST API
use_when:
  - When you need to interface with S3-compatible services like Scaleway or Cloudflare R2
  - When you require a modularized client/command pattern for S3 operations
avoid_when:
  - If you only need to generate presigned URLs — use storage.objects.s3-presigner
  - If you are using Vercel's specific blob storage solution — use storage.objects.vercel-blob
  - This component does not resize images — use image resizing tools
tradeoffs:
  - choice: Modularized client/command architecture
    gain: Allows importing only necessary commands to reduce bundle size
    cost: Requires instantiating both a client and a command for every operation
