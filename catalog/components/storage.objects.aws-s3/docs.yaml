schema: turbineh.component-docs/v1
id: storage.objects.aws-s3
does: Stores files in S3-compatible object storage (AWS, Scaleway, Cloudflare R2)
does_not: Does not resize images
use_cases:
  - Storing files in S3-compatible object storage
  - Interacting with AWS, Scaleway, or Cloudflare R2 via REST API
when_to_use:
  - When you need to perform object storage operations like PutObject using an S3-compatible interface
when_not_to_use:
  - instead: storage.objects.s3-presigner
    why: When you specifically need to generate presigned URLs
  - instead: storage.objects.vercel-blob
    why: When using Vercel's managed blob storage instead of S3-compatible providers
  - instead: image processing libraries
    why: This component does not resize images
tradeoffs:
  - Requires network access for actual data transfer despite command construction capabilities
inputs:
  - name: pnpm add @aws-sdk/client-s3@3.1141.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: S3Client
    kind: export
    about: Client used to send commands to an S3-compatible service
  - name: PutObjectCommand
    kind: export
    about: Command used to upload an object to a bucket
extension_points: []
dependencies:
  package: "@aws-sdk/client-s3"
  version: 3.1141.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Supports authentication via credentials (accessKeyId and secretAccessKey)
guarantees:
  - claim: builds S3-compatible commands without network access
    test:
      file: contract.test.ts
      title: builds S3-compatible commands without network access
limits:
  - Does not resize images
example: |-
  import { S3Client, PutObjectCommand } from "@aws-sdk/client-s3";
  const client = new S3Client({ region: "us-east-1" });
  const command = new PutObjectCommand({ Bucket: "b", Key: "k", Body: "hi" });
  await client.send(command);
keywords:
  - "@aws-sdk/client-s3"
  - storage.objects
  - storage
  - objects
  - s3
  - object-storage
  - aws
  - scaleway
  - r2
