id: ui.hover-card.radix
does: Preview cards on hover (people, links)
does_not: Unstyled; not for touch-only interactions
use_cases:
  - Previewing people profiles on hover
  - Previewing link content on hover
when_to_use:
  - When you need to show contextual information without changing the user's focus or location
when_not_to_use:
  - instead: ui.alert-dialog.radix
    why: If the interaction requires a modal interruption rather than a non-blocking preview
  - instead: touch-only interactions
    why: The component is not designed for touch-only interfaces
tradeoffs:
  - Unstyled; requires manual CSS implementation
