schema: turbineh.component-docs/v1
id: seo.structured-data.schema-dts
does: Typed schema.org JSON-LD for rich search results (Organization, Product, Article)
does_not: Types only; does not inject tags
use_cases:
  - Defining typed Schema.org JSON-LD objects for rich search results
  - Implementing discriminated type unions for Schema.org vocabulary
  - Facilitating JSON-LD @context requirements via WithContext type
when_to_use:
  - When you need TypeScript definitions for Schema.org vocabulary in JSON-LD format
when_not_to_use:
  - instead: seo.sitemap.sitemap
    why: This component provides types only and does not inject tags or manage sitemaps
tradeoffs:
  - Provides strict validation and autocompletion but requires manual integration into your JSON-LD generation
    logic
inputs:
  - name: pnpm add schema-dts@2.0.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Organization
    kind: export
    about: Schema.org Organization type definition
  - name: WithContext
    kind: export
    about: Type to facilitate adding the @context property to top-level JSON-LD objects
extension_points: []
dependencies:
  package: schema-dts
  version: 2.0.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
