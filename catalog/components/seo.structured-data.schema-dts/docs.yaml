security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No security implications identified in provided documentation
guarantees:
  - claim: types schema.org JSON-LD objects
    test:
      file: contract.test.ts
      title: types schema.org JSON-LD objects
limits:
