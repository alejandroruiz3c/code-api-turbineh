example: |-
  import type { Organization, WithContext } from "schema-dts";

  const org: WithContext<Organization> = {
    "@context": "https://schema.org",
    "@type": "Organization",
    name: "Acme",
    url: "https://acme.test",
  };
  console.log(JSON.parse(JSON.stringify(org))["@type"]); // → "Organization"
