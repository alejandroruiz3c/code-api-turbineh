guarantees:
  - claim: Each role can do exactly what the role matrix lists (template default - members read and create; approve, export and settings are separate privileges).
    test: "recipe template saas-crud/tests/unit/permissions.test.ts › each workspace role can do exactly what is written here, nothing else"
  - claim: Staff access is restricted to verified allowlisted addresses.
