  - claim: Public actions are rate-limited per client IP before anything runs.
    test: recipe template saas-crud/tests/unit/authz.test.ts › rate-limits per client IP and throws a user-facing
      error by default
  - claim: Public actions refuse invalid input before the handler runs.
    test: recipe template saas-crud/tests/unit/authz.test.ts › refuses invalid input before the handler runs
  - claim: requireSession sends anonymous callers to sign-in.
    test: recipe template saas-crud/tests/unit/authz.test.ts › sends anonymous callers to sign-in
limits:
  - Does not support fine-grained per-record permissions
example: |-
  // A server action in the app (e.g. src/app/dashboard/notes/actions.ts): signed-in member, role checked, deny by default.
  import { can, requireMember } from "@/server/authz";
  import { UserFacingError } from "@/security/errors";

  export async function archiveNote(
    noteId: string,
  ): Promise<{ ok: true; by: string; noteId: string }> {
    const ctx = await requireMember(); // redirects to /sign-in without a session or workspace
    if (!can(ctx.role, "update", "notes")) throw new UserFacingError("Your role cannot edit notes.");
    return { ok: true, by: ctx.userId, noteId };
  }
