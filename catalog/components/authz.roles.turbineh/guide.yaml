extension_points:
  - what: Staff access control via email allow-list
    where: ADMIN_EMAILS environment variable
    how: Matches whole emails case-insensitively and denies by default
  - what: Server actions for anonymous visitors (public booking, contact, waitlist, emailed links)
    where: "@/server/authz (publicAction)"
    how: "export const x = publicAction(name, { rateLimit, schema }, handler): per-IP rate limit and Zod validation run first"
  - what: Server actions for signed-in users who are not members yet (accept an invitation, onboarding)
    where: "@/server/authz (requireSession)"
    how: First line await requireSession(); workspace data still needs requireMember()
