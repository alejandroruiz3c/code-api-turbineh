schema: turbineh.guide/v0.1
component: authz.roles.turbineh
title: authz.roles.turbineh
summary: Role policy (owner/admin/member) and requireMember guard used by every page and server action. Does
  not implement fine-grained per-record permissions. Role policy management providing owner, admin, and member
  access control for pages and server actions.
keywords:
  - authz.roles.turbineh
  - authz.roles
  - authz
  - roles
  - rbac
  - permissions
  - guard
  - admin
synonyms:
  role policy:
    - owner/admin/member
use_cases:
  - Protecting pages and server actions with role-based guards
  - Managing workspace access via owner, admin, and member roles
  - Implementing staff access via an email allow-list
use_when:
  - When requiring role-based access control (owner/admin/member) for entire pages or actions
  - When managing staff access through a verified email allow-list
avoid_when:
  - Does not implement fine-grained per-record permissions — use authz.organizations.better-auth
tradeoffs:
  - choice: Role-based guards
    gain: Simple enforcement of owner, admin, and member roles across the application
    cost: Cannot perform fine-grained per-record permission checks
