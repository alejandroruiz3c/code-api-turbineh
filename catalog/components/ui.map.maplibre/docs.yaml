schema: turbineh.component-docs/v1
id: ui.map.maplibre
does: Interactive vector maps (store locations, delivery areas) without a proprietary SDK
does_not: Needs a tile source (style URL) chosen by the client
use_cases:
  - Interactive vector maps
  - Store location visualization
  - Delivery area mapping
  - GPU-accelerated map rendering
when_to_use:
  - When you need an open-source WebGL interactive map library
  - When you want to avoid proprietary SDKs
when_not_to_use:
  - instead: a proprietary SDK
    why: The component needs a tile source (style URL) chosen by the client
tradeoffs:
  - Requires a client-provided tile source style URL
inputs:
  - name: pnpm add maplibre-gl@6.11.2
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: LngLat
    kind: export
    about: Represents a geographic coordinate
  - name: LngLatBounds
    kind: export
    about: Represents a bounding box for geographic coordinates
extension_points: []
dependencies:
  package: maplibre-gl
  version: 6.11.2
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No security guarantees provided in documentation
guarantees:
  - claim: handles coordinates and bounds without a browser
    test:
      file: contract.test.ts
      title: handles coordinates and bounds without a browser
limits:
  - Requires an external tile source (style URL)
example: |-
  import { LngLat, LngLatBounds } from 'maplibre-gl';

  const madrid = new LngLat(-3.7038, 40.4168);
  const bounds = new LngLatBounds(madrid, new LngLat(2.1734, 41.3851));
keywords:
  - maplibre-gl
  - ui.map
  - ui
  - map
  - maplibre
  - vector tiles
  - webgl
  - maps
  - open-source
