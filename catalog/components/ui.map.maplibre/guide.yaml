    - maplibre-gl
use_cases:
  - Store location visualization
  - Delivery area mapping
  - 3D building rendering
  - Population density visualization
  - Heatmap layer creation
use_when:
  - When you need interactive vector maps without a proprietary SDK
  - When GPU-accelerated vector tile rendering is required
avoid_when:
  - The component requires the client to provide a tile source style URL — use a proprietary SDK
tradeoffs:
  - choice: Open-source fork of Mapbox GL JS
    gain: No proprietary SDK lock-in and GPU-accelerated performance
    cost: Requires external tile source configuration by the user
