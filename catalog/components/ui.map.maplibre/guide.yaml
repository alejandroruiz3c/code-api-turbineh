component: ui.map.maplibre
title: ui.map.maplibre
summary: Interactive vector maps (store locations, delivery areas) without a proprietary SDK. Needs a tile
  source (style URL) chosen by the client. A WebGL-accelerated interactive vector map library for publishing
  maps in websites or webview-based applications.
keywords:
  - maplibre-gl
  - ui.map
  - ui
