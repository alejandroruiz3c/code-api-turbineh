schema: turbineh.component-docs/v1
id: ai.partial-json.partial-json
does: Parses incomplete JSON while it is still streaming, to show structured results progressively
does_not: The final value still needs full validation once the stream ends
use_cases:
  - Parsing incomplete JSON strings generated by LLMs during streaming
  - Progressive display of structured data to users
when_to_use:
  - When you need to show structured results progressively before the full stream ends
when_not_to_use:
  - instead: ai.json-repair.jsonrepair
    why: If you need to repair a fully completed but malformed JSON string rather than parsing a live stream
tradeoffs:
  - Provides best-effort values for progressive UI but requires final validation once the stream ends
inputs:
  - name: pnpm add partial-json@0.1.7
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: parse
    kind: export
    about: Parses a JSON string, optionally allowing specific types (strings, objects, etc.) to be partial via
      bitwise OR constants.
  - name: parseStreamingJson
    kind: export
    about: Returns the best-effort value of a streaming JSON string; returns undefined if nothing is parseable yet.
extension_points: []
dependencies:
  package: partial-json
  version: 0.1.7
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No security guarantees provided in documentation
guarantees:
  - claim: parses JSON that is still streaming
    test:
      file: contract.test.ts
      title: parses JSON that is still streaming
limits:
  - The final value still needs full validation once the stream ends
example: |-
  import { parseStreamingJson } from '@/integrations/ai-partial-json';

  const result = parseStreamingJson('{"title": "Week');
  // result: { title: 'Week' }
keywords:
