schema: turbineh.guide/v0.1
component: ai.partial-json.partial-json
title: ai.partial-json.partial-json
summary: Parses incomplete JSON while it is still streaming, to show structured results progressively. The
  final value still needs full validation once the stream ends. A lightweight library for parsing incomplete
  JSON strings, enabling progressive display of structured data while it is still streaming from an LLM.
keywords:
  - partial-json
  - ai.partial-json
  - ai
  - partial
  - json
  - streaming
  - llm
  - parsing
synonyms:
  partial json parser:
    - progressive parsing
use_cases:
  - Streaming LLM responses to users progressively
  - Displaying structured data before the full JSON payload is received
use_when:
  - When you need to show structured results from a stream before the stream ends
avoid_when:
  - The final value still needs full validation once the stream ends — use ai.schema-validation.ajv
tradeoffs:
  - choice: Partial parsing
    gain: Enables progressive UI updates during streaming
    cost: Requires manual validation of the final object once the stream completes
config:
  - name: install
    description: pnpm add partial-json@0.1.7 (exact version, added by TurbineH)
interfaces:
  - name: parse
    signature: import { parse } from "partial-json"
    where: partial-json
  - name: parseStreamingJson
    signature: "function parseStreamingJson(text: string): unknown"
    where: "@/integrations/ai-partial-json"
extension_points:
  - what: Allow constants
    where: parse parameter
    how: Pass a bitwise OR of constants like STR, OBJ, or ARR to control which types are allowed to be partial.
compatibility:
  package: partial-json@0.1.7
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: parses JSON that is still streaming
    test: contract.test.ts › parses JSON that is still streaming
limits:
  - Throws an error if the JSON string is malformed and not simply incomplete.
example: |-
  import { parseStreamingJson } from '@/integrations/ai-partial-json';

  const result = parseStreamingJson('{"title": "Week');
  // result: { title: 'Week' }
