example: |-
  import { i18next } from "i18next";
  const i = i18next.createInstance();
  await i.init({
    lng: "es",
    resources: {
      es: {
        translation: {
          hi: "Hola {{name}}",
          item_one: "{{count}} elemento",
          item_other: "{{count}} elementos",
        },
      },
    },
  });
  i.t("hi", { name: "Ana" });
  i.t("item", { count: 3 });
