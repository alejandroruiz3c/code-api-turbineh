component: data.duration.ms
title: data.duration.ms
summary: Converts human-readable durations to milliseconds and back. Does not handle calendar months. A
  utility for converting human-readable duration strings to milliseconds and numeric millisecond values back
  into human-readable strings.
keywords:
  - ms
  - data.dates
  - data
  - dates
  - milliseconds
  - duration
  - conversion
  - parsing
  - formatting
  - time
synonyms:
  ms:
    - millisecond conversion
use_cases:
  - Converting strings like '2h' to millisecond integers
  - Formatting millisecond timestamps into short duration strings like '1m'
use_when:
  - When you need to parse or format simple time durations
avoid_when:
  - When you need to handle calendar months or complex date logic — use data.dates.date-fns
tradeoffs:
  - choice: Tiny footprint
    gain: Minimal overhead for simple conversions
    cost: Lacks support for calendar-based durations
