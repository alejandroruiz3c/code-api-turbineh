id: data.duration.ms
does: Converts human-readable durations to milliseconds and back
does_not: Does not handle calendar months
use_cases:
  - Converting human-readable duration strings into millisecond integers
  - Converting millisecond integers into human-readable duration strings
when_to_use:
  - When you need to parse or format simple time durations like '2h' or '1m'
when_not_to_use:
  - instead: data.dates.date-fns
    why: Does not handle calendar months
tradeoffs:
  - Provides a tiny footprint for simple conversions but lacks calendar-aware logic.
