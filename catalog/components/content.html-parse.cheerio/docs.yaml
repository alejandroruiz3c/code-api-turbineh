# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: content.html-parse.cheerio
does: Parses HTML and extracts data with CSS selectors (structured extraction from pages and emails)
does_not: Does not fetch pages or run scripts
use_cases:
  - Structured data extraction from HTML pages and emails using CSS selectors
  - Extracting trimmed text content matching specific selectors
  - Extracting absolute http(s) links from HTML documents
when_to_use:
  - When you need to parse HTML and manipulate it using a jQuery-like syntax
  - When you need to extract specific data points from static HTML strings
when_not_to_use:
  - instead: content.frontmatter.gray-matter
    why: If you only need to parse frontmatter instead of full HTML content
  - instead: content.html-dom.linkedom
    why: If you require a different DOM implementation
  - instead: a browser environment or script runner
    why: It does not fetch pages or run scripts
tradeoffs:
  - Provides a fast and consistent DOM model but lacks a full browser environment (no script execution or
    network fetching)
inputs:
  - name: pnpm add cheerio@1.2.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: selectTexts
    kind: export
    about: Returns an array of trimmed, non-empty strings matching a CSS selector from the provided HTML.
  - name: selectLinks
    kind: export
    about: Returns an array of unique absolute http(s) links found in the provided HTML relative to a base URL.
extension_points: []
dependencies:
  package: cheerio
  version: 1.2.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Does not execute scripts within the parsed HTML
guarantees:
  - claim: extracts structured data with CSS selectors
    test:
      file: contract.test.ts
      title: extracts structured data with CSS selectors
limits:
  - Throws an error if the input HTML exceeds 2,000,000 characters
example: |-
  import { selectTexts, selectLinks } from '@/integrations/content-html-parse';

  const html = '<div><a href="https://example.com">Link</a><p class="text">Hello</p></div>';
  const texts = selectTexts(html, '.text');
  const links = selectLinks(html, 'https://example.com');
keywords:
  - cheerio
  - content.html-parse
  - content
  - html
  - parse
  - html parsing
  - css selectors
  - data extraction
  - scraping
