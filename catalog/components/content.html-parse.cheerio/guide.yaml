component: content.html-parse.cheerio
title: content.html-parse.cheerio
summary: Parses HTML and extracts data with CSS selectors (structured extraction from pages and emails). Does
  not fetch pages or run scripts. Parses HTML and extracts data using CSS selectors. It provides tools for
  structured extraction from pages and emails but does not fetch pages or execute scripts.
keywords:
  - cheerio
  - content.html-parse
  - content
  - html
  - parse
  - html parsing
  - css selectors
  - data extraction
  - scraping
synonyms:
  html parser:
    - jQuery-style selector engine
use_cases:
  - Extracting structured data from HTML tables or lists using CSS selectors
  - Retrieving all absolute http(s) links from a document
  - Scraping specific text content from HTML elements
use_when:
  - When you need to parse existing HTML strings with jQuery-style syntax
  - When performing structured data extraction from static HTML content
avoid_when:
  - If you require a full DOM implementation — use content.html-dom.linkedom
  - If you need to run JavaScript or fetch pages automatically — use a headless browser
tradeoffs:
  - choice: Cheerio DOM model
    gain: Blazingly fast parsing and manipulation
    cost: Does not support running scripts or executing JavaScript
