# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: data.ids.ulid
does: Time-sortable unique ids
does_not: Does not hide when an id was created (the time is encoded in it)
use_cases:
  - Generating unique, lexicographically sortable identifiers
  - Creating 128-bit compatible IDs for data structures to prevent fragmentation
  - Generating URL-safe identifiers using Crockford's base32
when_to_use:
  - When you need identifiers that are both unique and sortable by time
  - When you require a more character-efficient encoding than UUIDs
when_not_to_use:
  - instead: UUID v4
    why: If you require purely random distribution without time-based sorting or lexicographical order
tradeoffs:
  - Provides better character efficiency than UUID but requires millisecond-based sorting logic
inputs:
  - name: pnpm add ulid@3.0.2
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: ulid
    kind: export
    about: Generates a 26 character ULID string. Accepts an optional seed time.
  - name: decodeTime
    kind: export
    about: Decodes the time component from a ULID string.
extension_points: []
dependencies:
  package: ulid
  version: 3.0.2
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Uses cryptographically suitable pseudo-random number generators automatically
guarantees:
  - claim: creates time-sortable ids
    test:
      file: contract.test.ts
      title: creates time-sortable ids
limits:
  - Does not encode creation time as a separate metadata field outside the ID itself
example: |-
  import { ulid, decodeTime } from "ulid";
  const id = ulid(1700000000000);
  const time = decodeTime(id);
keywords:
  - ulid
  - data.ids
  - data
  - ids
  - unique identifier
  - sortable
  - base32
  - timestamp
