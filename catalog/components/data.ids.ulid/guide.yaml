component: data.ids.ulid
title: data.ids.ulid
summary: Time-sortable unique ids. Does not hide when an id was created (the time is encoded in it). A
  generator for 128-bit compatible, lexicographically sortable, unique identifiers encoded as 26-character
  Crockford's base32 strings.
keywords:
  - ulid
  - data.ids
  - data
  - ids
  - unique identifier
  - sortable id
  - base32
  - timestamp
synonyms:
  ulid:
    - Universally Unique Lexicographically Sortable Identifier
use_cases:
  - Generating unique identifiers that are sortable by creation time
  - Creating URL-safe identifiers without special characters
  - Replacing UUIDs to reduce data structure fragmentation
use_when:
  - When lexicographical sort order is required for database indexing or sorting
  - When 128-bit compatibility with UUID is necessary
avoid_when:
  - If you require purely random distribution without encoded time information — use UUID v4
tradeoffs:
  - choice: Crockford's base32 encoding
    gain: Better efficiency and readability compared to 36-character UUIDs
    cost: The time component is encoded in the ID and is not hidden
