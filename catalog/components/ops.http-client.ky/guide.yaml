schema: turbineh.guide/v0.1
component: ops.http-client.ky
title: ops.http-client.ky
summary: Small fetch-based HTTP client with retries and timeouts for external APIs. Server or browser fetch
  only. A small fetch-based HTTP client providing retries, timeouts, and JSON validation for external APIs.
keywords:
  - ky
  - ops.http-client
  - ops
  - http
  - client
  - fetch
  - retry
  - json
  - validation
synonyms:
  http client:
    - API Client
use_cases:
  - Consuming external HTTPS APIs with automatic retries for idempotent methods
  - Validating external JSON responses against Zod schemas
  - Managing API requests with fixed base URLs and custom headers
use_when:
  - When you need a lightweight wrapper around Fetch with built-in retry logic
  - When you require automatic error throwing for non-2xx status codes
avoid_when:
  - When you need to limit the number of concurrent outgoing requests rather than just retrying failed ones —
    use ops.concurrency.p-limit
  - When you need complex retry logic not tied specifically to HTTP request lifecycle — use ops.retry.p-retry
tradeoffs:
  - choice: Fetch-based architecture
    gain: Minimal footprint and compatibility with modern runtimes (Node, Bun, Deno)
    cost: Requires a runtime that supports the Fetch API
  - choice: Automatic retries
    gain: Improved resilience for transient network errors
    cost: Can lead to increased latency if not configured with appropriate limits
