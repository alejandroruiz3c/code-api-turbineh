schema: turbineh.component-docs/v1
id: ops.http-client.ky
does: Small fetch-based HTTP client with retries and timeouts for external APIs
does_not: Server or browser fetch only
use_cases:
  - Making HTTP requests to external HTTPS APIs
  - Fetching and validating JSON resources using Zod schemas
  - Performing idempotent retries for GET and HEAD requests
when_to_use:
  - When a fetch-based client with built-in timeout and retry logic is needed
when_not_to_use:
  - instead: ops.retry.p-retry
    why: If you need custom retry logic not limited to idempotent methods
  - instead: ops.concurrency.p-limit
    why: If you need to control request concurrency rather than just retries
tradeoffs:
  - Provides convenience over native fetch but requires a modern runtime supporting Fetch API
inputs:
  - name: pnpm add ky@2.1.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: createApiClient
    kind: export
    about: Creates a KyInstance configured with a fixed HTTPS base URL, 10s timeout, and 2 retries for GET/HEAD
      methods.
  - name: getJson
    kind: export
    about: Fetches a JSON resource via a KyInstance and validates it against a Zod schema.
  - name: ky
    kind: export
    about: The base ky client for making HTTP requests.
  - name: KyInstance
    kind: export
    about: The type representing a configured ky client instance.
extension_points:
  - Hooks for request/response lifecycle
dependencies:
  package: ky
  version: 2.1.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Enforces HTTPS protocol for all clients created via createApiClient
  - Validates external JSON data against provided schemas via getJson
guarantees:
  - claim: creates configured clients
    test:
      file: contract.test.ts
      title: creates configured clients
limits:
  - createApiClient only supports HTTPS protocols
example: |-
  import { createApiClient, getJson } from '@/integrations/ops-http-client';

  const client = createApiClient('https://api.example.com');
  // Note: schema must be provided by caller as per getJson signature
  // await getJson(client, '/path', someZodSchema);
keywords:
  - ky
  - ops.http-client
  - ops
  - http
  - client
  - fetch
  - retry
  - timeout
  - json
  - validation
