schema: turbineh.guide/v0.1
component: ai.json-repair.jsonrepair
title: ai.json-repair.jsonrepair
summary: "Repairs almost-valid JSON produced by models (missing quotes, trailing commas, code fences). Does
  not validate the shape: validate the repaired value with a schema. Repairs almost-valid JSON produced by
  models, including issues like missing quotes, trailing commas, single quotes, and code fences."
keywords:
  - jsonrepair
  - ai.json-repair
  - ai
  - json
  - repair
  - json repair
  - llm parsing
  - model output
  - syntax fix
  - json recovery
synonyms:
  json repair:
    - JSON fixer
    - broken JSON parser
use_cases:
  - Repairing model-generated JSON containing Python constants like True/False/None
  - Fixing truncated JSON or JSON with missing closing brackets
  - Cleaning up JSON wrapped in markdown code fences
  - Converting newline delimited JSON into valid arrays
use_when:
  - When model output is syntactically invalid but structurally recognizable
  - When dealing with common LLM formatting errors like trailing commas or single quotes
avoid_when:
  - The component does not validate the shape of the repaired value; use a schema validator afterwards — use
    ai.schema-validation.ajv
tradeoffs:
  - choice: Repairing instead of rejecting
    gain: Increases robustness of LLM pipelines by recovering usable data from minor syntax errors
    cost: Does not guarantee the resulting object matches a specific schema
