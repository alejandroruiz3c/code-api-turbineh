schema: turbineh.guide/v0.1
component: storage.objects.vercel-blob
title: storage.objects.vercel-blob
summary: Stores files in Vercel Blob storage. Vercel-specific. A JavaScript API client for interacting with
  Vercel Blob storage, supporting both server-side and client-side file uploads.
keywords:
  - "@vercel/blob"
  - storage.objects
  - storage
  - objects
  - vercel
  - blob
  - object-storage
  - upload
  - files
use_cases:
  - Server-side file uploads for small files up to 4.5 MB on Vercel-hosted sites.
  - Client-side direct uploads for files up to 5 TB.
  - Managing blob storage via put, del, and list operations.
use_when:
  - When using Vercel Blob storage as your object storage provider.
  - When you need to upload large files (up to 5 TB) directly from the client.
avoid_when:
  - When you require non-Vercel specific object storage — use storage.objects.aws-s3
  - When you need an alternative S3-compatible approach — use storage.objects.s3-presigner
tradeoffs:
  - choice: Server uploads
    gain: Straightforward implementation.
    cost: Limited to 4.5 MB request body size on Vercel-hosted websites.
  - choice: Client uploads
    gain: Supports files up to 5 TB.
    cost: Requires more complex implementation.
config:
  - name: install
    description: pnpm add @vercel/blob@2.8.0 (exact version, added by TurbineH)
  - name: BLOB_READ_WRITE_TOKEN
    description: Read-write token of the Vercel Blob store (vercel_blob_rw_…), set by Vercel when a store is connected;
      the SDK reads it from the environment. Without it put and del throw — keep a local fallback where the app must
      run without Vercel (the storefront recipe stores images in PostgreSQL then).
