compatibility:
  package: "@vercel/blob@2.8.0"
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network (the Vercel Blob API), no filesystem, no database."
  - Client uploads allow secure direct transfer from browser to Vercel Blob.
guarantees:
  - claim: exposes put, list and delete
    test: contract.test.ts › exposes put, list and delete
  - claim: put uploads the bytes with the bearer token and content type and returns the public URL
    test: contract.test.ts › put uploads the bytes with the bearer token and content type and returns the public URL
  - claim: del sends the URLs to delete
    test: contract.test.ts › del sends the URLs to delete
  - claim: a wrong token is refused and nothing is stored
    test: contract.test.ts › refuses a wrong token (the error surfaces, nothing is stored)
limits:
  - Server uploads are limited to 4.5 MB on Vercel-hosted websites.
  - Contract tests run against a local stand-in of the Blob API (VERCEL_BLOB_API_URL), not a live store.
  - The curated glue uploads public objects only (no private access, multipart or client uploads).
example: |-
  // Server code (route handler or server action). The SDK reads BLOB_READ_WRITE_TOKEN from the environment.
  import { del, put } from "@vercel/blob";

  export async function storeAvatar(userId: string, png: Buffer): Promise<string> {
    const blob = await put(`avatars/${userId}.png`, png, {
      access: "public",
      contentType: "image/png",
      addRandomSuffix: false,
    });
    return blob.url;
  }

  export async function removeAvatar(url: string): Promise<void> {
    await del(url);
  }
