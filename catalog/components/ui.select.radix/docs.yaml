example: |-
  import { Select } from "@radix-ui/react-select";

  const MySelect = () => (
    <Select.Root defaultValue="eu">
      <Select.Trigger aria-label="Region">
        <Select.Value placeholder="Pick" />
      </Select.Trigger>
    </Select.Root>
  );
