component: data.timezones.date-fns-tz
title: data.timezones.date-fns-tz
summary: Time-zone aware formatting and conversion on top of date-fns. Does not include a time-zone picker UI.
  Time-zone aware formatting and conversion on top of date-fns using the Intl API.
keywords:
  - date-fns-tz
  - data.timezones
  - data
  - timezones
  - timezone
  - date-fns
  - formatting
  - conversion
  - intl
use_cases:
  - Formatting dates in specific IANA time zones regardless of system time zone
  - Converting zoned date strings to UTC Date objects
  - Handling time zone offsets without including large time zone data bundles
use_when:
  - When using date-fns v3 and requiring IANA time zone support
  - When you want to avoid large bundle sizes by leveraging the browser's Intl API
avoid_when:
  - If you prefer a library that manages its own date-time classes instead of plain JS Date objects — use
    data.dates.dayjs
  - This component does not include user interface elements for selecting time zones — use a time-zone picker
    UI
tradeoffs:
  - choice: Intl API dependency
    gain: No need to include large time zone data in code bundles
    cost: Requires modern browsers or a polyfill for older environments
config:
  - name: install
    description: pnpm add date-fns-tz@3.2.0 (exact version, added by TurbineH)
interfaces:
  - name: formatInTimeZone
    signature: import { formatInTimeZone } from "date-fns-tz"
    where: date-fns-tz
  - name: fromZonedTime
    signature: import { fromZonedTime } from "date-fns-tz"
    where: date-fns-tz
extension_points:
  - what: date-fns/format
    where: format
    how: Extends date-fns/format with support for all time zone tokens, including z..zzzz
compatibility:
