schema: turbineh.guide/v0.1
component: ai.schema-validation.ajv
title: ai.schema-validation.ajv
summary: Validates JSON against JSON Schema (structured model output, tool arguments, imported data). Does not
  repair invalid data. A high-performance JSON Schema validator for Node.js and browsers that supports
  multiple JSON Schema drafts and JSON Type Definition.
keywords:
  - ajv
  - ai.schema-validation
  - ai
  - schema
  - validation
  - json-schema
  - json-type-definition
  - schema-compliance
synonyms:
  json validator:
    - Schema Validator
use_cases:
  - Validating structured model output from LLMs
  - Validating tool arguments in agentic workflows
  - Validating imported data against predefined schemas
use_when:
  - When you need to ensure JSON data conforms to a specific schema
  - When high validation speed is required
avoid_when:
  - This component does not repair invalid data; it only validates it — use ai.json-repair.jsonrepair
tradeoffs:
  - choice: Strict mode
    gain: Ensures schema compliance and prevents unexpected behavior
    cost: May reject valid JSON that contains properties not explicitly defined in the schema if
      additionalProperties is false
config:
  - name: install
    description: pnpm add ajv@8.20.0 (exact version, added by TurbineH)
interfaces:
  - name: Ajv
    signature: import Ajv from "ajv"
    where: ajv
  - name: ErrorObject
    signature: import { ErrorObject } from "ajv"
    where: ajv
  - name: validateJson
    signature: "function validateJson( schema: object, value: unknown, ):"
    where: "@/integrations/ai-schema-validation"
extension_points:
  - what: Schema compilation
    where: Ajv class
    how: Use ajv.compile(schema) to create a validation function.
compatibility:
  package: ajv@8.20.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Errors are designed to be short and safe to log without echoing input values.
guarantees:
  - claim: validates structured output against a JSON Schema
    test: contract.test.ts › validates structured output against a JSON Schema
limits:
  - Does not repair invalid data
example: |-
  import Ajv from "ajv";

  const ajv = new Ajv({ allErrors: true });
  const validate = ajv.compile({
    type: "object",
    properties: {
      category: { enum: ["bug", "billing", "other"] },
      priority: { type: "integer", minimum: 1, maximum: 3 },
    },
    required: ["category", "priority"],
    additionalProperties: false,
  });
  console.log(validate({ category: "bug", priority: 2 })); // → true
  console.log(validate({ category: "spam", priority: 9, extra: 1 })); // → false
  console.log(validate.errors?.length); // → >= 3
