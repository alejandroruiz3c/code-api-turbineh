schema: turbineh.component-docs/v1
id: ui.notifications.react-hot-toast
does: Toast notifications
does_not: Not for persistent alerts
use_cases:
  - Triggering toast notifications from anywhere in a React application
  - Displaying automatic loaders from promises using a Promise API
  - Providing lightweight, accessible notifications
when_to_use:
  - When you need lightweight (<5kb) toast notifications
  - When you require a Promise API for automatic loading states
when_not_to_use:
  - instead: persistent alerts
    why: Not for persistent alerts
tradeoffs:
  - Provides headless hooks for custom implementations at the cost of using the provided default styles if not
    customized
inputs:
  - name: pnpm add react-hot-toast@2.6.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: toast
    kind: export
    about: Function to trigger notifications, including success states
  - name: Toaster
    kind: export
    about: Component that renders all emitted notifications
extension_points:
  - useToaster hook for creating custom notification logic
dependencies:
  package: react-hot-toast
  version: 2.6.1
  runtime: node@>=20
  peers:
    react: ">=16"
    react-dom: ">=16"
    "@types/react": "*"
    "@types/react-dom": "*"
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@>=16, react-dom@>=16, @types/react@*, @types/react-dom@*."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No external service dependencies or network/fs/db effects reported
guarantees:
  - claim: exposes the toaster and toast API
    test:
      file: contract.test.ts
      title: exposes the toaster and toast API
limits:
  - Not intended for persistent alerts
example: |-
  import { toast, Toaster } from 'react-hot-toast';

  const App = () => (
    <>
      <Toaster />
      <button onClick={() => toast('Here is your toast.')}>
        Make me a toast
      </button>
    </>
  );
keywords:
  - react-hot-toast
  - ui.notifications
  - ui
  - notifications
  - react
  - toast
  - lightweight
  - accessible
  - headless
