schema: turbineh.guide/v0.1
component: files.mime.mime
title: files.mime.mime
summary: Maps file extensions to MIME types and back. Does not inspect file contents. A library for mapping
  file extensions to MIME types and vice versa using the mime-db.
keywords:
  - mime
  - files.type-detection
  - files
  - type
  - detection
  - extension
  - type-detection
  - content-type
  - mapping
synonyms:
  mime mapping:
    - MIME type lookup
    - extension lookup
use_cases:
  - Determining MIME types from file paths or extensions
  - Retrieving file extensions from MIME types
  - Handling multiple extensions for a single MIME type
use_when:
  - When you need to map file extensions to their corresponding MIME types
  - When you need to find the extension associated with a specific MIME type
avoid_when:
  - When you need to inspect actual file contents rather than just relying on extensions or paths — use
    files.type-detection.file-type
tradeoffs:
  - choice: Compact and dependency-free design
    gain: Small footprint and high performance
    cost: Does not perform content inspection
config:
  - name: install
    description: pnpm add mime@4.1.0 (exact version, added by TurbineH)
interfaces:
  - name: mime
    signature: import mime from "mime"
    where: mime
extension_points:
  - what: Custom Mime instances
    where: new Mime() constructor
    how: Create a new instance by passing type maps to the constructor.
compatibility:
  package: mime@4.1.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: maps extensions and types
    test: contract.test.ts › maps extensions and types
limits:
