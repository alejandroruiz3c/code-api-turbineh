schema: turbineh.component-docs/v1
id: ui.styling.clsx
does: Builds className strings from conditions
does_not: Does not resolve conflicting Tailwind classes
use_cases:
  - Conditionally constructing className strings using objects, arrays, or variadic arguments.
  - Building class strings from truthy values while discarding falsey values.
when_to_use:
  - When you need a tiny utility to manage dynamic CSS classes.
when_not_to_use:
  - instead: manual string concatenation
    why: clsx provides a structured way to handle conditional logic for classes.
  - instead: Tailwind CSS IntelliSense configuration
    why: clsx does not resolve conflicting Tailwind classes.
tradeoffs:
  - The default version supports objects and arrays but is larger (239B) than the lite version (140B).
inputs:
  - name: pnpm add clsx@2.1.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: clsx
    kind: export
    about: A function that accepts any number of arguments (Object, Array, Boolean, or String) and returns a
      joined string of truthy class names.
extension_points: []
dependencies:
  package: clsx
  version: 2.1.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access.
guarantees:
  - claim: joins truthy classes
    test:
      file: contract.test.ts
      title: joins truthy classes
limits:
  - Does not resolve conflicting Tailwind classes.
example: |-
  import { clsx } from 'clsx';

  clsx('a', false && 'b', { c: true, d: false }, ['e']); // 'a c e'
keywords:
