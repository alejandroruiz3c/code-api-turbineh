schema: turbineh.component-docs/v1
id: data.money.currency-js
does: Exact money arithmetic and formatting
does_not: Does not convert currencies
use_cases:
  - Exact money arithmetic
  - Currency value formatting
when_to_use:
  - When performing addition or multiplication on monetary values to avoid floating point errors
when_not_to_use:
  - instead: currency conversion
    why: Does not convert currencies
tradeoffs:
  - Lightweight library but lacks built-in currency conversion capabilities
inputs:
  - name: pnpm add currency.js@2.0.4
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: currency
    kind: export
    about: Function to initialize a currency object for arithmetic and formatting
extension_points: []
