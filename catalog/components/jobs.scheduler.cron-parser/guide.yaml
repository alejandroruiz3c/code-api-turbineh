example: |-
  import { CronExpressionParser } from "cron-parser";

  const parser = CronExpressionParser.parse("0 9 * * 1", {
    currentDate: new Date("2026-10-13T00:00:00Z"),
    tz: "UTC",
  });
  const nextRun = parser.next();
