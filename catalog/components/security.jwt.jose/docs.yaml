schema: turbineh.component-docs/v1
id: security.jwt.jose
does: Standards-based JWT/JWS/JWE signing and verification with WebCrypto
does_not: Does not manage key rotation or storage
use_cases:
  - Standards-based JWT, JWS, and JWE signing and verification
  - JSON Web Key (JWK) and JWKS management
  - Encryption and decryption of JSON Web Tokens
when_to_use:
  - When implementing authentication using JWTs in Web-interoperable runtimes like Node.js, Browser,
    Cloudflare Workers, Deno, or Bun
when_not_to_use:
  - instead: security.password-hash.bcryptjs
    why: The component does not manage key rotation or storage
tradeoffs:
  - Provides tree-shakeable ESM with zero dependencies
inputs:
  - name: pnpm add jose@6.2.12
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: SignJWT
    kind: export
    about: Class for signing JSON Web Tokens
  - name: jwtVerify
    kind: export
    about: Function for verifying JSON Web Tokens and their claims set
extension_points: []
dependencies:
  package: jose
  version: 6.2.12
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Uses WebCrypto for cryptographic operations
guarantees:
  - claim: The module signs and verifies tokens, rejecting a wrong key
    test:
      file: contract.test.ts
      title: signs and verifies, rejecting a wrong key
limits:
  - Does not manage key rotation or storage
example: |-
  import { SignJWT, jwtVerify } from 'jose';

  const key = new TextEncoder().encode('k'.repeat(32));
  const jwt = await new SignJWT({ sub: 'u1' })
    .setProtectedHeader({ alg: 'HS256' })
    .setExpirationTime('5m')
    .sign(key);

  const { payload } = await jwtVerify(jwt, key);
keywords:
  - jose
  - security.jwt
  - security
  - jwt
  - jws
  - jwe
  - jwk
  - webcrypto
