security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Supports JWA, JWS, JWE, JWT, JWK, and JWKS
guarantees:
  - claim: signs and verifies, rejecting a wrong key
    test: contract.test.ts › signs and verifies, rejecting a wrong key
limits:
  - Does not manage key rotation or storage
example: |-
  import { SignJWT, jwtVerify } from "jose";

  const key = new TextEncoder().encode("k".repeat(32));
  const jwt = await new SignJWT({ sub: "u1" })
    .setProtectedHeader({ alg: "HS256" })
    .setExpirationTime("5m")
    .sign(key);
  console.log((await jwtVerify(jwt, key)).payload.sub); // → "u1"
  await jwtVerify(jwt, new TextEncoder().encode("x".repeat(32))).catch((err: unknown) => console.log(err)); // → rejects: throws
