component: security.jwt.jose
title: security.jwt.jose
summary: Standards-based JWT/JWS/JWE signing and verification with WebCrypto. Does not manage key rotation or
  storage. Standards-based JWT, JWS, and JWE signing and verification using WebCrypto across multiple
  runtimes.
keywords:
  - jose
  - security.jwt
  - security
  - jwt
  - jws
  - jwe
  - jwk
  - jwks
  - webcrypto
synonyms:
  jose:
    - JSON Object Signing and Encryption
use_cases:
  - Signing JSON Web Tokens (JWT) for authentication
  - Verifying JWT signatures and claims
  - Encrypting and decrypting JSON Web Encryption (JWE) tokens
  - Managing JSON Web Keys (JWK) and JWKS
use_when:
  - When needing standards-compliant JOSE implementation in Web-interoperable runtimes like Node.js, Browser,
    Cloudflare Workers, Deno, or Bun
avoid_when:
  - If you need password hashing instead of token signing — use security.password-hash.bcryptjs
tradeoffs:
  - choice: WebCrypto-based implementation
    gain: High interoperability across different JavaScript runtimes
    cost: Requires environment support for WebCrypto APIs
