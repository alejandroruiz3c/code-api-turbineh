schema: turbineh.component-docs/v1
id: files.barcode.bwip-js
does: Barcodes (EAN, UPC, Code 128, QR, DataMatrix) as PNG or SVG for products and labels
does_not: Does not scan barcodes
use_cases:
  - Generating linear and two-dimensional barcodes (EAN, UPC, Code 128, QR, DataMatrix) for products and labels
  - Creating barcode images in SVG format for all platforms
  - Generating PNG images in Node.js or React Native environments
when_to_use:
  - When you need to support over 100 different barcode types and standards
  - When you require barcode generation in a browser, Node.js, or React Native
when_not_to_use:
  - instead: files.qr.qrcode
    why: If you only need to generate QR codes
  - instead: scanning approach
    why: This component does not scan barcodes
tradeoffs:
  - Provides high variety of barcode standards but requires specific platform-specific packages for optimal
    build stack compatibility
inputs:
  - name: pnpm add bwip-js@4.11.4
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: bwipjs
    kind: export
    about: The main entry point for barcode generation methods
extension_points:
  - Custom drawing interface via the annotated example drawing object
dependencies:
  package: bwip-js
  version: 4.11.4
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access is performed by this component.
guarantees:
  - claim: renders an EAN-13 barcode as SVG
    test:
      file: contract.test.ts
      title: renders an EAN-13 barcode as SVG
limits:
  - Does not scan barcodes
example: |-
  import { bwipjs } from "bwip-js";

  const svg = bwipjs.toSVG({
    bcid: "ean13",
    text: "5901234123457"
  });
keywords:
