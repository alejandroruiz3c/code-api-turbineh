  barcode writer in pure javascript:
    - BWIPP
use_cases:
  - Generating EAN, UPC, Code 128, QR, and DataMatrix barcodes
  - Creating product labels and barcodes for web or server-side environments
use_when:
  - When you need to generate a wide variety of linear and two-dimensional barcodes
  - When you require SVG output across all platforms
avoid_when:
  - If you only need to generate QR codes — use files.qr.qrcode
  - If you need to scan/read barcodes rather than generate them — use scanning approach
