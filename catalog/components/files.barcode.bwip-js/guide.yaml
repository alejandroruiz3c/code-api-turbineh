title: bwip-js
summary: Barcodes (EAN, UPC, Code 128, QR, DataMatrix) as PNG or SVG for products and labels. Does not scan
  barcodes. A JavaScript barcode generator supporting over 100 barcode types and standards, capable of
  rendering as PNG, SVG, or canvas.
