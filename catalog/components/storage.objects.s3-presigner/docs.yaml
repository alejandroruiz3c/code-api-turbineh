schema: turbineh.component-docs/v1
id: storage.objects.s3-presigner
does: Short-lived signed URLs to upload or download private files directly
does_not: Requires the S3 client
use_cases:
  - Generate short-lived signed URLs for uploading files to S3 via PutObjectCommand
  - Generate short-lived signed URLs for downloading private files via GetObjectCommand
  - Sign specific x-amz-* headers using unhoistableHeaders to improve security
when_to_use:
  - When you need to provide direct upload or download access to private S3 objects without exposing long-term
    credentials
when_not_to_use:
  - instead: storage.objects.aws-s3
    why: If you require a full S3 client implementation rather than just a presigner
  - instead: storage.objects.vercel-blob
    why: If you are using Vercel Blob storage instead of S3-compatible storage
tradeoffs:
  - Provides offline URL generation but requires an existing S3 client and command to function
inputs:
  - name: pnpm add @aws-sdk/s3-request-presigner@3.1141.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: getSignedUrl
    kind: export
    about: Generates a presigned URL from an S3 client and a command with optional expiration and header
      configuration
extension_points: []
dependencies:
  package: "@aws-sdk/s3-request-presigner"
  version: 3.1141.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Supports signing x-amz-* headers by including them in unhoistableHeaders
  - Allows enforcing signable headers for non-x-amz-* headers via signableHeaders
guarantees:
  - claim: creates a short-lived signed URL offline
    test:
      file: contract.test.ts
      title: creates a short-lived signed URL offline
limits:
  - Requires an S3 client instance to generate URLs via getSignedUrl
example: |-
  import { getSignedUrl } from "@aws-sdk/s3-request-presigner";

  // Note: Requires S3Client and Command from @aws-sdk/client-s3
  // await getSignedUrl(client, command, { expiresIn: 300 });
keywords:
  - "@aws-sdk/s3-request-presigner"
  - storage.objects
  - storage
