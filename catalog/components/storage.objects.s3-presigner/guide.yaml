schema: turbineh.guide/v0.1
component: storage.objects.s3-presigner
title: storage.objects.s3-presigner
summary: Short-lived signed URLs to upload or download private files directly. Requires the S3 client.
  Generates short-lived signed URLs for S3 operations using signature V4, allowing direct uploads or downloads
  of private files.
keywords:
  - "@aws-sdk/s3-request-presigner"
  - storage.objects
  - storage
  - objects
  - s3
  - presigned url
  - signature v4
  - aws sdk
synonyms:
  s3 presigner:
    - S3 URL signer
use_cases:
  - Directly uploading files to S3 via client-side requests
  - Directly downloading private files via client-side requests
  - Signing specific x-amz-* headers for improved security
use_when:
  - When you need to grant temporary access to private S3 objects without exposing long-term credentials
  - When you want to offload file transfer traffic from your server to S3
avoid_when:
  - If you require full S3 client functionality rather than just URL signing — use storage.objects.aws-s3
  - If you are using Vercel's blob storage instead of AWS S3 — use storage.objects.vercel-blob
tradeoffs:
  - choice: Presigned URLs
    gain: Reduces server load by allowing clients to interact directly with storage
    cost: Requires careful management of expiration times and header signing
config:
  - name: install
    description: pnpm add @aws-sdk/s3-request-presigner@3.1141.0 (exact version, added by TurbineH)
interfaces:
  - name: getSignedUrl
    signature: import { getSignedUrl } from "@aws-sdk/s3-request-presigner"
    where: "@aws-sdk/s3-request-presigner"
extension_points:
  - what: unhoistableHeaders
    where: getSignedUrl parameters
    how: Provide a Set of x-amz-* headers to be forced in the upload request
  - what: signableHeaders
    where: getSignedUrl parameters
    how: Provide headers that are not x-amz-* to be enforced in the presigned url's request
compatibility:
  package: "@aws-sdk/s3-request-presigner@3.1141.0"
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Supports signing x-amz-* headers via unhoistableHeaders to ensure they are present in the request
  - Allows signing non-x-amz headers via signableHeaders
guarantees:
  - claim: creates a short-lived signed URL offline
    test: contract.test.ts › creates a short-lived signed URL offline
limits:
  - Requires an S3 client instance to generate URLs via getSignedUrl
example: |-
  import { getSignedUrl } from "@aws-sdk/s3-request-presigner";

  // Note: Requires an S3Client and Command from @aws-sdk/client-s3
  const url = await getSignedUrl(client, command, { expiresIn: 3600 });
