component: ai.sse-parsing.eventsource-parser
title: ai.sse-parsing.eventsource-parser
summary: "Parses Server-Sent Events streams (streamed model answers, progress events). Does not open
  connections: feed it the bytes of a fetch response. A source-agnostic streaming parser for Server-Sent
  Events (SSE) that processes data chunks as they arrive."
keywords:
  - eventsource-parser
  - ai.sse-parsing
  - ai
  - sse
  - parsing
  - server-sent events
  - streaming
  - parser
  - eventstream
synonyms:
  sse parser:
    - EventSource parser
use_cases:
  - Parsing streamed model answers from LLM APIs
  - Processing progress events in real-time streams
  - Building custom EventSource clients or polyfills
use_when:
  - When you have raw bytes from a fetch response or ReadableStream and need to extract SSE messages
  - When you need to handle partial data chunks without managing connection state
avoid_when:
  - If you need a modern, feature-rich client implementation that manages the connection itself — use
    eventsource-client
tradeoffs:
  - choice: Source-agnostic design
    gain: Can be used in any environment (browser, Node.js, Deno) with any data source
    cost: Does not handle the network connection or HTTP request logic
config:
  - name: install
    description: pnpm add eventsource-parser@4.1.1 (exact version, added by TurbineH)
interfaces:
  - name: createParser
    signature: import { createParser } from "eventsource-parser"
    where: eventsource-parser
  - name: EventSourceMessage
    signature: import { EventSourceMessage } from "eventsource-parser"
    where: eventsource-parser
  - name: readSseStream
    signature: "async function readSseStream( body: ReadableStream<Uint8Array>, onEvent: (event: EventSourceMessage)"
    where: "@/integrations/ai-sse-parsing"
extension_points:
  - what: Event handling callbacks
    where: createParser configuration object
    how: Provide onEvent, onId, or onRetry functions.
compatibility:
  package: eventsource-parser@4.1.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: parses a Server-Sent Events stream fed in arbitrary chunks
    test: contract.test.ts › parses a Server-Sent Events stream fed in arbitrary chunks
limits:
  - Does not open network connections; requires manual feeding of bytes.
example: |-
  import { createParser, type EventSourceMessage } from 'eventsource-parser';
  const parser = createParser({
    onEvent: (event: EventSourceMessage) => {
      console.log(event.data);
    }
  });
  parser.feed('data: hello\n\n');
