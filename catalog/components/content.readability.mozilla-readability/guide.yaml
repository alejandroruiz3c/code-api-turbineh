schema: turbineh.guide/v0.1
component: content.readability.mozilla-readability
title: content.readability.mozilla-readability
summary: Extracts the main article content of a web page, dropping navigation, ads and boilerplate. Needs a DOM document
  (use content.html-dom); does not fetch pages.
keywords:
  - "@mozilla/readability"
  - content.readability
  - content
  - readability
  - article extraction
  - content parsing
  - dom manipulation
  - mozilla
synonyms:
  readability:
    - article extractor
    - content cleaner
use_cases:
  - Extracting clean text content from HTML documents for processing
  - Generating reader-view style summaries from web pages
use_when:
  - When you have a DOM document and need to isolate the primary article content
avoid_when:
  - This component requires a DOM document and does not fetch pages itself — use content.html-dom.linkedom
  - Use for metadata extraction from files rather than article content extraction from HTML — use
    content.frontmatter.gray-matter
tradeoffs:
  - choice: Readability mutation
    gain: Efficiently processes the DOM to find content
    cost: The parse() method mutates the provided document
config:
  - name: install
    description: pnpm add @mozilla/readability@0.6.0 (exact version, added by TurbineH)
interfaces:
  - name: Readability
    signature: import { Readability } from "@mozilla/readability"
    where: "@mozilla/readability"
  - name: HtmlDocument
    signature: type HtmlDocument
    where: "@/integrations/content-readability"
  - name: readArticle
    signature: "function readArticle(doc: HtmlDocument):"
    where: "@/integrations/content-readability"
extension_points:
  - what: Customizing how content is produced from the root element
    where: serializer option in Readability constructor
    how: Provide a function that takes an element and returns its processed content (e.g., el => el)
  - what: Preserving specific CSS classes during parsing
    where: classesToPreserve option in Readability constructor
    how: Pass an array of class names to keep when keepClasses is false
compatibility:
  package: "@mozilla/readability@0.6.0"
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: extracts the main article from a page, without navigation
    test: contract.test.ts › extracts the main article from a page, without navigation
limits:
  - Requires an existing DOM document; cannot fetch URLs independently
example: |-
  import { Readability } from "@mozilla/readability";
  import { parseHTML } from "linkedom";

  const body =
    "<p>" +
    "Solar panels on schools cut energy bills by a third in the pilot. ".repeat(12) +
    "</p>";
  const { document } = parseHTML(
    `<html><head><title>Pilot results</title></head><body><nav>Home | About | Contact</nav><article><h1>Pilot results</h1>${body}</article><footer>Cookie settings</footer></body></html>`,
  );
  const article = new Readability(document as unknown as Document).parse();
  console.log(article?.textContent); // → contains "Solar panels on schools"
  console.log(article?.textContent); // → does not contain "Cookie settings"
