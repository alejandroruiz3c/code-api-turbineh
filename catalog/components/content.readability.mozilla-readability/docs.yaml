# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: content.readability.mozilla-readability
does: Extracts the main article content of a web page, dropping navigation, ads and boilerplate
does_not: Needs a DOM document (use content.html-dom); does not fetch pages
use_cases:
  - Extracting the main article content from a web page for reader views
  - Removing navigation, ads, and boilerplate from HTML content
when_to_use:
  - When you have a DOM document and need to isolate the core article text and title
when_not_to_use:
  - instead: content.html-dom.linkedom
    why: This component requires an existing DOM document and does not fetch pages itself
tradeoffs:
  - The parse() method mutates the provided DOM document
inputs:
  - name: pnpm add @mozilla/readability@0.6.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Readability
    kind: export
    about: A class used to parse a DOM document into an article object
  - name: HtmlDocument
    kind: type
    about: A DOM document compatible with the Readability constructor
  - name: readArticle
    kind: export
    about: Extracts the main article title and text from a document, returning null if no readable article is found
extension_points:
  - The serializer option in the Readability constructor allows customizing how the content property is
    produced
dependencies:
  package: "@mozilla/readability"
  version: 0.6.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access is performed
guarantees:
  - claim: extracts the main article from a page, without navigation
    test:
      file: contract.test.ts
      title: extracts the main article from a page, without navigation
limits:
  - Requires a DOM document to function
example: |-
  import { readArticle, type HtmlDocument } from "@/integrations/content-readability";

  async function process(doc: HtmlDocument) {
    const article = readArticle(doc);
    if (article) {
      console.log(article.title, article.text);
    }
  }
keywords:
  - "@mozilla/readability"
  - content.readability
  - content
  - readability
  - article extraction
  - dom parsing
  - content cleaning
  - mozilla
