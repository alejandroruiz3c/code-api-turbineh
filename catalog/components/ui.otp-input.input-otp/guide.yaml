  runtime: node@>=20
  peers:
    react: ^16.8 || ^17.0 || ^18.0 || ^19.0.0 || ^19.0.0-rc
    react-dom: ^16.8 || ^17.0 || ^18.0 || ^19.0.0 || ^19.0.0-rc
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Does not send codes; it only manages the input interface.
guarantees:
  - claim: renders a one-time code input limited to digits
    test: contract.test.ts › renders a one-time code input limited to digits
limits:
  - Does not send codes.
example: |-
  import { createElement as h } from "react";
  import { renderToString } from "react-dom/server";
  import { OTPInput, REGEXP_ONLY_DIGITS } from "input-otp";

  const html = renderToString(
    h(OTPInput, {
      maxLength: 6,
      pattern: REGEXP_ONLY_DIGITS,
      render: () => h("span", null, "slots"),
    }),
  );
  console.log(html); // → contains 'maxLength="6"'
