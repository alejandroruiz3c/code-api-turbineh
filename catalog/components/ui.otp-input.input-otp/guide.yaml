schema: turbineh.guide/v0.1
component: ui.otp-input.input-otp
title: ui.otp-input.input-otp
summary: Accessible one-time-code input for two-factor and email codes. Does not send codes. An accessible,
  unstyled React component that renders a single invisible text input to manage one-time password entry,
  providing full browser support for SMS autofill, screen readers, and native keyboard behaviors.
keywords:
  - input-otp
  - ui.otp-input
  - ui
  - otp
  - input
  - two-factor
  - 2fa
  - verification
  - accessible
  - autofill
synonyms:
  one-time password input:
    - OTP input
    - verification code input
use_cases:
  - Two-factor authentication (2FA)
  - Email verification codes
  - SMS code entry
use_when:
  - When you need an accessible OTP input that supports SMS autofill and native browser text field behaviors
    like select-all and undo.
  - When you want to build a custom UI for OTP slots while maintaining a single real text input for form
    semantics.
avoid_when:
  - If you need a modal dialog instead of a specific input field — use ui.alert-dialog.radix
tradeoffs:
  - choice: Unstyled approach
    gain: Complete control over the visual representation of each digit slot.
    cost: Requires manual implementation of the slot UI and styling.
config:
  - name: install
    description: pnpm add input-otp@1.5.0 (exact version, added by TurbineH)
interfaces:
  - name: OTPInput
    signature: import { OTPInput } from "input-otp"
    where: input-otp
  - name: REGEXP_ONLY_DIGITS
    signature: import { REGEXP_ONLY_DIGITS } from "input-otp"
    where: input-otp
extension_points:
  - what: Custom slot rendering
    where: render prop
    how: Provide a function that receives slot properties (char, placeholderChar, isActive, hasFakeCaret) to
      return custom markup for each digit.
