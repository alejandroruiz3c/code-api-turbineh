# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ai.text-chunking.sentence-splitter
does: Splits text into sentences and size-bounded chunks with overlap for retrieval (RAG) and summaries
does_not: Sizes are measured in characters; count tokens with ai.token-count when exact budgets matter
use_cases:
  - Splitting English and Japanese text into sentences
  - Creating size-bounded text chunks with overlap for RAG retrieval
  - Preparing text for map-reduce summarization
when_to_use:
  - When you need to segment text into sentences or chunks based on character limits
when_not_to_use:
  - instead: ai.token-count.gpt-tokenizer
    why: Sizes are measured in characters; count tokens with ai.token-count when exact budgets matter
tradeoffs:
  - Sentence splitting may not correctly handle nested sentences within quotes or brackets
inputs:
  - name: pnpm add sentence-splitter@5.0.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: split
    kind: export
    about: Splits text into an array of sentence nodes based on TxtAST structure.
  - name: SentenceSplitterSyntax
    kind: export
    about: Enum for identifying node types like Sentence.
  - name: sentences
    kind: export
    about: Returns an array of trimmed sentence strings.
  - name: chunkText
    kind: export
    about: Chunks text into arrays of strings using maxChars and overlapSentences constraints.
extension_points:
  - SeparatorParserOptions for custom separator characters
  - AbbrMarkerOptions for language-specific abbreviation handling
dependencies:
  package: sentence-splitter
  version: 5.0.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access is performed.
guarantees:
  - claim: splits text into sentences
    test:
      file: contract.test.ts
      title: splits text into sentences
limits:
  - A single sentence longer than maxChars is cut at the limit
example: |-
  import { split, SentenceSplitterSyntax } from "sentence-splitter";
  import { sentences, chunkText } from "@/integrations/ai-text-chunking";

  const nodes = split("Hello world.");
  const sentenceList = sentences("Hello world.");
  const chunks = chunkText("Hello world.", { maxChars: 10, overlapSentences: 1 });
keywords:
  - sentence-splitter
  - ai.text-chunking
  - ai
  - text
  - chunking
  - text-splitting
  - sentence-segmentation
  - rag
  - nlp
  - japanese
  - english
