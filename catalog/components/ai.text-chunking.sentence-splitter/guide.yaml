    where: "@/integrations/ai-text-chunking"
extension_points:
  - what: splitOptions
    where: split function arguments
    how: Provide SeparatorParser and AbbrMarker options to customize sentence detection.
compatibility:
  package: sentence-splitter@5.0.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: splits text into sentences
    test: contract.test.ts › splits text into sentences
limits:
  - Chunk sizes are measured in characters, not tokens.
  - Does not split nested sentences within quotes or brackets.
example: |-
  import { split, SentenceSplitterSyntax } from "sentence-splitter";

  const nodes = split("We shipped the order. It arrived on Monday! Was it damaged? No.");
  const sentences = nodes
    .filter((n) => n.type === SentenceSplitterSyntax.Sentence)
    .map((n) => n.raw.trim());
  console.log(sentences); // → [ "We shipped the order.", "It arrived on Monday!", "Was it damaged?"…
