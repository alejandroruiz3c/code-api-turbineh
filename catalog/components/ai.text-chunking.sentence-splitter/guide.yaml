schema: turbineh.guide/v0.1
component: ai.text-chunking.sentence-splitter
title: ai.text-chunking.sentence-splitter
summary: Splits text into sentences and size-bounded chunks with overlap for retrieval (RAG) and summaries.
  Sizes are measured in characters; count tokens with ai.token-count when exact budgets matter. Splits English
  and Japanese text into sentences and size-bounded chunks with overlap for RAG or summarization tasks.
keywords:
  - sentence-splitter
  - ai.text-chunking
  - ai
  - text
  - chunking
  - text splitting
  - sentence segmentation
  - rag
  - nlp
  - japanese text
  - english text
synonyms:
  sentence splitter:
    - text segmenter
    - chunker
use_cases:
  - Retrieval Augmented Generation (RAG) indexing
  - Map-reduce summarization pipelines
  - Text segmentation for NLP tasks
use_when:
  - When you need to split text into sentences based on punctuation or language-specific rules
  - When you need to create overlapping text chunks for retrieval
avoid_when:
  - Sizes are measured in characters; count tokens with ai.token-count when exact budgets matter — use
    ai.token-count.gpt-tokenizer
tradeoffs:
  - choice: Character-based chunking
    gain: Simple implementation and predictable character limits
    cost: Does not account for token counts used by LLM context windows
