schema: turbineh.component/v0.1
id: social.publish.turbineh
version: 0.1.0
status: approved
category: social
source:
  purl: pkg:generic/turbineh/social.publish.turbineh@0.1.0
  repo: https://github.com/alejandroruiz3c/code-api-turbineh
capability:
  does: "Publishes social media posts to connected accounts with each network's current official API: LinkedIn Posts API (/rest/posts with Linkedin-Version, images through the Images API), Facebook Page posts (/{page-id}/feed, /photos), Instagram (/media container + /media_publish) and X (Twitter) posts (POST /2/tweets, images through /2/media/upload). Per-network format and length rules enforced before saving (X weighted 280, LinkedIn 3,000, Instagram 2,200 with an image, 30 hashtags, 20 mentions), optional approval by people who may approve, scheduling in the author's time zone, a unique idempotency key per post, publication by a protected runner route with claims and leases (never twice), retries with exponential backoff honouring Retry-After, an append-only publication log, a month calendar and post list."
  does_not: "Does not write the posts (AI drafts need the AI orchestrator or the ai-agents recipe), publish videos, carousels, stories, reels, polls or threads, post to LinkedIn organization pages, TikTok or other networks, or publish without a person creating (and, when required, approving) each post"
  use_cases: [saas-crud, ai-agents]
  pros:
    [
      "Maintained by TurbineH",
      "Contract-tested against mocks of each provider's documented request and response shapes",
      "Exactly-once by construction: idempotency key, conditional claims, interrupted attempts marked unknown instead of re-sent",
    ]
  cons:
    [
      "Needs a scheduler to call the runner route (Vercel Cron, GitHub Actions, any cron)",
      "Each network's posting permission needs the platform's approval for real customers (Meta App Review for pages_manage_posts / instagram_content_publish; X API is paid per request)",
    ]
  alternatives: [jobs.scheduled.turbineh]
contract:
  inputs:
    [
      "src/social/params/publish.json (networks[], requireApproval, maxAttempts)",
      "Compose form: accounts, text, optional per-network versions, optional public https image URL, local date/time + IANA zone",
      "GET|POST /api/social/publish/run with x-cron-secret: CRON_SECRET or Authorization: Bearer CRON_SECRET",
    ]
  outputs:
    [
      "social_posts rows (status draft → pending_approval → scheduled → publishing → published | retrying | failed | unknown | cancelled, external id and URL)",
      "social_publication_log rows (append-only): created, submitted, approved, attempt, published, retry, failed, unknown, cancelled",
      "{ published, retrying, failed, unknown } per runner call",
    ]
  errors:
    [
      "text over a network's limit, a missing Instagram image or a non-https image URL is refused with the count; nothing is cut",
      "429/5xx/lost requests retried with backoff up to maxAttempts; other 4xx fail at once; refused tokens mark the connection expired",
      "401 without the runner secret, 503 without CRON_SECRET",
    ]
  limits:
    [
      "20 posts per runner call; attempt lease 3 minutes; backoff 30 s–1 h with jitter; images ≤ 5 MB downloaded only from public https hosts (LinkedIn, X)",
      "Instagram: JPEG images, 100 API posts per 24 h per account (Meta); X: 100 posts per 15 min per user",
    ]
compat:
  runtime: node@>=20
  framework: next@^16.0.0
effects:
  network: true
  fs: false
  db: true
  external_services: [linkedin, meta-graph, x-api]
integration:
  strategy: vendored-with-provenance
  install: "Copied by the assembler from files/: src/social/{limits,retry,media,publishers,posts,publish-config,cron-auth}.ts + params/publish.json, src/db/component-social-posts.ts, src/db/sql/120-social-publication-log.sql, the runner route, /dashboard/social/posts (composer, calendar, list, detail with log), unit + contract + E2E tests."
  config: [CRON_SECRET]
  migrations: true
params:
  file: src/social/params/publish.json
  schema: params.schema.json
  entities: [SocialPost, Post, ScheduledPost, PublishedPost, Publication, PublicationLog, PostDraft, ContentCalendar]
quality:
  tests:
    {
      command: "unit (per-network limits incl. X weighting, LinkedIn little text, backoff, image guard) + contract tests of publishing on LinkedIn, Facebook, Instagram and X against the provider mocks + E2E (approval then scheduled publication, retry after a 503, idempotent compose and runner, append-only log, calendar); full gate via verify:recipe",
      passed: true,
      date: 2026-10-16,
    }
security:
  scanned_at: 2026-10-16
  tools: [gitleaks, semgrep, review]
  findings: []
  scope: "First-party source reviewed: runner secret compared in constant time, posts scoped to the workspace, roles checked in the service (create/approve/update), image downloads restricted to public https addresses checked at DNS resolution, provider errors redacted, tokens only from accessTokenFor."
license:
  declared: Apache-2.0
  detected: Apache-2.0
  obligations: [preserve-notice]
evidence:
  - claim: "Publishing to LinkedIn, Facebook, Instagram and X passes contract tests against mocks of the documented endpoints; the approval → schedule → publish → retry → log E2E suite passes in the full verification gate"
    origin: tested
    ref: "verify:recipe saas-crud --with social.connections.turbineh,social.publish.turbineh,social.metrics.turbineh (ADR-0067)"
relations:
  requires: [social.connections.turbineh]
  provides: [social.publish]
  conflicts: []
  tested_with: [recipe.saas-crud, recipe.ai-agents]
