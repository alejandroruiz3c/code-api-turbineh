component: data.csv-export.csv-stringify
title: data.csv-export.csv-stringify
summary: Streaming and sync CSV serialisation with quoting. Does not neutralise spreadsheet formulas by
  default. Streaming and synchronous CSV serialization tool supporting custom formatters, delimiters, quotes,
  and headers.
keywords:
  - csv-stringify
  - data.csv-export
  - data
  - csv
  - export
  - serialization
  - streaming
  - stringify
  - node.js
synonyms:
  csv stringifier:
    - CSV serializer
use_cases:
  - Converting records into CSV text format
  - Streaming large datasets using Node.js Transform API
  - Synchronous CSV generation for small datasets
use_when:
  - When you need to serialize data to CSV via streams, callbacks, or synchronous APIs
  - When you require support for custom delimiters and escape characters
avoid_when:
  - If you need to parse CSV data instead of generating it — use data.csv-import.papaparse
  - If you require a different export implementation — use data.csv-export.turbineh
tradeoffs:
  - choice: Synchronous API
    gain: Simplicity for small datasets
    cost: Blocking behavior for large datasets
  - choice: Streaming API
    gain: Scalability for big data sets
    cost: Increased implementation complexity
