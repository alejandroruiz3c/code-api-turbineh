schema: turbineh.component-docs/v1
id: data.csv-export.csv-stringify
does: Streaming and sync CSV serialisation with quoting
does_not: Does not neutralise spreadsheet formulas by default
use_cases:
  - Streaming CSV serialization for large datasets
  - Synchronous CSV serialization for simple tasks
  - Converting records into CSV text using Node.js stream.Transform API
when_to_use:
  - When you need to convert records to CSV via streaming, callback, or synchronous APIs
  - When you require support for custom delimiters, quotes, and escape characters
when_not_to_use:
  - instead: data.csv-export.turbineh
    why: If you require different export logic
  - instead: data.csv-import.papaparse
    why: If you need to parse CSV instead of stringifying it
tradeoffs:
  - Provides synchronous API for convenience but may block the event loop on very large datasets compared to
    the streaming API
inputs:
  - name: pnpm add csv-stringify@6.9.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: stringify
    kind: export
    about: Converts records into CSV text; available in sync, callback, and stream flavors.
extension_points:
  - Custom formatters
  - Custom delimiters
  - Custom quotes
  - Custom escape characters
dependencies:
  package: csv-stringify
  version: 6.9.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external service dependencies or network access required
guarantees:
  - claim: serialises with header and quoting
    test:
      file: contract.test.ts
      title: serialises with header and quoting
limits:
  - Does not neutralise spreadsheet formulas by default
example: |-
  import { stringify } from "csv-stringify";
  stringify([{ a: "x,y", b: 1 }], { header: true });
