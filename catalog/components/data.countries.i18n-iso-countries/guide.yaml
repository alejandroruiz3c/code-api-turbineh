  - internationalization
synonyms:
  country localization:
    - ISO codes
    - country names
use_cases:
  - Validating ISO 3166-1 alpha-2, alpha-3, or numeric country codes
  - Retrieving localized country names for UI display
  - Generating sorted country selection options for forms
use_when:
  - When you need to map ISO country codes to human-readable names in multiple languages
  - When you need to validate if a string is a valid ISO 3166-1 country code
avoid_when:
  - Does not validate postal addresses — use postal address validation services
tradeoffs:
  - choice: Manual locale registration
    gain: Minimizes bundle size in browser environments by only including required languages
    cost: Requires explicit calls to registerLocale for each language used
