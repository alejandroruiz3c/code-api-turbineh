# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: files.pdf.react-pdf
does: PDF documents (invoices, tickets, reports) written as React components on the server
does_not: Not an HTML-to-PDF converter
use_cases:
  - Generating PDF documents like invoices, tickets, or reports using React components
  - Creating PDF files on the server or in the browser
when_to_use:
  - When you need to define PDF layouts using a React-based declarative syntax
when_not_to_use:
  - instead: an HTML-to-PDF converter
    why: It is not an HTML-to-PDF converter
tradeoffs:
  - Requires writing PDF layouts specifically as React components rather than converting existing HTML
inputs:
  - name: pnpm add @react-pdf/renderer@4.9.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Document
    kind: export
    about: The root component for a PDF document
  - name: Page
    kind: export
    about: A page within a Document
  - name: Text
    kind: export
    about: A component for rendering text content
  - name: renderToBuffer
    kind: export
    about: Renders the React component structure into a Buffer
extension_points: []
dependencies:
  package: "@react-pdf/renderer"
  version: 4.9.0
  runtime: node@>=20
  peers:
    react: ^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database effects are performed by the component.
guarantees:
  - claim: renders an invoice-like PDF on the server
    test:
      file: contract.test.ts
      title: renders an invoice-like PDF on the server
limits:
  - Not an HTML-to-PDF converter
example: |-
  import { Document, Page, Text, renderToBuffer } from '@react-pdf/renderer';

  const doc = (
    <Document>
      <Page>
        <Text>Hello World</Text>
      </Page>
    </Document>
  );

  const buffer = await renderToBuffer(doc);
keywords:
  - "@react-pdf/renderer"
  - files.pdf
  - files
  - pdf
  - react
  - renderer
  - server-side
  - browser
