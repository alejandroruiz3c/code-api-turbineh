  - claim: parses and writes YAML safely
    test: contract.test.ts › parses and writes YAML safely
limits:
  - Maximum input length is 500,000 characters in parseYaml
  - Alias expansion is limited to 50 in parseYaml
example: |-
  import { parse, stringify } from "yaml";

  const value = parse("agent: triage\nsteps:\n  - classify\n  - reply\nmax_tokens: 512\n");
  console.log(value); // → { agent: "triage", steps: ["classify", "reply"], max_tokens: 512 }
  console.log(parse(stringify(value))); // → value
  parse("a: !!js/function 'return 1'"); // does not throw
  console.log(typeof parse("a: !!js/function 'return 1'").a); // → not "function"
