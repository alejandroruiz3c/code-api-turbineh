schema: turbineh.component-docs/v1
id: data.yaml.yaml
does: Parses and writes YAML (agent and prompt configuration, structured output that humans edit)
does_not: Custom tags are disabled by default (safe parsing)
use_cases:
  - Parsing agent and prompt configurations
  - Writing structured output for human editing
when_to_use:
  - When you need to parse or write YAML data safely
when_not_to_use:
  - instead: data.csv-export.csv-stringify
    why: When working with CSV format instead of YAML
tradeoffs:
  - Custom tags are disabled by default for safety
inputs:
  - name: pnpm add yaml@2.9.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: parse
    kind: export
    about: Parses a YAML string into a JavaScript object
  - name: stringify
    kind: export
    about: Converts a JavaScript value to a YAML string
  - name: parseYaml
    kind: export
    about: Parses YAML with bounded size and alias expansion
  - name: toYaml
    kind: export
    about: Converts a value to a YAML string
extension_points: []
dependencies:
  package: yaml
  version: 2.9.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence ISC; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Custom tags are disabled by default to prevent unsafe parsing
guarantees:
  - claim: parses and writes YAML safely
    test:
      file: contract.test.ts
      title: parses and writes YAML safely
limits:
  - Input text length is limited to 500,000 characters in parseYaml
  - Alias expansion is limited to 50 counts in parseYaml
example: |-
  import { parseYaml, toYaml } from '@/integrations/data-yaml';
  const obj = parseYaml('key: value');
  const yaml = toYaml(obj);
keywords:
  - yaml
  - data.yaml
  - data
  - parser
  - stringifier
  - configuration
  - serialization
