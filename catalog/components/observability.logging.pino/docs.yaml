schema: turbineh.component-docs/v1
id: observability.logging.pino
does: Fast structured JSON logging with redaction
does_not: Does not ship logs to a backend by itself
use_cases:
  - Fast structured JSON logging
  - Low overhead application monitoring
  - Redacting sensitive information from logs
when_to_use:
  - When high-performance logging is required to avoid application throttling
  - When structured JSON output is needed for log processors
when_not_to_use:
  - instead: external log shippers
    why: Does not ship logs to a backend by itself
tradeoffs:
  - Requires separate processes or worker threads for log processing/transports to avoid blocking the event
    loop
inputs:
  - name: pnpm add pino@10.3.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: pino
    kind: export
    about: A fast structured JSON logger function
extension_points:
  - pino.transport API for worker thread log processing
dependencies:
  package: pino
  version: 10.3.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Redaction of sensitive keys like 'password'
guarantees:
  - claim: writes structured JSON and redacts secrets
    test:
      file: contract.test.ts
      title: writes structured JSON and redacts secrets
limits:
  - Log processing and transport should be handled externally to maintain performance
example: |-
  import pino from 'pino';
  const logger = pino({ redact: ['password'] });
  logger.info({ password: 'secret' }, 'login');
keywords:
  - pino
  - observability.logging
  - observability
  - logging
  - json
  - structured
  - redaction
  - performance
  - nodejs
