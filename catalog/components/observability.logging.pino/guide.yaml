component: observability.logging.pino
title: pino
summary: Fast structured JSON logging with redaction. Does not ship logs to a backend by itself. Fast
  structured JSON logger with low overhead and built-in redaction capabilities.
keywords:
  - pino
  - observability.logging
  - observability
  - logging
  - logger
  - json
  - structured
  - fast
  - redaction
synonyms:
  logger:
    - logging library
use_cases:
  - High-performance Node.js applications requiring minimal logging overhead
  - Structured JSON logging for automated log processing
  - Sensitive data masking via redaction
use_when:
  - When low resource consumption and high throughput are required
  - When structured JSON output is needed for observability pipelines
avoid_when:
  - Does not ship logs to a backend by itself — use a dedicated log shipping agent
tradeoffs:
  - choice: Structured JSON logging
    gain: Easier parsing and analysis by log processors
    cost: Requires external tools or transports for human-readable formatting during development
