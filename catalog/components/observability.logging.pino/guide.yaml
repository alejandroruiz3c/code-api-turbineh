compatibility:
  package: pino@10.3.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Redaction of sensitive keys in log objects
guarantees:
  - claim: writes structured JSON and redacts secrets
    test: contract.test.ts › writes structured JSON and redacts secrets
limits:
  - Does not include built-in log transport to backends
example: |-
  import pino from "pino";
  import { Writable } from "node:stream";

  const lines: string[] = [];
  const log = pino(
    { redact: ["password"] },
    new Writable({
      write(c, _e, cb) {
        lines.push(c.toString());
        cb();
      },
    }),
  );
  log.info({ password: "p", user: "u" }, "login");
  const rec = JSON.parse(lines[0] ?? "{}");
  console.log(rec.msg); // → "login"
  console.log(rec.password); // → "[Redacted]"
