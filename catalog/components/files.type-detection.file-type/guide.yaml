schema: turbineh.guide/v0.1
component: files.type-detection.file-type
title: file-type detection
summary: Detects real file type from magic bytes (not from the extension). Does not scan files for malware.
  Detects real file type from magic bytes in a buffer, stream, or file path rather than relying on file
  extensions.
keywords:
  - file-type
  - files.type-detection
  - files
  - type
  - detection
  - magic bytes
  - mime type
  - file extension
  - binary detection
  - file sniffing
synonyms:
  file type detection:
    - magic number sniffing
    - mime detection
use_cases:
  - Validating file uploads by checking MIME types against an allow-list
  - Identifying binary file formats from raw Uint8Array data
  - Determining file extensions for processing pipelines
use_when:
  - When you need to verify the actual content of a binary file
  - When processing untrusted file uploads where extensions may be spoofed
avoid_when:
  - When you need to map extensions to MIME types rather than detecting content — use files.mime.mime
  - It is designed for binary-based formats and does not support .txt, .csv, or .svg — use text-based detection
tradeoffs:
  - choice: Magic byte sniffing
    gain: Accurate identification of binary formats regardless of filename
    cost: Best-effort hint that does not guarantee the file is valid or not malformed
config:
  - name: install
    description: pnpm add file-type@22.1.1 (exact version, added by TurbineH)
interfaces:
  - name: fileTypeFromBuffer
    signature: import { fileTypeFromBuffer } from "file-type"
    where: file-type
  - name: detectFileType
    signature: "async function detectFileType( data: Uint8Array, ): Promise<"
    where: "@/integrations/files-type-detection"
  - name: isAllowedFileType
    signature: "async function isAllowedFileType( data: Uint8Array, allowedMimes: readonly string[], ):
      Promise<boolean>"
    where: "@/integrations/files-type-detection"
extension_points:
  - what: detects PNG and PDF by magic bytes
    where: fileTypeFromBuffer
    how: by checking magic numbers
compatibility:
  package: file-type@22.1.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Does not scan files for malware
  - Does not guarantee protection against malformed input; use worker threads and size limits for untrusted
    files
guarantees:
  - claim: detects PNG and PDF by magic bytes
    test: contract.test.ts › detects PNG and PDF by magic bytes
limits:
  - Does not support text-based formats like .txt, .csv, or .svg
  - Detection is a best-effort hint and does not guarantee file validity
example: |-
  import { fileTypeFromBuffer } from "file-type";

  const png = new Uint8Array(
    Buffer.from(
      "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==",
      "base64",
    ),
  );
  console.log((await fileTypeFromBuffer(png))?.mime); // → "image/png"
  console.log((await fileTypeFromBuffer(new TextEncoder().encode("%PDF-1.7\n")))?.ext); // → "pdf"
