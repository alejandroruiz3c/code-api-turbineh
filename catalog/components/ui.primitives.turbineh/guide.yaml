component: ui.primitives.turbineh
title: ui.primitives.turbineh
summary: Accessible UI primitives (button, input, label, card, table) styled with Tailwind. Does not provide
  complex widgets such as date pickers, charts or data grids. Accessible UI primitives including button,
  input, label, card, and table components styled with Tailwind CSS.
