use_cases:
  - Building accessible forms using input and label components
  - Creating structured layouts with card and table primitives
  - Implementing basic user interface elements with Tailwind styling
use_when:
  - When building applications requiring accessible base UI components
  - When using Tailwind CSS for styling
avoid_when:
  - Does not provide complex widgets such as charts — use ui.charts.recharts
  - Does not provide complex widgets such as date pickers — use ui.calendar.react-day-picker
  - Does not provide complex widgets such as data grids — use ui.command-palette.cmdk
tradeoffs:
