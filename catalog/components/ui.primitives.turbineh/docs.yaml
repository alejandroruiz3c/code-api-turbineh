schema: turbineh.component-docs/v1
id: ui.primitives.turbineh
does: Accessible UI primitives (button, input, label, card, table) styled with Tailwind
does_not: Does not provide complex widgets such as date pickers, charts or data grids
use_cases:
  - Building accessible user interfaces with Tailwind CSS styling
  - Implementing basic forms using input and label primitives
  - Displaying structured data using table components
when_to_use:
  - When you need foundational UI elements like buttons, inputs, and cards
when_not_to_use:
  - instead: ui.charts.recharts
    why: The component does not provide charts
  - instead: ui.calendar.react-day-picker
    why: The component does not provide date pickers
  - instead: complex data grids
    why: The component does not provide complex widgets such as data grids
tradeoffs:
  - Provides low-level primitives instead of high-level complex widgets
