schema: turbineh.component-docs/v1
id: data.recurrence.rrule
does: RFC 5545 recurrence rules (weekly, monthly...) and occurrence expansion
does_not: Does not store events or send reminders
use_cases:
  - Generating recurrence rules following RFC 5545
  - Expanding recurrence rules into specific occurrence dates
  - Parsing and serializing recurrence rules from iCalendar strings or natural language
when_to_use:
  - When you need to calculate calendar event repetitions (weekly, monthly, etc.)
  - When you need to handle iCalendar RRULE strings
when_not_to_use:
  - instead: data.ics-export.ical-generator
    why: This component does not store events or send reminders; it only handles recurrence logic.
tradeoffs:
  - Provides complex recurrence logic but is a partial port of python-dateutil rather than a full iCalendar
    implementation.
inputs:
  - name: pnpm add rrule@2.8.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: RRule
    kind: export
    about: A class for defining and expanding RFC 5545 recurrence rules.
extension_points: []
dependencies:
  package: rrule
  version: 2.8.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No security implications identified in the provided documentation.
guarantees:
  - claim: expands weekly occurrences
    test:
      file: contract.test.ts
      title: expands weekly occurrences
limits:
  - Does not store events or send reminders.
example: |-
  import { RRule } from 'rrule';

  const rule = new RRule({
    freq: RRule.WEEKLY,
    count: 3,
    dtstart: new Date(Date.UTC(2026, 9, 13, 9)),
  });

  const occurrences = rule.all();
