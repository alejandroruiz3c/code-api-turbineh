schema: turbineh.guide/v0.1
component: data.recurrence.rrule
title: data.recurrence.rrule
summary: RFC 5545 recurrence rules (weekly, monthly...) and occurrence expansion. Does not store events or
  send reminders. A library for working with RFC 5545 recurrence rules and expanding them into specific
  occurrence dates.
keywords:
  - rrule
  - data.recurrence
  - data
  - recurrence
  - rfc 5545
  - calendar
  - icalendar
  - expansion
synonyms:
  recurrence rule:
    - RRULE
    - recurrence pattern
use_cases:
  - Generating recurring calendar event dates
  - Parsing and serializing iCalendar RRULE strings
  - Converting natural language recurrence descriptions to rules
  - Calculating date slices between two points in time
use_when:
  - When you need to implement RFC 5545 compliant recurrence logic
  - When you need to expand rules into lists of Date objects
avoid_when:
  - If you need to export full iCalendar files rather than just calculating recurrence rules — use
    data.ics-export.ical-generator
  - This component does not store events or send reminders — use storing events in a database
tradeoffs:
  - choice: Partial port of python-dateutil
    gain: Familiarity for users coming from Python environments
    cost: May have slight differences from the full iCalendar RFC implementation
config:
  - name: install
    description: pnpm add rrule@2.8.1 (exact version, added by TurbineH)
interfaces:
  - name: RRule
    signature: import { RRule } from "rrule"
    where: rrule
extension_points:
  - what: recurrence rule configuration
    where: RRule constructor
    how: Pass an object containing freq, interval, byweekday, dtstart, until, or count
compatibility:
  package: rrule@2.8.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: expands weekly occurrences
    test: contract.test.ts › expands weekly occurrences
limits:
  - Does not store events
  - Does not send reminders
example: |-
  import { RRule } from 'rrule';

  const rule = new RRule({
    freq: RRule.WEEKLY,
    count: 3,
    dtstart: new Date(Date.UTC(2026, 9, 13, 9)),
  });

  const occurrences = rule.all();
