schema: turbineh.guide/v0.1
component: content.html-dom.linkedom
title: linkedom
summary: Lightweight server-side DOM to parse and query HTML without a browser. Does not run scripts or lay
  out pages. A lightweight, triple-linked list based DOM implementation for DOM-less environments designed for
  linear performance and stability.
keywords:
  - linkedom
  - content.html-dom
  - content
  - html
  - dom
  - html parser
  - ssr
  - server-side
  - lightweight
synonyms:
  linkedom:
    - DOM implementation
use_cases:
  - Server-side HTML parsing
  - Querying HTML documents without a browser
  - SSR (Server Side Rendering) document manipulation
use_when:
  - When you need a lightweight DOM for server-side environments
  - When linear performance for large documents is required
avoid_when:
  - If you require a different parsing API — use content.html-parse.cheerio
  - If you need to execute scripts or perform page layout — use a browser environment
tradeoffs:
  - choice: Triple-linked list architecture
    gain: Avoids maximum callstack/recursion or crashes and guarantees linear performance
    cost: Not as close to the full DOM standard as other implementations
config:
  - name: install
    description: pnpm add linkedom@0.18.13 (exact version, added by TurbineH)
interfaces:
  - name: parseHTML
    signature: import { parseHTML } from "linkedom"
    where: linkedom
  - name: parseHtmlDocument
    signature: "function parseHtmlDocument(html: string)"
    where: "@/integrations/content-html-dom"
extension_points:
  - what: customElements.define
    where: customElements
    how: Pass a class extending HTMLElement to define new elements within the document context.
compatibility:
  package: linkedom@0.18.13
  runtime: node@>=20
  peers:
    canvas: ">= 2"
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence ISC; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: parses HTML into a queryable DOM on the server
    test: contract.test.ts › parses HTML into a queryable DOM on the server
limits:
  - Does not run scripts or lay out pages
  - parseHtmlDocument throws if HTML length exceeds 2,000,000 characters
example: |-
  import { parseHTML } from "linkedom";

  const { document } = parseHTML(
    '<ul><li class="item">A</li><li class="item">B</li></ul><script>alert(1)</script>',
  );
  console.log([...document.querySelectorAll(".item")].map((n) => n.textContent)); // → ["A", "B"]
  console.log(document.querySelector("script")?.textContent); // → "alert(1)"
