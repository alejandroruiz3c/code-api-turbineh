# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: content.html-dom.linkedom
does: Lightweight server-side DOM to parse and query HTML without a browser
does_not: Does not run scripts or lay out pages
use_cases:
  - Server-side HTML parsing and querying
  - DOM manipulation in DOM-less environments
  - SSR (Server-Side Rendering) document generation
when_to_use:
  - When you need a lightweight DOM implementation for server-side environments
  - When you require linear performance for large documents
when_not_to_use:
  - instead: content.html-parse.cheerio
    why: If you need a different parsing API or specific library ecosystem
  - instead: a browser environment
    why: If you need to execute scripts or perform page layout
tradeoffs:
  - Uses a triple-linked list based implementation to avoid recursion crashes and ensure linear performance
inputs:
  - name: pnpm add linkedom@0.18.13
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: parseHTML
    kind: export
    about: Parses HTML string into a pseudo window object containing document and other properties
  - name: parseHtmlDocument
    kind: export
    about: Parses HTML string into a document object with a 2,000,000 character limit
extension_points:
  - Custom Elements via customElements.define
dependencies:
  package: linkedom
  version: 0.18.13
  runtime: node@>=20
  peers:
    canvas: ">= 2"
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: canvas@>= 2."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence ISC; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Does not run scripts contained within the parsed HTML
guarantees:
  - claim: parses HTML into a queryable DOM on the server
    test:
      file: contract.test.ts
      title: parses HTML into a queryable DOM on the server
limits:
  - Does not run scripts or lay out pages
  - parseHtmlDocument throws an error if HTML exceeds 2,000,000 characters
example: |-
  import { parseHtmlDocument } from '@/integrations/content-html-dom';

  const doc = parseHtmlDocument('<ul><li class="item">A</li></ul>');
  const items = doc.querySelectorAll('.item');
keywords:
  - linkedom
  - content.html-dom
  - content
  - html
  - dom
  - parsing
  - ssr
  - lightweight
  - server-side
