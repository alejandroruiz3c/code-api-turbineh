component: data.search-index.minisearch
title: data.search-index.minisearch
summary: In-memory full-text search with prefix and fuzzy matching for catalogs and docs. Not for millions of
  records. In-memory full-text search engine for browser and Node environments supporting prefix, fuzzy, and
  exact matching.
keywords:
  - minisearch
  - data.search-index
  - data
  - search
  - index
  - full-text search
  - in-memory
  - prefix search
  - fuzzy matching
  - client-side
synonyms:
  minisearch:
    - search engine
    - fulltext search engine
use_cases:
  - Real-time 'as you type' search in web and mobile applications
  - Client-side search to avoid network latency
  - Memory-constrained environments like mobile browsers
use_when:
  - When data fits locally in process memory
  - When offline capability is required
  - When fast, reactive UIs are needed
avoid_when:
  - When indexing millions of records is required — use data.fuzzy-search.fuse
tradeoffs:
  - choice: In-memory indexing
    gain: Fast queries and zero network latency
    cost: Limited by available process memory
