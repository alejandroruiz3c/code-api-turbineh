id: ui.animation.motion
does: Declarative animations and transitions for React
does_not: Not for canvas or 3D
use_cases:
  - Declarative animations and transitions for React
  - GPU-accelerated animations using native browser APIs
  - Gestures, springs, and layout transitions
  - Scroll-linked effects and timelines
when_to_use:
  - When needing a hybrid engine combining JavaScript with native browser APIs for 120fps performance
  - When building React, JavaScript, or Vue applications requiring complex animation sequences
