schema: turbineh.guide/v0.1
component: files.pdf.pdf-lib
title: pdf-lib
summary: Creates and edits PDF documents in pure JavaScript. Does not render HTML to PDF. A pure JavaScript
  library for creating and modifying PDF documents in any modern JavaScript runtime including Node, Browser,
  Deno, and React Native.
keywords:
  - pdf-lib
  - files.pdf
  - files
  - pdf
  - manipulation
  - edit
  - create
  - javascript
  - form-filling
use_cases:
  - Creating new PDF documents from scratch
  - Modifying existing PDF files
  - Creating, filling, and flattening PDF forms
  - Embedding fonts and images into PDFs
  - Copying pages between different PDF documents
use_when:
  - When you need to edit existing PDF documents in a pure JavaScript environment
  - When you need to manipulate PDF structure like adding or removing pages
avoid_when:
  - If you only need to render PDFs in a React application — use files.pdf.react-pdf
  - This component does not render HTML to PDF — use rendering HTML to PDF
tradeoffs:
  - choice: Pure JavaScript implementation
    gain: Works in any JS environment (Node, Browser, Deno, React Native)
    cost: Performance may may vary compared to native bindings
config:
  - name: install
    description: pnpm add pdf-lib@1.17.1 (exact version, added by TurbineH)
interfaces:
  - name: PDFDocument
    signature: import { PDFDocument } from "pdf-lib"
    where: pdf-lib
  - name: StandardFonts
    signature: import { StandardFonts } from "pdf-lib"
    where: pdf-lib
extension_points:
  - what: Add pages to a document
    where: PDFDocument
    how: addPage()
  - what: Embed fonts into a document
    where: PDFDocument
    how: embedFont()
  - what: Draw text on a page
    where: page object returned by addPage()
    how: drawText()
compatibility:
  package: pdf-lib@1.17.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: creates a one-page PDF
    test: contract.test.ts › creates a one-page PDF
limits:
  - Does not render HTML to PDF
example: |-
  import { PDFDocument, StandardFonts } from "pdf-lib";

  const doc = await PDFDocument.create();
  const page = doc.addPage();
  page.drawText("Invoice #1", {
    font: await doc.embedFont(StandardFonts.Helvetica),
    x: 50,
    y: 700,
  });
  const bytes = await doc.save();
  console.log(new TextDecoder().decode(bytes.slice(0, 5))); // → "%PDF-"
  console.log((await PDFDocument.load(bytes)).getPageCount()); // → 1
