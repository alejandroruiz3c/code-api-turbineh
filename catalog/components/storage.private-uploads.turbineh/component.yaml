schema: turbineh.component/v0.1
id: storage.private-uploads.turbineh
version: 0.1.0
status: approved
category: storage
source:
  purl: pkg:generic/turbineh/storage.private-uploads.turbineh@0.1.0
  repo: https://github.com/alejandroruiz3c/code-api-turbineh
capability:
  does: "Private file uploads with limits from the request: maximum size, accepted types recognised by content (PDF, images, text, CSV, Office), files per record; stored outside the public directory on local disk (development, tests, one server) or in any S3-compatible bucket with SigV4-signed requests (production), with an offline S3 mock for E2E; every download goes through an authorised route that checks the workspace and the record's scope (record-access canSeeScope); optional email to staff when a client uploads; attach files to any record (workflow items included)."
  does_not: "Does not resize images, scan for viruses, issue public or pre-signed links, or stream files larger than the server-action limit"
  use_cases: [client-portal, projects, internal-tool, saas-crud]
  pros:
    [
      "Maintained by TurbineH",
      "Limits and types come from the request as data",
      "No SDK: S3 SigV4 in a few unit-tested functions, proved offline against a mock that re-checks every signature",
    ]
  cons: ["Files pass through the app server (no direct-to-bucket uploads); size bounded by the server-action body limit"]
  alternatives: [files.upload.busboy, files.dropzone.react-dropzone]
contract:
  inputs:
    [
      "src/uploads/params.json (maxBytes, types[], maxFilesPerRecord, notifyOnUpload)",
      "saveUpload(actor, file, { subjectType, subjectId?, scopeId? }); readUpload(actor, id); listUploads(actor, { subjectType?, subjectId? }); deleteUpload(actor, id)",
      "env: STORAGE_DRIVER, UPLOADS_DIR, S3_BASE_URL, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (all optional)",
    ]
  outputs: ["uploads rows; GET /dashboard/files/<id>/download (attachment, nosniff, no-store); <Attachments> server component"]
  errors: ["UserFacingError (safe to show): too large, type not allowed, too many files, scope not visible, not found"]
  limits: ["100 MB per file at most (params); 500 files per record; files pass through the server"]
compat:
  runtime: node@>=20
  framework: next@^16.0.0
effects:
  network: true
  fs: true
  db: true
  external_services: [s3-compatible-storage]
integration:
  strategy: vendored-with-provenance
  install: "Copied by the assembler from files/: src/uploads/{config,rules,sniff,sigv4,storage,service,subjects}.ts + params.json, src/server/body-limit.ts (server-action body limit from maxBytes), src/db/component-uploads.ts, src/components/uploads/*, src/app/dashboard/files/**, tests/unit/uploads.test.ts, tests/e2e/uploads.spec.ts, tests/e2e/mocks/S3_BASE_URL.mjs. files-with/domain.workflow.turbineh/ attaches files to workflow records; files-with/domain.membership-access.turbineh/ adds the per-scope E2E."
  config: [UPLOADS_DIR, STORAGE_DRIVER, S3_BASE_URL, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]
  migrations: true
params:
  file: src/uploads/params.json
  schema: params.schema.json
  entities: [File, Upload, Attachment, Document, RequestFile, TaskAttachment, Photo, Scan, DocumentUpload]
quality:
  tests:
    {
      command: "unit (types by content, limits, file names, local driver outside public/, driver selection, SigV4 signing) + E2E (upload and byte-identical download, refusals by size and type, private storage through the S3 mock, downloads refused to anonymous visitors and other workspaces; per-scope downloads with membership-access); full gate via verify:recipe",
      passed: true,
      date: 2026-10-13,
    }
security:
  scanned_at: 2026-10-13
  tools: [gitleaks, semgrep, review]
  findings: []
  scope: "First-party source reviewed: type by content (never name or browser type); sizes checked before reading and again after; storage keys generated by the app (no user path, traversal refused); no public directory or public bucket; every read re-checks workspace and record scope; downloads as attachment with nosniff; S3 credentials only from env; SigV4 verified by an independent mock."
license:
  declared: Apache-2.0
  detected: Apache-2.0
  obligations: [preserve-notice]
evidence:
  - claim: "client-portal + membership-access + private-uploads + workflow (Ledgerline) and projects + workflow + kanban + private-uploads + jobs.scheduled pass the full verification gate with the uploads E2E suite"
    origin: tested
    ref: "verify:recipe (ADR-0048 combinations)"
relations:
  requires: []
  provides: [files.private-uploads, storage.private-uploads]
  conflicts: []
  tested_with: [recipe.client-portal, recipe.projects, recipe.saas-crud]
