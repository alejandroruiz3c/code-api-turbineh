id: ui.color-picker.react-colorful
does: Tiny accessible colour pickers (branding, product options)
does_not: Unstyled beyond defaults
use_cases:
  - Branding tools
  - Product color options
  - Mobile-friendly color selection
when_to_use:
  - When a tiny, dependency-free color picker is needed for React or Preact apps
  - When WAI-ARIA compliance is required
when_not_to_use:
  - instead: custom CSS styling
    why: Unstyled beyond defaults
tradeoffs:
  - Small bundle size (3.1 KB gzipped) vs limited visual customization
