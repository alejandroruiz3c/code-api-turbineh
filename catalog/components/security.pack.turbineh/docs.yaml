schema: turbineh.component-docs/v1
id: security.pack.turbineh
does: "Security Pack: HTTP security headers with CSP, fixed-window rate limiting and safe error messages"
does_not: Does not provide a WAF, bot detection or distributed rate limiting
use_cases:
  - Implementing HTTP security headers including CSP
  - Applying fixed-window rate limiting to endpoints
  - Providing safe, user-facing error messages
when_to_use:
  - When an application requires standard security headers and basic rate limiting
when_not_to_use:
  - instead: security.ai-safety.turbineh
    why: When AI safety features are required
  - instead: ops.rate-limit.rate-limiter-flexible
    why: When distributed rate limiting is needed
  - instead: a WAF
    why: When web application firewall or bot detection is required
tradeoffs:
  - Provides basic security and rate limiting but lacks distributed state or bot detection.
inputs:
  - name: Included in recipe templates at src/security/
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: securityHeaders
    kind: export
    about: Provides HTTP security headers
  - name: rateLimit
    kind: export
    about: Implements fixed-window rate limiting
  - name: UserFacingError
    kind: export
    about: Type for safe error handling
  - name: toUserMessage
    kind: export
    about: Converts errors to safe user messages
  - name: CSP_IMG_EXTRA
    kind: export
    about: CSP source configuration for images
extension_points: []
dependencies:
  package: turbineh/security.pack.turbineh
  version: 0.1.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - HTTP security headers
  - Content Security Policy (CSP)
  - Fixed-window rate limiting
  - Safe error message handling
guarantees:
  - claim: The component sets a restrictive CSP.
    test:
      file: recipe template template/tests/unit/security.test.ts
      title: sets a restrictive CSP
  - claim: The component denies framing and sniffing.
    test:
      file: recipe template template/tests/unit/security.test.ts
      title: denies framing and sniffing
  - claim: The component blocks requests after the limit within the window is reached.
    test:
      file: recipe template template/tests/unit/security.test.ts
      title: blocks after the limit within the window
limits:
  - Fixed-window rate limiting only; no distributed rate limiting.
example: |-
  import { securityHeaders } from '@/security/headers';
  import { rateLimit } from '@/security/rate-limit';
  import { toUserMessage, UserFacingError } from '@/security/errors';
  import { CSP_IMG_EXTRA } from '@/security/csp-sources';
