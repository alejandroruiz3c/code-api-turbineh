schema: turbineh.guide/v0.1
component: security.pack.turbineh
title: security.pack.turbineh
summary: "Security Pack: HTTP security headers with CSP, a fixed-window rate limiter shared by every instance
  (counters in the app's PostgreSQL with a TTL), client addresses taken only through trusted proxies, and safe error
  messages. Does not provide a WAF or bot detection."
keywords:
  - security.pack.turbineh
  - security.headers
  - ops.rate-limit
  - security
  - headers
  - ops
  - rate
  - limit
  - http-headers
  - csp
  - rate-limiting
  - error-handling
synonyms:
  security pack:
    - turbineh security
use_cases:
  - Implementing Content Security Policy (CSP) to restrict resource loading
  - Applying fixed-window rate limiting, shared by every instance, to prevent request flooding
  - Securing HTTP responses with security headers
  - Standardizing user-facing error messages
use_when:
  - When requiring basic HTTP security hardening and rate limiting via a single package
avoid_when:
  - When requiring AI safety features — use security.ai-safety.turbineh
  - When rate limiting must live outside PostgreSQL (e.g. Redis) — use ops.rate-limit.rate-limiter-flexible
  - This component does not provide WAF or bot detection capabilities — use WAF or bot detection
tradeoffs:
  - choice: Fixed-window rate limiting in the app's own PostgreSQL
    gain: Shared by every instance with no extra service; expired windows are removed (TTL)
    cost: One database round trip per limited action
