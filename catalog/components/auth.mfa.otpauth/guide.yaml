schema: turbineh.guide/v0.1
component: auth.mfa.otpauth
title: auth.mfa.otpauth
summary: TOTP/HOTP one-time passwords for two-factor authentication. Does not store secrets or render QR
  codes. A library for generating and validating HMAC-Based One-Time Passwords (HOTP) and Time-Based One-Time
  Passwords (TOTP) for multi-factor authentication.
keywords:
  - otpauth
  - auth.mfa
  - auth
  - mfa
  - totp
  - hotp
  - otp
  - 2fa
synonyms:
  otpauth:
    - one-time password library
use_cases:
  - Implementing two-factor authentication (2FA)
  - Implementing multi-factor authentication (MFA)
  - Generating TOTP tokens for mobile authenticator apps
  - Validating TOTP tokens with clock drift compensation
use_when:
  - When you need to implement RFC 4226 or RFC 6238 compliant one-time passwords
avoid_when:
  - When you require a full session management solution rather than just OTP generation/validation — use
    auth.session.better-auth
tradeoffs:
  - choice: TOTP/HOTP implementation
    gain: Standardized security for MFA
    cost: Requires server-side throttling and secret management as the library does not store secrets
config:
  - name: install
    description: pnpm add otpauth@9.5.2 (exact version, added by TurbineH)
interfaces:
  - name: TOTP
    signature: import { TOTP } from "otpauth"
    where: otpauth
  - name: Secret
    signature: import { Secret } from "otpauth"
    where: otpauth
extension_points:
  - what: Custom HMAC function
    where: TOTP constructor
    how: Provide an hmac function to the options object (required for bare build).
compatibility:
  package: otpauth@9.5.2
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Does not store secrets internally
  - Requires implementation of server-side throttling to prevent brute force attacks
guarantees:
  - claim: generates and validates a TOTP code
    test: contract.test.ts › generates and validates a TOTP code
limits:
  - Does not store secrets
  - Does not render QR codes
example: |-
  import { TOTP, Secret } from "otpauth";

  const totp = new TOTP({ secret: new Secret({ size: 20 }), digits: 6, period: 30 });
  const token = totp.generate();
  console.log(token); // → matches /^\d{6}$/
  console.log(totp.validate({ token, window: 1 })); // → 0
  console.log(totp.toString()); // → contains "otpauth://totp/"
