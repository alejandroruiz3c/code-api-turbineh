# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: auth.mfa.otpauth
does: TOTP/HOTP one-time passwords for two-factor authentication
does_not: Does not store secrets or render QR codes
use_cases:
  - Implementing TOTP (Time-Based One-Time Password) for 2FA
  - Implementing HOTP (HMAC-Based One-Time Password) for 2FA
when_to_use:
  - When you need to generate and validate RFC 4226 and RFC 6238 compliant one-time passwords
when_not_to_use:
  - instead: auth.session.better-auth
    why: When you require full session management or a complete authentication solution rather than just OTP logic
tradeoffs:
  - Does not provide secret storage or QR code rendering
inputs:
  - name: pnpm add otpauth@9.5.2
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: TOTP
    kind: export
    about: Class for generating and validating Time-Based One-Time Passwords
  - name: Secret
    kind: export
    about: Class for handling cryptographic secrets used in OTP generation
extension_points:
  - Custom HMAC function for bare builds
dependencies:
  package: otpauth
  version: 9.5.2
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Requires server-side throttling to prevent brute force attacks
  - Secrets should be at least 128 bits (16 bytes)
guarantees:
  - claim: The library generates and validates a TOTP code
    test:
      file: contract.test.ts
      title: generates and validates a TOTP code
limits:
  - Does not store secrets
  - Does not render QR codes
example: |-
  import { TOTP, Secret } from "otpauth";
  const secret = new Secret({ size: 20 });
  const totp = new TOTP({ secret, digits: 6, period: 30 });
  const token = totp.generate();
  const isValid = totp.validate({ token, window: 1 });
keywords:
  - otpauth
  - auth.mfa
  - auth
  - mfa
  - totp
  - hotp
  - 2fa
  - otp
  - rfc 6238
  - rfc 4226
