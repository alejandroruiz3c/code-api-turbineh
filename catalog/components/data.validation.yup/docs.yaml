# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: data.validation.yup
does: Schema validation with casting and nested objects
does_not: Does not provide compile-time inference as strong as zod
use_cases:
  - Runtime value parsing and validation
  - Schema-based data transformation and casting
  - Modeling complex interdependent data structures
  - Async validation for client and server side
when_to_use:
  - When you need to coerce input values into specific types via casting
  - When modeling complex, nested object shapes
when_not_to_use:
  - instead: zod
    why: Does not provide compile-time inference as strong as zod
tradeoffs:
  - Provides powerful TypeScript support via InferType but lacks the compile-time inference strength of
    alternatives like zod
inputs:
  - name: pnpm add yup@1.7.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: number
    kind: export
    about: Schema for numeric values
  - name: object
    kind: export
    about: Schema for object structures
  - name: string
    kind: export
    about: Schema for string values
extension_points:
  - addMethod for adding custom type-safe methods
dependencies:
  package: yup
  version: 1.7.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No security guarantees provided in documentation
guarantees:
  - claim: The schema validates and casts input values to the defined types
    test:
      file: contract.test.ts
      title: validates and casts
limits:
  - Compile-time type inference is less robust than zod
example: |-
  import { number, object, string } from 'yup';
  const schema = object({ name: string().required(), qty: number().min(1).required() });
  const result = await schema.validate({ name: 'x', qty: '2' });
keywords:
  - yup
  - data.validation
  - data
  - validation
  - schema
  - casting
  - parsing
  - transformation
  - runtime
