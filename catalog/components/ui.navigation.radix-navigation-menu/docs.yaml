example: |-
  import { Nav } from "@radix-ui/react-navigation-menu";

  const Menu = () => (
    <Nav.Root>
      <Nav.List>
        <Nav.Item>
          <Nav.Link href="/about">About</Nav.Link>
        </Nav.Item>
      </Nav.List>
    </Nav.Root>
  );
