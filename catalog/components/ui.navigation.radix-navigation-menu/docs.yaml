schema: turbineh.component-docs/v1
id: ui.navigation.radix-navigation-menu
does: Accessible site navigation menus with submenus for websites
does_not: Unstyled
use_cases:
  - Accessible site navigation menus
  - Navigation menus with submenus
when_to_use:
  - When building accessible website navigation structures
when_not_to_use:
  - instead: ui.accordion.radix
    why: When vertical collapsible content is required instead of a horizontal or dropdown menu
tradeoffs:
  - The component is unstyled and requires custom CSS for visual presentation
inputs:
  - name: pnpm add @radix-ui/react-navigation-menu@1.2.22
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Nav
    kind: export
    about: Namespace containing navigation menu primitives
