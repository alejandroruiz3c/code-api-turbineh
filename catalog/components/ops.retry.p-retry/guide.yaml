schema: turbineh.guide/v0.1
component: ops.retry.p-retry
title: ops.retry.p-retry
summary: Retries failing async operations with exponential backoff. Does not make operations idempotent.
  Retries failing async operations using exponential backoff with jitter.
keywords:
  - p-retry
  - ops.retry
  - ops
  - retry
  - backoff
  - exponential
  - jitter
  - async
synonyms:
  retry mechanism:
    - backoff strategy
use_cases:
  - Retrying transient network errors
  - Handling rate limits with backoff
  - Recovering from temporary service unavailability
use_when:
  - When an async operation is prone to transient failures
  - When exponential backoff is required to avoid overwhelming a service
avoid_when:
  - If you need to limit concurrent executions rather than retrying failures — use ops.concurrency.p-limit
  - The component does not make operations idempotent — use making operations idempotent
tradeoffs:
  - choice: Exponential backoff with jitter
    gain: Reduces collision probability and prevents thundering herd problems
    cost: Increases total latency for successful retries
config:
  - name: install
    description: pnpm add p-retry@8.0.1 (exact version, added by TurbineH)
interfaces:
  - name: withRetry
    signature: "function withRetry<T>( operation: (attempt: number)"
    where: "@/integrations/ops-retry"
  - name: pRetry
    signature: import pRetry from "p-retry"
    where: p-retry
  - name: AbortError
    signature: import { AbortError } from "p-retry"
    where: p-retry
extension_points:
  - what: Custom retry logic and monitoring
    where: onFailedAttempt callback
    how: Provide a function that receives error and retry state information to log or delay further attempts.
compatibility:
  package: p-retry@8.0.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: retries until success
    test: contract.test.ts › retries until success
limits:
  - Maximum of 10 retries allowed via withRetry
example: |-
  import pRetry from "p-retry";

  let n = 0;
  const r = await pRetry(
    async () => {
      n++;
      if (n < 3) throw new Error("x");
      return "ok";
    },
    { retries: 3, minTimeout: 1, factor: 1 },
  );
  console.log(r); // → "ok"
  console.log(n); // → 3
