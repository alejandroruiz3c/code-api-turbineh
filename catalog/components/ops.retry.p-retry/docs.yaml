# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ops.retry.p-retry
does: Retries failing async operations with exponential backoff
does_not: Does not make operations idempotent
use_cases:
  - Retrying transient network errors or rate limits
  - Executing async operations with exponential backoff and jitter
when_to_use:
  - When an operation is expected to succeed after a certain number of failures
  - When you need to implement exponential backoff for async functions
when_not_to_use:
  - instead: ops.concurrency.p-limit
    why: If you need to limit concurrency rather than retry failures
  - instead: making operations idempotent
    why: The component does not make operations idempotent
tradeoffs:
  - Uses exponential backoff which increases delay between attempts
inputs:
  - name: pnpm add p-retry@8.0.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: withRetry
    kind: export
    about: Retries a transient operation with exponential backoff and jitter, bounded to at most 10 retries.
  - name: pRetry
    kind: export
    about: Returns a promise that is fulfilled when the input function returns a fulfilled promise, retrying on
      failure.
  - name: AbortError
    kind: export
    about: Error type used to signal that retries should be aborted immediately.
extension_points:
  - onFailedAttempt callback for monitoring or custom delays
dependencies:
  package: p-retry
  version: 8.0.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Non-network TypeErrors always abort retries to prevent infinite loops on logic errors.
guarantees:
  - claim: The function retries until success if the operation eventually succeeds within the retry limit.
    test:
      file: contract.test.ts
      title: retries until success
limits:
  - Maximum of 10 retries allowed via withRetry regardless of input options
example: |-
  import { withRetry } from '@/integrations/ops-retry';

  async function task() {
    return await withRetry(async (attempt) => {
      if (attempt < 2) throw new Error('fail');
      return 'success';
    }, { retries: 5 });
  }
keywords:
  - p-retry
  - ops.retry
  - ops
  - retry
  - exponential backoff
  - async
  - jitter
  - backoff
