schema: turbineh.guide/v0.1
component: seo.sitemap.sitemap
title: seo.sitemap.sitemap
summary: Builds XML sitemaps for search engines. Does not crawl the site.
keywords:
  - sitemap
  - seo.sitemap
  - seo
  - xml
  - stream
  - search-engine
synonyms:
  sitemap generator:
    - XML builder
use_cases:
  - Generating XML sitemaps for SEO purposes
  - Streaming URL data into sitemap formats
use_when:
  - When you need to programmatically create XML sitemaps from a stream of URLs
avoid_when:
  - If you need to implement structured data schemas instead of sitemaps — use seo.structured-data.schema-dts
  - This component does not crawl the site — use crawling a site
tradeoffs:
  - choice: Streaming architecture
    gain: Efficiently handles large numbers of URLs via streams
    cost: Requires managing stream lifecycle and promises
config:
  - name: install
    description: pnpm add sitemap@9.0.1 (exact version, added by TurbineH)
interfaces:
  - name: SitemapStream
    signature: import { SitemapStream } from "sitemap"
    where: sitemap
  - name: streamToPromise
    signature: import { streamToPromise } from "sitemap"
    where: sitemap
extension_points:
  - what: URL data input
    where: SitemapStream constructor or pipe source
    how: Provide objects containing url and metadata like changefreq
compatibility:
  package: sitemap@9.0.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: builds an XML sitemap
    test: contract.test.ts › builds an XML sitemap
limits:
  - Does not crawl the site
example: |-
  import { Readable } from "node:stream";
  import { SitemapStream, streamToPromise } from "sitemap";

  const s = new SitemapStream({ hostname: "https://example.com" });
  const xml = (
    await streamToPromise(Readable.from([{ url: "/about", changefreq: "monthly" }]).pipe(s))
  ).toString();
  console.log(xml); // → contains "<loc>https://example.com/about</loc>"
