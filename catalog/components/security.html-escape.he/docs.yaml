schema: turbineh.component-docs/v1
id: security.html-escape.he
does: Encodes and decodes HTML entities robustly
does_not: Does not sanitize full HTML documents
use_cases:
  - Encoding text for safe display in HTML to prevent injection
  - Decoding HTML entities back into plain text
  - Handling astral Unicode symbols in HTML character references
when_to_use:
  - When you need to encode or decode HTML entities robustly with full Unicode support
when_not_to_use:
  - instead: security.sanitize-html.sanitize-html
    why: It does not sanitize full HTML documents
tradeoffs:
  - Using named character references may impact compatibility with older browsers
inputs:
  - name: pnpm add he@1.2.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: he
    kind: export
    about: The module namespace object containing encoding and decoding functions
extension_points: []
dependencies:
  package: he
  version: 1.2.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Provides robust encoding/decoding of HTML entities to mitigate injection risks
guarantees:
  - claim: escapes and decodes entities
    test:
      file: contract.test.ts
      title: escapes and decodes entities
limits:
  - Does not sanitize full HTML documents
example: |-
  import he from 'he';

  he.escape("<a href='x'>&</a>");
  he.decode("&eacute;&amp;");
