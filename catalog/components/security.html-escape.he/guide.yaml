schema: turbineh.guide/v0.1
component: security.html-escape.he
title: security.html-escape.he
summary: Encodes and decodes HTML entities robustly. Does not sanitize full HTML documents. A robust HTML
  entities encoder and decoder with full Unicode support, handling standardized named character references and
  astral symbols.
keywords:
  - he
  - security.html-escape
  - security
  - html
  - escape
  - html-entities
  - encoder
  - decoder
  - unicode
  - encoding
synonyms:
  html entity handler:
    - encoder
    - decoder
use_cases:
  - Encoding text to prevent HTML injection by converting special characters to entities.
  - Decoding HTML entities back into their original Unicode characters.
  - Handling ambiguous ampersands and edge cases similar to a web browser.
use_when:
  - When you need to encode or decode HTML entities robustly.
  - When working with astral Unicode symbols.
  - When you require support for all standardized named character references.
avoid_when:
  - The component does not sanitize full HTML documents — use security.sanitize-html.sanitize-html
tradeoffs:
  - choice: "useNamedReferences: true"
    gain: Uses human-readable named character references (e.g., &copy;).
    cost: May cause compatibility issues with older browsers.
  - choice: "strict: true"
    gain: Ensures the output is always valid HTML by throwing on invalid code points.
    cost: Throws exceptions on invalid input instead of returning them as-is.
config:
  - name: install
    description: pnpm add he@1.2.0 (exact version, added by TurbineH)
interfaces:
  - name: he
    signature: import he from "he"
    where: he
extension_points:
  - what: options object
    where: encode function arguments
    how: Pass an object with useNamedReferences or strict properties.
compatibility:
  package: he@1.2.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Provides robust encoding of special characters to mitigate injection risks.
guarantees:
  - claim: escapes and decodes entities
    test: contract.test.ts › escapes and decodes entities
limits:
  - Does not sanitize full HTML documents.
example: |-
  import he from "he";

  console.log(he.escape("<a href='x'>&</a>")); // → "&lt;a href=&#x27;x&#x27;&gt;&amp;&lt;/a&gt;"
  console.log(he.decode("&eacute;&amp;")); // → "é&"
