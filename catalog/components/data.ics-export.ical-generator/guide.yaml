  - Generating .ics calendar files
  - Creating VEVENT entries for bookings
  - Producing calendar invitations
use_when:
  - When you need to generate iCalendar formatted strings
avoid_when:
  - The component does not sync with external calendars — use syncing with external calendars
tradeoffs:
