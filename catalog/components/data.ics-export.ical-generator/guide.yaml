security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: renders a VEVENT
    test: contract.test.ts › renders a VEVENT
limits:
  - Does not sync with external calendars
example: |-
  import ical from "ical-generator";

  const cal = ical({ name: "Bookings" });
  cal.createEvent({
    start: new Date(Date.UTC(2026, 9, 13, 9)),
    end: new Date(Date.UTC(2026, 9, 13, 10)),
    summary: "Physio session",
  });
  const out = cal.toString();
  console.log(out); // → contains "BEGIN:VCALENDAR"
  console.log(out); // → contains "SUMMARY:Physio session"
