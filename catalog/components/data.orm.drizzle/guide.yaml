component: data.orm.drizzle
title: data.orm.drizzle
summary: Typed SQL query builder and schema definition for Postgres with generated migrations. Does not
  provide connection pooling, auth or row-level authorization by itself. A lightweight, headless TypeScript
  ORM for SQL databases including PostgreSQL, MySQL, and SQLite. It provides typed SQL query building and
  schema definitions with zero dependencies.
keywords:
  - drizzle-orm
  - data.orm
  - data
  - orm
  - typescript
  - postgresql
  - sql builder
  - serverless
synonyms:
  drizzle orm:
    - Drizzle
use_cases:
  - Defining SQL schemas in TypeScript
  - Building relational and SQL-like queries
  - Managing database migrations via Drizzle Kit
  - Serverless database interactions in Edge runtimes
use_when:
  - When requiring a tree-shakeable ORM with zero dependencies
  - When working in serverless or edge environments like Cloudflare Workers or Vercel Postgres
  - When needing type-safe SQL query construction
avoid_when:
  - Does not provide connection pooling by itself — use manual connection pooling
  - Does not provide auth or row-level authorization by itself — use application-level authorization logic
tradeoffs:
  - choice: Headless design
    gain: Minimal bundle size (~7.4kb) and zero dependencies
    cost: Requires external tools for migrations and data browsing
