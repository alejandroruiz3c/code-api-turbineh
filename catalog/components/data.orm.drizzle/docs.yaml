# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: data.orm.drizzle
does: Typed SQL query builder and schema definition for Postgres with generated migrations
does_not: Does not provide connection pooling, auth or row-level authorization by itself
use_cases:
  - Typed SQL query building for PostgreSQL, MySQL, and SQLite
  - Defining relational and SQL-like schemas in TypeScript
  - Generating and managing database migrations via CLI companion
  - Serverless database interaction in Edge runtimes, Bun, Deno, or Cloudflare Workers
when_to_use:
  - When requiring a lightweight (~7.4kb) tree-shakeable ORM with zero dependencies
  - When building applications for serverless or edge environments like Neon, Turso, or Cloudflare D1
  - When needing a balance between type-safety and raw SQL extensibility
when_not_to_use:
  - instead: manual connection management
    why: Does not provide connection pooling by itself
  - instead: application-level logic
    why: Does not provide auth or row-level authorization by itself
tradeoffs:
  - Provides high type-safety at the cost of being a thin layer over SQL rather than a full abstraction
inputs:
  - name: pnpm add drizzle-orm@0.45.3 pg
    kind: install
    about: Exact version, added by TurbineH.
  - name: DATABASE_URL
    kind: env
    about: Read by the component's code.
interfaces:
  - name: pgTable
    kind: export
    about: Used for defining PostgreSQL tables in the schema
  - name: sql
    kind: export
    about: Used for building raw SQL expressions within queries
  - name: text
    kind: export
    about: Column type for text data
  - name: integer
    kind: export
    about: Column type for integer data
extension_points:
  - customType
dependencies:
  package: drizzle-orm
  version: 0.45.3
  runtime: node@>=20
  peers:
    pg: ">=8"
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: pg@>=8."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network yes, filesystem no, database yes; external services: postgres."
  - neutralises formula injection and quotes special characters
guarantees:
  - claim: neutralises formula injection and quotes special characters
    test:
      file: recipe template saas-crud/tests/unit/csv.test.ts
      title: neutralises formula injection and quotes special characters
limits:
  - Does not include built-in connection pooling or authorization mechanisms
example: |-
  import { pgTable, text, uuid, integer, varchar } from 'drizzle-orm';

  export const users = pgTable('users', {
    id: uuid('id').primaryKey(),
    name: text('name'),
    age: integer('age'),
    email: varchar('email', { length: 255 }),
  });
keywords:
  - drizzle-orm
  - data.orm
  - data
  - orm
  - typescript
  - postgresql
  - sql
  - serverless
  - migrations
