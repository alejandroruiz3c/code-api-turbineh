schema: turbineh.guide/v0.1
component: data.validation.zod
title: data.validation.zod
summary: Declares runtime schemas with inferred static types and validates untrusted input at every boundary.
  Does not persist data, sanitize HTML or enforce authorization. TypeScript-first schema declaration and
  validation library that provides runtime validation and static type inference.
keywords:
  - zod
  - data.validation
  - data
  - validation
  - schema
  - typescript
  - runtime-checks
  - inference
synonyms:
  zod:
    - schema validation library
use_cases:
  - Validating untrusted input at application boundaries
  - Defining complex object structures with static type safety
  - AOT compilation for high-performance validation paths
use_when:
  - When runtime data needs to be validated against a schema with automatic TypeScript type inference
  - When performance is critical for hot validation paths via z.compile
avoid_when:
  - Zod does not handle CSV parsing — use data.csv-import.papaparse
  - Zod is for schema validation, not date manipulation — use data.dates.date-fns
tradeoffs:
  - choice: AOT compilation via z.compile
    gain: Median speedup of 2.4x for large objects or arrays
    cost: Schemas with async refinements or transforms cannot be compiled
config:
  - name: install
    description: pnpm add zod@4.6.5 (exact version, added by TurbineH)
interfaces:
  - name: z
    signature: import { z } from "zod"
    where: zod
extension_points:
  - what: Ahead-of-time compilation
    where: z.compile(schema)
    how: Returns a schema clone with a fast path using new Function
compatibility:
  package: zod@4.6.5
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Does not sanitize HTML or enforce authorization
guarantees:
  - claim: Enforces limits on input data
    test: recipe template saas-crud/tests/unit/csv.test.ts › enforces limits
limits:
  - Schemas with async refinements or transforms cannot use the compiled fast path
example: |-
  import { z } from "zod";

  const Player = z.object({
    username: z.string().min(3),
    xp: z.number().int().nonnegative(),
  });
  type Player = z.infer<typeof Player>;

  const ok: Player = Player.parse({ username: "billie", xp: 100 });
  const bad = Player.safeParse({ username: "b", xp: -1 });
  console.log(ok, bad.success ? "valid" : bad.error.issues.map((i) => i.path.join(".")));
