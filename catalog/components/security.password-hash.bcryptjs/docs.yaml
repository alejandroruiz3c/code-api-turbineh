schema: turbineh.component-docs/v1
id: security.password-hash.bcryptjs
does: bcrypt password hashing in pure JavaScript
does_not: Does not enforce password policies
use_cases:
  - Password hashing in pure JavaScript environments
  - Browser-based password security
  - Node.js applications requiring zero dependencies
when_to_use:
  - When a pure JavaScript implementation is required for browser compatibility
  - When avoiding C++ bindings is necessary
when_not_to_use:
  - instead: C++ bcrypt bindings
    why: bcryptjs is slower than the C++ implementation by approximately 30%
tradeoffs:
  - Pure JavaScript implementation provides zero dependencies and browser compatibility but results in slower
    performance compared to C++ bindings
inputs:
  - name: pnpm add bcryptjs@3.0.3
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: bcrypt
    kind: export
    about: Main module providing asynchronous and synchronous password hashing and verification functions
extension_points: []
dependencies:
  package: bcryptjs
  version: 3.0.3
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Uses an adaptive function with salt to protect against rainbow table and brute-force attacks
guarantees:
  - claim: The library can successfully perform password hashing and subsequent verification.
    test:
      file: contract.test.ts
      title: hashes and verifies
limits:
  - Maximum input length is 72 bytes
  - Generated hashes are 60 characters long
example: |-
  import bcrypt from "bcryptjs";

  async function demo() {
    const hash = await bcrypt.hash("correct horse", 10);
    const isValid = await bcrypt.compare("correct horse", hash);
  }
keywords:
