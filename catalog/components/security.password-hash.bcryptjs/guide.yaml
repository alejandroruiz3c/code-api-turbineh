component: security.password-hash.bcryptjs
title: security.password-hash.bcryptjs
summary: bcrypt password hashing in pure JavaScript. Does not enforce password policies. A pure JavaScript
  implementation of bcrypt for password hashing, compatible with the C++ bcrypt binding and functional in both
  Node.js and browser environments.
keywords:
  - bcryptjs
  - security.password-hash
  - security
  - password
  - hash
  - bcrypt
  - hashing
  - javascript
  - pure-js
synonyms:
  bcryptjs:
    - bcrypt.js
use_cases:
  - Password hashing in pure JavaScript environments
  - Browser-side password security
  - Node.js applications requiring zero dependencies
use_when:
  - When a zero-dependency bcrypt implementation is required
  - When running in a browser environment where C++ bindings are unavailable
avoid_when:
  - bcryptjs is written in pure JavaScript and is approximately 30% slower than the C++ version — use C++
    bcrypt binding
  - The library does not enforce password policies — use password policy enforcement tools
tradeoffs:
  - choice: Pure JavaScript implementation
    gain: Zero dependencies and browser compatibility
    cost: Approximately 30% slower than C++ bindings
config:
  - name: install
    description: pnpm add bcryptjs@3.0.3 (exact version, added by TurbineH)
interfaces:
  - name: bcrypt
    signature: import bcrypt from "bcryptjs"
    where: bcryptjs
extension_points:
  - what: iteration count
    where: bcrypt.hash or bcrypt.hashSync
    how: increase the salt rounds parameter to make it slower and resistant to brute-force search attacks
compatibility:
  package: bcryptjs@3.0.3
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Adaptive function resistant to brute-force search attacks via adjustable iteration counts
  - Incorporates salt to protect against rainbow table attacks
guarantees:
  - claim: hashes and verifies
    test: contract.test.ts › hashes and verifies
limits:
  - Maximum input length is 72 bytes
  - Generated hashes are 60 characters long
example: |-
  import bcrypt from "bcryptjs";

  const hash = await bcrypt.hash("correct horse", 10);
  console.log(await bcrypt.compare("correct horse", hash)); // → true
  console.log(await bcrypt.compare("wrong", hash)); // → false
