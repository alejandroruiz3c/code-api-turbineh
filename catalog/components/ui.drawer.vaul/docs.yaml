schema: turbineh.component-docs/v1
id: ui.drawer.vaul
does: Mobile-friendly drawers (bottom sheets) for carts and filters
does_not: Unstyled
use_cases:
  - Mobile-friendly bottom sheets
  - Cart interfaces
  - Filter menus
  - Dialog replacement on tablet and mobile devices
when_to_use:
  - When building mobile-first UI components like drawers
  - When a Dialog replacement is needed for touch devices
when_not_to_use:
  - instead: ui.alert-dialog.radix
    why: When you need a styled dialog instead of an unstyled drawer
tradeoffs:
  - Component is unstyled and requires custom CSS
inputs:
  - name: pnpm add vaul@1.1.2
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Drawer
    kind: export
    about: Drawer component for React used to create bottom sheets.
extension_points: []
dependencies:
  package: vaul
  version: 1.1.2
  runtime: node@>=20
  peers:
    react: ^16.8 || ^17.0 || ^18.0 || ^19.0.0 || ^19.0.0-rc
    react-dom: ^16.8 || ^17.0 || ^18.0 || ^19.0.0 || ^19.0.0-rc
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@^16.8 || ^17.0 || ^18.0 || ^19.0.0 || ^19.0.0-rc, react-dom@^16.8 || ^17.0 ||
    ^18.0 || ^19.0.0 || ^19.0.0-rc."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database effects.
guarantees:
  - claim: renders a drawer trigger
    test:
      file: contract.test.ts
      title: renders a drawer trigger
limits:
  - Unstyled
example: |-
  import { Drawer } from 'vaul';

  function MyComponent() {
    return (
      <Drawer.Root>
        <Drawer.Trigger>Open</Drawer.Trigger>
        <Drawer.Portal>
          <Drawer.Content>
            <Drawer.Title>Title</Drawer.Title>
          </Drawer.Content>
        </Drawer.Portal>
      </Drawer.Root>
    );
  }
keywords:
