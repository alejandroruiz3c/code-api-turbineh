    where: pipe
    how: include additional functions like email or minValue
compatibility:
  package: valibot@1.5.0
  runtime: node@>=20
  peers:
    typescript: ">=5"
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: validates and reports issues
    test: contract.test.ts › validates and reports issues
limits:
  - Does not persist data
  - Does not sanitize HTML
example: |-
  import * as v from "valibot";

  const Schema = v.object({
    email: v.pipe(v.string(), v.email()),
    age: v.pipe(v.number(), v.minValue(18)),
  });
  console.log(v.safeParse(Schema, { email: "a@b.co", age: 30 }).success); // → true
  console.log(v.safeParse(Schema, { email: "nope", age: 3 }).issues?.length); // → 2
