schema: turbineh.guide/v0.1
component: data.validation.valibot
title: valibot
summary: Modular schema validation with static type inference and small bundle size. Does not persist data or
  sanitize HTML. Modular schema validation library with static type inference and small bundle size.
keywords:
  - valibot
  - data.validation
  - data
  - validation
  - schema validation
  - type safety
  - modular
  - tree-shakable
  - runtime validation
synonyms:
  valibot:
    - schema library
use_cases:
  - Validating incoming server data
  - Form data validation
  - Configuration file validation
use_when:
  - When small bundle size is required
  - When modularity and tree-shaking are needed
  - When runtime type safety for unknown data is required
avoid_when:
  - If the goal is parsing CSV files rather than structural schema validation — use data.csv-import.papaparse
  - If the goal is date manipulation rather than schema validation — use data.dates.date-fns
  - Does not sanitize HTML — use sanitization approach
tradeoffs:
  - choice: Modular function-based API
    gain: Allows bundlers to remove unused code, reducing bundle size by up to 95% compared to Zod
    cost: Requires importing individual functions instead of a single monolithic object
