schema: turbineh.guide/v0.1
component: files.qr.qrcode
title: files.qr.qrcode
summary: Generates QR codes as SVG, PNG data URLs or strings. Does not scan or decode QR codes. Generates QR
  codes as SVG, PNG data URLs, or strings. Supports server-side and client-side environments including React
  Native with SVG.
keywords:
  - qrcode
  - files.qr
  - files
  - qr
  - qr code
  - 2d barcode
  - generator
  - svg
  - png
  - canvas
synonyms:
  node-qrcode:
    - QR code generator
use_cases:
  - Generating QR code images for web or mobile applications
  - Creating SVG representations of 2D barcodes
  - Generating QR codes with custom error correction levels and colors
use_when:
  - When you need to generate QR codes in both Node.js and browser environments
  - When you require specific output formats like SVG or PNG
avoid_when:
  - If you specifically need a React component wrapper — use files.qr.qrcode-react
  - This component does not scan or decode QR codes — use scanning or decoding logic
tradeoffs:
  - choice: Canvas rendering
    gain: Direct drawing to HTML5 canvas elements
    cost: Requires DOM access in browser environments
  - choice: SVG output
    gain: Scalable vector graphics for high-quality printing
    cost: Larger string size compared to raw data
config:
  - name: install
    description: pnpm add qrcode@1.5.4 (exact version, added by TurbineH)
interfaces:
  - name: QRCode
    signature: import QRCode from "qrcode"
    where: qrcode
extension_points:
  - what: Output type configuration
    where: QRCode.toString options
    how: Pass a type option such as 'svg', 'png', or 'utf8'
compatibility:
  package: qrcode@1.5.4
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: renders an SVG QR code
    test: contract.test.ts › renders an SVG QR code
limits:
  - Does not scan or decode QR codes
example: |-
  import QRCode from "qrcode";

  const svg = await QRCode.toString("https://example.com", { type: "svg" });
  console.log(svg.startsWith("<svg")); // → true
