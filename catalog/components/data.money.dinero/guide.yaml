example: |-
  import { dinero, add, allocate, toSnapshot } from "dinero.js";
  import { EUR } from "dinero.js/currencies";

  const total = add(
    dinero({ amount: 1000, currency: EUR }),
    dinero({ amount: 99, currency: EUR }),
  );
  console.log(toSnapshot(total).amount); // → 1099
  console.log(allocate(dinero({ amount: 100, currency: EUR }), [1, 2]).map((d) => toSnapshot(d).amount)); // → [33, 67]
