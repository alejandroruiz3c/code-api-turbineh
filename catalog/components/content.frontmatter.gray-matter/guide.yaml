schema: turbineh.guide/v0.1
component: content.frontmatter.gray-matter
title: content.frontmatter.gray-matter
summary: Parses Markdown files with front matter (title, date, tags) for blogs and pages. Does not render
  Markdown to HTML. Parses YAML, JSON, TOML, or CoffeeScript front matter from strings or files into
  structured data and content.
keywords:
  - gray-matter
  - content.blog
  - content
  - blog
  - front-matter
  - markdown
  - yaml
  - metadata
  - parsing
synonyms:
  front-matter parser:
    - metadata extractor
use_cases:
  - Extracting metadata (title, date, tags) from Markdown files for blogs
  - Parsing configuration headers in static site generators
use_when:
  - When you need to separate structured metadata from a Markdown body
  - When you require support for multiple front-matter formats like YAML or JSON
avoid_when:
  - If you need to render Markdown to HTML — use content.markdown.react-markdown
  - If you only want to strip Markdown formatting — use content.markdown-to-text.remove-markdown
tradeoffs:
  - choice: Non-regex parsing approach
    gain: Better at catching and handling edge cases and faster than regex-based parsers
    cost: Requires a full parser engine
config:
  - name: install
    description: pnpm add gray-matter@4.0.3 (exact version, added by TurbineH)
interfaces:
  - name: matter
    signature: import matter from "gray-matter"
    where: gray-matter
extension_points:
  - what: Custom engines
    where: options.engines
    how: Add support for languages like TOML or CoffeeScript
compatibility:
  package: gray-matter@4.0.3
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: splits front matter from the Markdown body
    test: contract.test.ts › splits front matter from the Markdown body
limits:
  - Does not render Markdown to HTML
example: |-
  import matter from "gray-matter";

  const f = matter("---\ntitle: Hello\ntags: [a, b]\n---\n# Body");
  console.log(f.data); // → { title: "Hello", tags: ["a", "b"] }
  console.log(f.content.trim()); // → "# Body"
