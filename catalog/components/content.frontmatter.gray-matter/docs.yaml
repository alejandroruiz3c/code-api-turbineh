schema: turbineh.component-docs/v1
id: content.frontmatter.gray-matter
does: Parses Markdown files with front matter (title, date, tags) for blogs and pages
does_not: Does not render Markdown to HTML
use_cases:
  - Parsing YAML, JSON, TOML, or CoffeeScript front matter from Markdown files
  - Extracting metadata like titles, dates, and tags for blogs and pages
when_to_use:
  - When you need to separate structured metadata from a Markdown string or file
when_not_to_use:
  - instead: content.markdown.react-markdown
    why: If you need to render Markdown to HTML
tradeoffs:
  - Provides more accuracy and speed than regex-based parsers.
inputs:
  - name: pnpm add gray-matter@4.0.3
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: matter
    kind: export
    about: Main function that parses a string or file to return an object containing content and data.
extension_points:
  - Custom delimiters
  - Custom engines for languages like TOML or CoffeeScript
dependencies:
  package: gray-matter
  version: 4.0.3
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database effects.
guarantees:
  - claim: splits front matter from the Markdown body
    test:
      file: contract.test.ts
      title: splits front matter from the Markdown body
limits:
  - Does not render Markdown to HTML
example: |-
  import { matter } from 'gray-matter';
  const f = matter('---\ntitle: Hello\ntags: [a, b]\n---\n# Body');
