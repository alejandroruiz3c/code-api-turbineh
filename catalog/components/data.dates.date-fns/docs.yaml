  - Pure date arithmetic
  - Date comparison
  - Date formatting
when_to_use:
  - When performing date calculations or parsing ISO strings
when_not_to_use:
  - instead: date-fns-tz
    why: Does not handle time zones by itself
tradeoffs:
  - Provides pure functions for date manipulation
