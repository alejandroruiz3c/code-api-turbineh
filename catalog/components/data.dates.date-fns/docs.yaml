example: |-
  import { addDays, differenceInCalendarDays, format, isBefore, parseISO } from "date-fns";
  const d = parseISO("2026-10-13T10:00:00Z");
  const diff = differenceInCalendarDays(addDays(d, 7), d);
  const formatted = format(new Date(2026, 9, 13), "yyyy-MM-dd");
  const before = isBefore(d, addDays(d, 1));
