example: |-
  import { addDays, differenceInCalendarDays, format, isBefore, parseISO } from "date-fns";

  const d = parseISO("2026-10-13T10:00:00Z");
  console.log(differenceInCalendarDays(addDays(d, 7), d)); // → 7
  console.log(isBefore(d, addDays(d, 1))); // → true
  console.log(format(new Date(2026, 9, 13), "yyyy-MM-dd")); // → "2026-10-13"
