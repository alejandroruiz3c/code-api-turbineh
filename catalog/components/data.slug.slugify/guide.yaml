component: data.slug.slugify
title: data.slug.slugify
summary: Turns titles into URL slugs with transliteration. Does not ensure uniqueness against a database.
  Turns titles into URL slugs with transliteration by coercing foreign symbols to their English equivalents.
keywords:
  - slugify
  - data.slug
  - data
  - slug
  - transliteration
  - url-friendly
  - string-manipulation
  - unicode
synonyms:
  slugify:
    - slug generator
    - string to slug
use_cases:
  - Generating URL-friendly strings from titles
  - Transliterating Unicode symbols to English equivalents
  - Creating slugs with custom separators or character removal
use_when:
  - When you need to convert strings into lowercase, strict URL slugs
  - When you need to replace spaces with specific characters like underscores
avoid_when:
  - Does not ensure uniqueness against a database — use a database-backed uniqueness check
tradeoffs:
  - choice: transliteration
    gain: Coerces foreign symbols to their English equivalent
    cost: Requires manual extension for undefined Unicode symbols
