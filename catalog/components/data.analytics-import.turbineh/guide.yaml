schema: turbineh.guide/v0.1
component: data.analytics-import.turbineh
title: Analytics from CSV imports — all-or-nothing validation, periods, comparisons, per-scope access, chart exports
summary: >-
  Turns "managers upload daily sales as CSV (date, shop, product, quantity, revenue); invalid rows are rejected with a
  clear report and never half-imported" into a working dashboard. Each file is validated row by row first and imported
  whole in one transaction, or not at all with a report of line, column and reason. The dashboard shows totals compared
  with the previous period of equal length, measures by day, week, month, quarter or year, top values of each dimension
  and a comparison between shops, filtered by date range and shop; every chart exports its numbers as CSV with the same
  filters. With per-record scopes a shop manager sees and imports only their shop while the owner sees all.
keywords:
  [analytics, dashboard, csv import, upload csv, validation report, all or nothing, kpi, revenue, units, by day, by week,
   by month, previous period, comparison, top products, filters, date range, export csv, per shop, per store]
synonyms:
  import: [upload, load, ingest]
  measure: [metric, kpi, revenue, quantity, units]
  dimension: [shop, store, product, region, category]
use_cases:
  - "Daily sales of six coffee shops uploaded as CSV, with revenue and units by day, week and month"
  - "Shop managers who see only their shop while the owner compares all shops"
  - "Exporting the numbers behind every chart as CSV"
use_when:
  - "The request uploads or imports CSV data and asks for totals, periods, comparisons or charts"
  - "Invalid rows must be reported and never partially imported"
avoid_when:
  - "Data entered record by record in forms (generated CRUD with a summary page)"
  - "Live connections to external databases or BI tools"
tradeoffs:
  - { choice: "Generic rows (date + JSON dimensions and measures)", gain: "Any column set from the request without generated tables", cost: "No per-column database types or indexes beyond date and scope" }
  - { choice: "Validate everything before one insert transaction", gain: "Never half-imported; one complete report", cost: "Whole file in memory (bounded to 5 MB / 50,000 rows)" }
  - { choice: "Bars and tables instead of a chart library", gain: "No dependency, accessible, the same numbers as the CSV export", cost: "No line or pie charts" }
config:
  - { name: "src/analytics-import/params.json", default: "date, store, product, quantity, revenue; day/week/month", description: "Columns, periods, comparisons, filters and exports from the request (validated at start-up)" }
interfaces:
  - { name: importCsv, signature: "importCsv(actor, fileName, text) → { ok: true, rows } | { ok: false, errors: { line, column, message }[] }", where: src/analytics-import/service.ts }
  - { name: "Queries", signature: "totals(actor, filters); series(actor, filters, period); byDimension(actor, filters, dimension, limit?); scopeValues(actor); lastDay(actor)", where: src/analytics-import/service.ts }
  - { name: "Rules", signature: "parseCsv(text); validateCsv(text, dataset, allowedScopes?); periodStart(day, period); previousRange(from, to); change(now, before)", where: src/analytics-import/rules.ts }
  - { name: "Dataset", signature: "toDataset(params) → { columns, date, measures, dimensions, scope, periods, compare, exportCsv }", where: src/analytics-import/config.ts }
  - { name: "Pages", signature: "/dashboard/reports (filters from, to, period, scope); /dashboard/reports/import; /dashboard/reports/export?chart=series|compare|top-<dimension>", where: src/app/dashboard/reports/page.tsx }
extension_points:
  - what: "Add a column, change which columns are numbers or which one is the scope"
    where: "src/analytics-import/params.json"
    how: "Edit columns (and measures/dateColumn/scopeColumn when names do not say it); validated at start-up; the unit tests cover the roles."
  - what: "Add a validation rule (e.g. revenue must equal quantity × price)"
    where: "src/analytics-import/rules.ts (validateCsv)"
    how: "Push a { line, column, message } error; the file stays all-or-nothing. Add a unit test."
  - what: "Add a chart"
    where: "src/app/dashboard/reports/page.tsx, src/analytics-import/service.ts, src/app/dashboard/reports/export/route.ts"
    how: "Add a query in the service (it applies workspace and scope filters), render it with <Bars> and add its chart key to the export route."
compatibility:
  runtime: "node >= 20"
  framework: "next ^16 (server actions), drizzle-orm with PostgreSQL (jsonb, date_trunc), zod 4"
  recipes: [analytics-dashboard, internal-tool, saas-crud]
  requires: []
  works_with: [domain.membership-access.turbineh, domain.audit-log.turbineh]
  notes: "Per-shop access needs domain.membership-access.turbineh with a scope whose names match the scope column's values."
security:
  - "Imports require a member who may create; restricted members may import only rows of their own scopes"
  - "Every query is filtered by workspace and visible scopes; exports use the same filters"
  - "Column names come from validated params and reach SQL only as parameters"
  - "Files are bounded (5 MB, 50,000 rows) and rate-limited per person"
guarantees:
  - { claim: "An invalid file imports nothing and reports line, column and reason", test: "tests/e2e/analytics-import.spec.ts › a CSV upload with one invalid row: the entire file is rejected, nothing is imported, and the report provides the row number, field and reason for each error" }
  - { claim: "Valid files are imported whole and aggregated by period", test: "tests/e2e/analytics-import.spec.ts › a valid CSV is imported whole and the dashboard shows totals by day, week and month" }
  - { claim: "Totals are compared with the previous period and between shops", test: "tests/e2e/analytics-import.spec.ts › the dashboard compares the period with the previous one and between values of each dimension" }
  - { claim: "Every chart exports as CSV with the same filters", test: "tests/e2e/analytics-import.spec.ts › every chart on the dashboard exports its data as a CSV file with the same filters" }
  - { claim: "Shop managers see and import only their shop", test: "tests/e2e/analytics-scopes.spec.ts › a shop manager sees only their own shop's figures and cannot import another shop's" }
  - { claim: "Validation is all-or-nothing with a report", test: "tests/unit/analytics-import.test.ts › rejects the whole file when any row is invalid, with the line, column and reason of each problem" }
limits:
  - "5 MB and 50,000 rows per file; aggregates computed per request in PostgreSQL"
  - "Bars and tables only (no line or pie charts)"
example: |
  // src/analytics-import/params.json — Brightside Coffee
  { "entity": "DailySale", "columns": ["date", "shop", "product", "quantity", "revenue"], "periods": ["day", "week", "month"],
    "compareWithPreviousPeriod": true, "filters": ["date range", "shop"], "exportCsv": true, "atomic": true, "errorReport": true }
params:
  file: src/analytics-import/params.json
  schema: params.schema.json
  fields:
    - { name: "columns", description: "CSV header in order; date/day is the date, amounts and counts are measures, the rest dimensions" }
    - { name: "dateColumn / measures", description: "Overrides when the column names do not say what they are" }
    - { name: "scopeColumn", default: "a dimension named in filters", description: "Dimension whose values are per-record scopes (shop); null = none" }
    - { name: "periods", default: "[\"day\", \"week\", \"month\"]", description: "Aggregation periods" }
    - { name: "compareWithPreviousPeriod", default: "true", description: "KPIs vs the previous period of equal length" }
    - { name: "filters", description: "Filters stated in the request" }
    - { name: "exportCsv", default: "true", description: "Every chart exports as CSV" }
  example: |
    { "entity": "DailySale", "columns": ["date", "shop", "product", "quantity", "revenue"], "periods": ["day", "week", "month"], "filters": ["date range", "shop"] }
