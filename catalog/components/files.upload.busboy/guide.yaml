component: files.upload.busboy
title: busboy
summary: Streaming multipart/form-data parser for file uploads. Does not store files. A streaming
  multipart/form-data parser for Node.js HTML form data.
keywords:
  - busboy
  - files.upload
  - files
  - upload
  - multipart
  - parser
  - streaming
  - form-data
  - node.js
synonyms:
  busboy:
    - multipart parser
use_cases:
  - Parsing incoming multipart/form-data file uploads
  - Extracting text fields from HTML forms
  - Streaming file data directly to disk or other destinations
use_when:
  - When you need to parse streaming multipart/form-data in a Node.js environment
  - When you want to process files as they arrive without buffering the entire payload in memory
avoid_when:
  - If you only need to detect file types rather than parse form data — use files.type-detection.file-type
  - If you require client-side file selection UI instead of server-side parsing — use
    files.dropzone.react-dropzone
tradeoffs:
  - choice: Streaming architecture
    gain: Low memory footprint for large file uploads
    cost: Requires handling asynchronous events (file, field, close) manually
