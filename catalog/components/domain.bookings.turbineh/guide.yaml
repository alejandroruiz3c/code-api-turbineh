schema: turbineh.guide/v0.1
component: domain.bookings.turbineh
title: Booking domain (appointments, availability, policy) with an assistant toolkit
name: "Bookings"
tagline: "A public booking page, a staff calendar and a notice policy."
summary: >-
  Everything an appointment business needs behind its assistant or its staff: team members or rooms, services with
  duration and price, opening hours per weekday in an IANA time zone (DST-correct), availability computed from real
  data, create / move / cancel with a notice policy, find bookings by email, double-booking refused by the database,
  confirmation emails recorded, and staff pages behind an ADMIN_EMAILS allow-list. Parameters come from the request.
  In AI apps it exposes six tools to runAgent; create/move/cancel need the person's confirmation.
keywords:
  [booking, bookings, appointment, appointments, reservation, scheduling, availability, slots, calendar, opening hours,
   business hours, time zone, dst, cancellation policy, notice period, double booking, clinic, salon, restaurant,
   physiotherapy, dentist, barber, studio, receptionist]
synonyms:
  booking: [appointment, reservation, session, visit, slot, cita, reserva]
  resource: [staff member, physiotherapist, therapist, stylist, doctor, room, table, court, chair]
  customer: [patient, client, guest, diner, member, student]
  cancellation policy: [notice period, minimum notice, cancel up to N hours before]
use_cases:
  - "AI booking assistant for a clinic, salon, studio or restaurant (public chat, no sign-in)"
  - "Staff dashboard to see, book, cancel and manage the team and the assistant's answers"
use_when:
  - "People book time with a person or a room on fixed opening hours"
  - "The request names hours, durations, a time zone, a team size or a cancellation rule"
avoid_when:
  - "Ticketed events with seat maps or capacity per slot (one booking per resource per time)"
  - "Multi-business marketplaces (one business per app)"
  - "Payments at booking time or external calendar sync are required (not included)"
tradeoffs:
  - { choice: "Start times on a grid (slotMinutes from each opening time)", gain: "Simple, predictable offers and a database-level overlap guard", cost: "No arbitrary start minutes" }
  - { choice: "Changes need reference + email", gain: "Nobody changes someone else's booking by guessing an email", cost: "People keep the reference from the confirmation" }
  - { choice: "Parameters in src/bookings/params.json", gain: "Deterministic, reviewable, editable", cost: "Changing hours is a code/config change (team and answers are editable in the dashboard)" }
config:
  - { name: ADMIN_EMAILS, default: "", description: "Comma-separated staff emails allowed to see and manage appointments (deny by default)" }
  - { name: "src/bookings/params.json", default: "from the request", description: "business, timeZone, resource {singular, plural, count, names}, customer, services [{name, minutes, price, currency}], slotMinutes, hours [{weekday 1–7, open, close}], policy {cancelNoticeHours, bookingNoticeMinutes, horizonDays}, faq [{topic, answer|null}]" }
interfaces:
  - { name: availability, signature: "availability({ day, resource?, service?, now? }) → { day, timeZone, service, slots: [{ time, resource, start, end }] }", where: src/bookings/service.ts }
  - { name: createAppointment, signature: "createAppointment({ day, time, resource?, service?, name, email, via }) → { reference, when, resource, service, price, emailTransport }", where: src/bookings/service.ts }
  - { name: moveAppointment, signature: "moveAppointment(reference, email, { day, time, resource? }, { byStaff? })", where: src/bookings/service.ts }
  - { name: cancelAppointment, signature: "cancelAppointment(reference, email, { byStaff? })", where: src/bookings/service.ts }
  - { name: emailUpcomingAppointments, signature: "emailUpcomingAppointments(email) → boolean — emails the upcoming list with references to that address (10-min cooldown); the chat always gets the same reply", where: src/bookings/service.ts }
  - { name: toolkit, signature: "business_info, check_availability, book_appointment*, find_appointments, reschedule_appointment*, cancel_appointment* (* = confirmation)", where: src/bookings/toolkit.ts }
  - { name: "Pure rules", signature: "dayStarts, freeSlots, assertBookableDay, canChange, cellsOf; zonedToUtc, localDay, localTime", where: src/bookings/availability.ts }
  - { name: "Staff pages", signature: "/dashboard/appointments (list, book, cancel), /[id] (move, cancel), /calendar (day/week per team member), /time-off, /settings (team, answers)", where: src/app/dashboard/appointments/page.tsx }
  - { name: "Public pages", signature: "/book (service, team member or any, free times, name/email/phone; publicAction bookSlot), /book/cancel/[token] (cancel link, notice policy)", where: src/app/book/page.tsx }
  - { name: "Management", signature: "cancelByToken(token); appointmentByCancelToken(token); staffMove(id, { day, time, resource? }); addTimeOff({ resourceId, day, from, to, reason?, by }); removeTimeOff(id); calendar(fromDay, days, resourceId?)", where: src/bookings/manage.ts }
extension_points:
  - what: "Change hours, services, prices, time zone or policy"
    where: "src/bookings/params.json"
    how: "Edit the JSON; it is validated at start-up (BookingParams in src/bookings/config.ts) and the unit tests check it."
  - what: "Add an assistant capability (e.g. waiting list, staff notes)"
    where: "src/bookings/toolkit.ts"
    how: "Add a function to service.ts that enforces the rule, then a defineTool() calling it; irreversible: true + prepare() if it changes data. Add a mock rule in tests/mock-llm/scripts/bookings.ts and an E2E case."
  - what: "Change the public booking page or what the customer enters"
    where: "src/app/book/page.tsx, src/app/book/actions.ts (publicAction bookSlot)"
    how: "Keep it a publicAction (rate limit + Zod schema first); createAppointment re-checks the time against real availability."
  - what: "Change the cancel link or its notice rule"
    where: "src/bookings/manage.ts (cancelByToken), src/bookings/params.json (policy.cancelNoticeHours)"
    how: "The token is single-use per booking and stored hashed; the notice rule is canChange() in availability.ts."
  - what: "Add fields to the public booking form (consent boxes, a note) and act once a booking exists"
    where: "src/bookings/extensions.ts, src/bookings/form-extras.tsx"
    how: "bookingExtraFields (Zod) joins the form's schema, checkBookingExtras can refuse with a message before anything is booked, afterBooking runs once the booking exists (never undoes it); BookingFormExtras renders the fields. domain.reminders.turbineh replaces both files to add its reminder consent boxes."
  - what: "Different availability rule (breaks, holidays)"
    where: "src/bookings/availability.ts"
    how: "Filter dayStarts()/freeSlots(); everything (assistant, staff form) uses them, so one change applies everywhere."
compatibility:
  runtime: "node >= 20"
  framework: "next ^16, drizzle-orm with PostgreSQL, zod 4"
  recipes: [ai-agents, bookings]
  requires: []
  works_with: [ai.orchestrator.turbineh, email.transactional.turbineh, domain.reminders.turbineh]
  notes: "The AI part (files-ai/: toolkit, mock script, assistant E2E) is installed only with ai.orchestrator.turbineh; the domain, staff pages and unit tests work without AI."
security:
  - "Staff pages and server actions require a signed-in member on ADMIN_EMAILS (deny by default)"
  - "Moving or cancelling needs reference + email; email lookups never reveal references"
  - "Double booking refused by a primary key on (resource, time cell) inside the same transaction as the booking"
  - "Queries only through Drizzle; dates validated; errors to people are PolicyError messages only"
guarantees:
  - { claim: "Never books an invented or taken time", test: "tests/e2e/booking-assistant.spec.ts › never books an invented time" }
  - { claim: "Books only after confirmation and records the confirmation email", test: "tests/e2e/booking-assistant.spec.ts › a customer books through the assistant only a real free slot, after confirming the date, time and staff member; it triggers the confirmation email (logged) and staff see the booking" }
  - { claim: "Reschedules with reference + email", test: "tests/e2e/booking-assistant.spec.ts › a customer requests to reschedule: the assistant uses the booking tool to move an existing booking to a new free slot, with its reference and email, after the customer confirms" }
  - { claim: "Refuses cancellations inside the notice period", test: "tests/e2e/booking-assistant.spec.ts › a customer requests to cancel a booking that starts less than the notice hours away (inside the notice period): the assistant refuses the cancellation" }
  - { claim: "DST-correct local times", test: "tests/unit/bookings.test.ts › converts local times to instants across DST (Europe/Madrid)" }
  - { claim: "Database-level double-booking guard", test: "tests/unit/bookings.test.ts › locks every grid cell a booking covers (database-level double-booking guard)" }
  - { claim: "Only staff on ADMIN_EMAILS see appointments", test: "tests/e2e/booking-assistant.spec.ts › only staff on ADMIN_EMAILS see appointments" }
  - { claim: "Customers book a real free time on the public page and receive a cancel link", test: "tests/e2e/bookings.spec.ts › a customer books a free time on the public page without an account: provides name, email and phone, the booking is created and a confirmation email with a cancel link is sent" }
  - { claim: "The same time is never booked twice for one team member, even from a stale page", test: "tests/e2e/bookings.spec.ts › a customer cannot book a slot already taken: the same time is never booked twice for one team member (double booking prevented)" }
  - { claim: "The cancel link honours the notice policy", test: "tests/e2e/bookings.spec.ts › a customer cancels the booking with the link of the confirmation email more than the notice hours before the start time; inside the notice period the link is refused" }
  - { claim: "Staff calendar per team member, day and week", test: "tests/e2e/bookings.spec.ts › a staff member signs in and sees the bookings in the day and week calendar per team member (stylist, therapist…)" }
  - { claim: "Time off removes times from what customers are offered", test: "tests/e2e/bookings.spec.ts › a staff member blocks time off to make those time slots unavailable for booking; customers are no longer offered them" }
  - { claim: "Staff moves and cancellations email the customer", test: "tests/e2e/bookings.spec.ts › a staff member moves an existing booking to a different time slot, then cancels it, triggering an automated email to the customer each time" }
  - { claim: "Times outside the opening hours are never offered or booked", test: "tests/e2e/bookings.spec.ts › a booking outside the opening hours is rejected: on a closed day no time is offered, and a time after closing is refused" }
limits:
  - "One business per app; one booking per resource per time cell; up to 60 slots per answer; horizon from params (default 60 days)"
  - "No payments, reminders or external calendar sync"
  - "Time off is checked when times are offered and booked; a booking racing a time-off change in the same instant is not locked out"
  - "Local times inside a DST gap are never offered; ambiguous fall-back times use the first occurrence"
example: |-
  // Server code in the app (e.g. a staff action in src/app/dashboard/appointments/actions.ts).
  import { availability, createAppointment } from "@/bookings/service";

  export async function bookFirstFreeSlot(day: string, name: string, email: string) {
    const free = await availability({ day }); // real free times: hours, duration, time zone, existing bookings
    const first = free.slots[0];
    if (!first) return null;
    return createAppointment({ day, time: first.time, name, email, via: "staff" });
  }

  export const example = () => bookFirstFreeSlot("2026-11-02", "Ana García", "ana@example.com");
example_check:
  kind: app
  from: snippet.ts
params:
  file: src/bookings/params.json
  schema: params.schema.json
  fields:
    - { name: "business", description: "Business name shown on pages and in emails" }
    - { name: "timeZone", default: "UTC", description: "IANA time zone of the opening hours (DST handled)" }
    - { name: "resource { singular, plural, count, names[] }", default: "one Staff member", description: "Who is booked (stylists, physiotherapists, rooms) and how many" }
    - { name: "customer { singular, plural }", default: "customer", description: "How customers are called" }
    - { name: "services[] { name, minutes, price, currency }", description: "Services with their own duration and price (null = not published)" }
    - { name: "slotMinutes", description: "Grid of start times (GCD of the durations)" }
    - { name: "hours[] { weekday 1–7, open, close }", default: "Monday–Friday 09:00–17:00", description: "Opening windows, local time" }
    - { name: "policy { cancelNoticeHours, bookingNoticeMinutes, horizonDays }", default: "24 h, 0, 60 days", description: "Customers cancel or move up to cancelNoticeHours before; staff always can" }
    - { name: "faq[] { topic, answer|null }", default: "[]", description: "Questions the assistant answers; null answers are never invented" }
    - { name: "businessKind", default: "null", description: "What the business is in the request's word (clinic, salon); used by criteria aliases" }
    - { name: "askPhone", default: "false", description: "The public booking page asks for (and requires) a phone number" }
  example: |
    { "business": "Sala Nueve", "timeZone": "Europe/Madrid", "resource": { "singular": "Stylist", "plural": "Stylists", "count": 4, "names": [] },
      "services": [{ "name": "Cut", "minutes": 30, "price": 25, "currency": "EUR" }], "slotMinutes": 30,
      "hours": [{ "weekday": 2, "open": "10:00", "close": "20:00" }], "policy": { "cancelNoticeHours": 12, "bookingNoticeMinutes": 0, "horizonDays": 60 },
      "customer": { "singular": "customer", "plural": "customers" }, "faq": [], "askPhone": true }
