schema: turbineh.guide/v0.1
component: ai.vector-store.pgvector
title: pgvector
summary: "Stores and searches embeddings in Postgres with pgvector (Drizzle and SQL helpers), no extra
  database. Does not compute embeddings: they come from the orchestrator. Stores and searches embeddings in
  Postgres using the pgvector extension. Provides helpers for SQL serialization and in-memory cosine
  similarity."
keywords:
  - pgvector
  - ai.vector-store
  - ai
  - vector
  - store
  - postgres
  - embeddings
  - vector-store
  - similarity
  - cosine-similarity
synonyms:
  pgvector-node:
    - pgvector support
use_cases:
  - Storing high-dimensional vector embeddings in a Postgres database
  - Performing similarity searches using SQL queries
  - Re-ranking small sets of candidates in memory using cosine similarity
use_when:
  - When you already use a Postgres-compatible database (Drizzle, Knex, Prisma, etc.)
  - When you need to store and query embeddings without adding an external vector database
avoid_when:
  - If you need a system that also computes the embeddings rather than just storing them — use
    ai.orchestrator.turbineh
  - If you require specialized vector-only infrastructure instead of extending Postgres — use external vector
    databases
tradeoffs:
  - choice: Using pgvector extension
    gain: No extra database infrastructure required; unified data management
    cost: Requires Postgres with the pgvector extension enabled
