example: |-
  import pgvector from "pgvector";

  console.log(pgvector.toSql([0.1, 0.2, 0.3])); // → "[0.1,0.2,0.3]"
  console.log(pgvector.fromSql("[1,2,3]")); // → [1, 2, 3]
