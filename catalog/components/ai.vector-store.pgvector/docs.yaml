# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ai.vector-store.pgvector
does: Stores and searches embeddings in Postgres with pgvector (Drizzle and SQL helpers), no extra database
does_not: "Does not compute embeddings: they come from the orchestrator"
use_cases:
  - Storing and searching vector embeddings within a PostgreSQL database
  - Converting embedding arrays to SQL-compatible string literals
  - Calculating cosine similarity for in-memory re-ranking of candidates
when_to_use:
  - When using PostgreSQL and want to avoid managing a separate vector database
  - When using Drizzle, Knex, Prisma, or other common Node.js SQL ORMs
when_not_to_use:
  - instead: ai.orchestrator.turbineh
    why: This component does not compute embeddings; they must be provided by an orchestrator.
tradeoffs:
  - Requires the pgvector extension to be enabled in the PostgreSQL instance
inputs:
  - name: pnpm add pgvector@0.3.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: toVectorSql
    kind: export
    about: Converts a numeric embedding array into a pgvector SQL literal string. Rejects non-finite values.
  - name: fromVectorSql
    kind: export
    about: Converts a pgvector SQL string back into a numeric embedding array.
  - name: cosineSimilarity
    kind: export
    about: Calculates the cosine similarity between two vectors in the range [-1, 1].
  - name: pgvector
    kind: export
    about: Core library for registering types and handling pgvector operations.
extension_points: []
dependencies:
  package: pgvector
  version: 0.3.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No specific security guarantees provided in documentation.
guarantees:
  - claim: serialises embeddings to and from the pgvector SQL format
    test:
      file: contract.test.ts
      title: serialises embeddings to and from the pgvector SQL format
limits:
  - Does not perform embedding generation
example: |-
  import { toVectorSql, fromVectorSql, cosineSimilarity } from '@/integrations/ai-vector-store';

  const sql = toVectorSql([0.1, 0.2, 0.3]);
  const array = fromVectorSql('[1,2,3]');
  const sim = cosineSimilarity([0.1, 0.2], [0.1, 0.2]);
keywords:
  - pgvector
  - ai.vector-store
  - ai
  - vector
  - store
  - postgres
  - embeddings
  - vector-search
  - similarity
  - sql-helpers
