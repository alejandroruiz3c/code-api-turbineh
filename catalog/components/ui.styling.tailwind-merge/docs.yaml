schema: turbineh.component-docs/v1
id: ui.styling.tailwind-merge
does: Merges Tailwind CSS classes resolving conflicts (last wins)
does_not: Does not generate CSS
use_cases:
  - Merging Tailwind CSS classes to resolve conflicts
  - Ensuring the last utility in a class list takes precedence
when_to_use:
  - When you need to merge dynamic Tailwind classes without style conflicts
when_not_to_use:
  - instead: ui.animation.motion
    why: When you need animation logic rather than class merging
tradeoffs:
  - Does not generate CSS
inputs:
  - name: pnpm add tailwind-merge@3.7.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: twMerge
    kind: export
    about: Merges Tailwind CSS classes resolving conflicts (last wins)
extension_points: []
dependencies:
  package: tailwind-merge
  version: 3.7.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database access required
guarantees:
  - claim: keeps the last conflicting utility
    test:
      file: contract.test.ts
      title: keeps the last conflicting utility
limits:
  - Does not generate CSS
example: |-
  import { twMerge } from "tailwind-merge";
  twMerge("px-2 py-1 bg-red-500", "px-4 bg-blue-500");
