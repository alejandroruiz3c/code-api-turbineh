schema: turbineh.component-docs/v1
id: ui.dialog.radix-dialog
does: Accessible modal dialog primitives (focus trap, aria)
does_not: Does not style the dialog
use_cases:
  - Implementing accessible modal dialogs
  - Creating focus-trapped overlays
when_to_use:
  - When you need unstyled accessible dialog primitives with aria support
when_not_to_use:
  - instead: ui.alert-dialog.radix
    why: When a specialized alert dialog pattern is required
  - instead: styling the component directly
    why: The component does not provide any visual styles
tradeoffs:
  - Provides accessibility logic but requires manual CSS/styling implementation
inputs:
  - name: pnpm add @radix-ui/react-dialog@1.1.23
    kind: install
    about: Exact version, added by TurbineH.
