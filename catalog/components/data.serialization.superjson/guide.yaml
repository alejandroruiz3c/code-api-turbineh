schema: turbineh.guide/v0.1
component: data.serialization.superjson
title: data.serialization.superjson
summary: Serialises Dates, Maps, Sets and BigInts across the network boundary. Does not validate data. A
  serialization library that extends JSON to support JavaScript types like Dates, Maps, Sets, and BigInts
  across network boundaries.
keywords:
  - superjson
  - data.serialization
  - data
  - serialization
  - deserialization
  - json superset
  - dates
  - maps
  - sets
  - bigint
synonyms:
  superjson:
    - serialization wrapper
use_cases:
  - Serializing complex JavaScript objects for network transmission
  - Bypassing Next.js serialization limitations in getServerSideProps and getInitialProps
  - Transmitting metadata alongside JSON for client-side reconstruction
use_when:
  - When you need to preserve non-JSON types like Map, Set, or BigInt during serialization
avoid_when:
  - If you only need to serialize standard JSON-compatible types and do not require type preservation for
    Dates or Maps — use JSON.stringify
tradeoffs:
  - choice: Superjson wrapper
    gain: Preserves complex JS types across boundaries
    cost: Requires both sender and receiver to use superjson for full reconstruction
config:
  - name: install
    description: pnpm add superjson@2.2.6 (exact version, added by TurbineH)
interfaces:
  - name: superjson
    signature: import superjson from "superjson"
    where: superjson
extension_points:
  - what: Next.js SWC plugin
    where: next.config.js
    how: Add 'next-superjson-plugin' to the experimental.swcPlugins array.
compatibility:
  package: superjson@2.2.6
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: round-trips dates and maps
    test: contract.test.ts › round-trips dates and maps
limits:
  - Does not validate data
example: |-
  import superjson from "superjson";

  const v = { at: new Date("2026-10-13T00:00:00Z"), m: new Map([["a", 1]]) };
  const back = superjson.parse<typeof v>(superjson.stringify(v));
  console.log(back.at instanceof Date); // → true
  console.log(back.m.get("a")); // → 1
