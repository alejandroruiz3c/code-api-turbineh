# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: content.rss.feed
does: Generates RSS 2.0, Atom and JSON feeds for blogs and news
does_not: Does not fetch or parse feeds
use_cases:
  - Generating RSS 2.0 feeds for blogs
  - Generating Atom 1.0 feeds
  - Generating JSON Feed 1.0 for news syndication
when_to_use:
  - When you need to create syndication files from existing content data
when_not_to_use:
  - instead: content.html-parse.cheerio
    why: This component does not fetch or parse feeds; it only generates them.
tradeoffs:
  - Requires manual construction of feed and item objects from your own data source.
inputs:
  - name: pnpm add feed@6.0.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Feed
    kind: export
    about: A class used to construct RSS, Atom, and JSON feeds with metadata and items.
extension_points: []
dependencies:
  package: feed
  version: 6.0.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access is performed by this component.
guarantees:
  - claim: renders an RSS 2.0 document with items
    test:
      file: contract.test.ts
      title: renders an RSS 2.0 document with items
limits:
  - Does not perform network requests to fetch external content.
example: |-
  import { Feed } from "feed";

  const f = new Feed({
    title: "Blog",
    id: "https://example.com",
    link: "https://example.com",
    copyright: "©",
  });
  f.addItem({
    title: "First post",
    link: "https://example.com/p/1",
    date: new Date("2026-01-01"),
  });
  const xml = f.rss2();
keywords:
  - feed
  - content.rss
  - content
  - rss
  - atom
  - json-feed
  - syndication
  - generator
  - node.js
