component: content.rss.feed
title: content.rss.feed
summary: Generates RSS 2.0, Atom and JSON feeds for blogs and news. Does not fetch or parse feeds. A generator
  for RSS 2.0, Atom 1.0, and JSON Feed 1.0 formats for Node.js content syndication.
keywords:
  - feed
  - content.rss
  - content
  - rss
  - atom
  - json feed
  - syndication
  - generator
synonyms:
  feed generator:
    - rss generator
    - atom generator
use_cases:
  - Generating RSS 2.0 feeds for blogs
  - Creating Atom 1.0 syndication feeds
  - Producing JSON Feed 1.0 documents
  - Syndicating news content
use_when:
  - When you need to generate structured syndication files from existing content data
avoid_when:
  - This component only generates feeds and does not perform network requests or parsing — use fetching or
    parsing feeds
tradeoffs:
  - choice: Manual feed construction
    gain: Full control over feed metadata and item properties
    cost: Requires providing all required fields like title and id manually
config:
  - name: install
    description: pnpm add feed@6.0.0 (exact version, added by TurbineH)
interfaces:
  - name: Feed
    signature: import { Feed } from "feed"
    where: feed
extension_points:
  - what: Add items to the feed
    where: Feed instance
    how: addItem()
compatibility:
  package: feed@6.0.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: renders an RSS 2.0 document with items
    test: contract.test.ts › renders an RSS 2.0 document with items
limits:
  - Does not fetch or parse external feeds.
example: |-
  import { Feed } from "feed";

  const f = new Feed({
    title: "Blog",
    id: "https://example.com",
    link: "https://example.com",
    copyright: "©",
  });
  f.addItem({
    title: "First post",
    link: "https://example.com/p/1",
    date: new Date("2026-01-01"),
  });
  const xml = f.rss2();
  console.log(xml); // → contains "<rss"
  console.log(xml); // → contains "First post"
