schema: turbineh.component-docs/v1
id: ui.markdown.marked
does: Fast Markdown to HTML conversion
does_not: Does not sanitize the generated HTML (combine with sanitize-html)
use_cases:
  - Fast Markdown to HTML conversion
  - Parsing markdown in browser, server, or CLI environments
when_to_use:
  - When high-speed markdown parsing is required without caching or blocking
  - When a lightweight compiler is needed for various environments
when_not_to_use:
  - instead: sanitize-html
    why: The component does not sanitize the generated HTML
tradeoffs:
  - Low-level compiler provides speed but requires external sanitization for security
inputs:
  - name: pnpm add marked@18.0.14
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: marked
    kind: export
    about: The main marked object providing parsing capabilities
extension_points:
  - Custom extensions via advanced configuration
dependencies:
  package: marked
  version: 18.0.14
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Does not sanitize output HTML; must be combined with a library like DOMPurify or sanitize-html
guarantees:
  - claim: renders markdown to html
    test:
      file: contract.test.ts
      title: renders markdown to html
limits:
  - Does not provide built-in HTML sanitization
example: |-
  import { marked } from "marked";
  const html = marked.parse("# Title\n\n**bold**");
keywords:
  - marked
  - ui.markdown
  - ui
  - markdown
  - parser
  - html
  - compiler
  - fast
  - lightweight
