schema: turbineh.guide/v0.1
component: files.docx-text.mammoth
title: files.docx-text.mammoth
summary: Extracts plain text or clean HTML from Word .docx documents. Does not read legacy .doc files or keep
  complex layout. Extracts plain text or clean HTML from Word .docx documents using semantic information.
keywords:
  - mammoth
  - files.docx-text
  - files
  - docx
  - text
  - word
  - extraction
  - html
synonyms:
  mammoth converter:
    - docx to html converter
use_cases:
  - Converting .docx files to clean HTML fragments
  - Extracting raw text from Word documents
  - Converting semantic styles like headings and lists to HTML elements
use_when:
  - When you need to convert .docx to simple, semantic HTML or Markdown
  - When you want to ignore complex layout and focus on document structure
avoid_when:
  - When you need to read legacy .doc files — use files.office-text.officeparser
  - When you need to keep complex document layouts — use manual layout preservation
tradeoffs:
  - choice: Semantic conversion
    gain: Produces clean, usable HTML/Markdown by mapping styles (e.g., Heading 1 to h1)
    cost: Conversion is unlikely to be perfect for complicated documents due to structural mismatches between
      .docx and HTML
config:
  - name: install
    description: pnpm add mammoth@1.13.0 (exact version, added by TurbineH)
interfaces:
  - name: docxToText
    signature: "async function docxToText(data: Buffer): Promise<string>"
    where: "@/integrations/files-docx-text"
  - name: mammoth
    signature: import { mammoth } from "mammoth"
    where: mammoth
extension_points:
  - what: Customisable mapping from your own docx styles to HTML
    where: mammoth
    how: Provide a style map (e.g., using --style-map) to convert specific docx styles like WarningHeading to
      specific HTML classes.
compatibility:
  package: mammoth@1.13.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence BSD-2-Clause; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Mammoth performs no sanitisation of the source document and should be used extremely carefully with
    untrusted user input.
guarantees:
  - claim: extracts raw text from a .docx
    test: contract.test.ts › extracts raw text from a .docx
  - claim: rejects files that are not .docx
    test: contract.test.ts › rejects files that are not .docx
limits:
  - Does not read legacy .doc files
  - Does not keep complex layout
  - Maximum file size is 20MB
example: |-
  import { docxToText } from '@/integrations/files-docx-text';

  const text = await docxToText(buffer);
