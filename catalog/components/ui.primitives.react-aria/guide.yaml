component: ui.primitives.react-aria
title: ui.primitives.react-aria
summary: Accessible unstyled components (buttons, fields, dialogs, date fields) from Adobe. Unstyled.
  Accessible unstyled components from Adobe providing built-in behavior, adaptive interactions, and
  internationalization support.
keywords:
  - react-aria-components
  - ui.primitives
