  - accessibility
  - unstyled
  - react-aria
  - internationalization
  - adaptive
synonyms:
  react aria components:
    - RAC
use_cases:
  - Building custom design systems with full control over styling
  - Implementing accessible forms and interactive elements
  - Creating internationalized user interfaces with localized date and number formatting
use_when:
  - When you need unstyled components that handle complex accessibility and interaction logic
  - When building applications requiring support for multiple calendar systems or right-to-left layouts
avoid_when:
  - If you prefer pre-styled components from a different primitive library — use ui.checkbox.radix
  - If you do not require advanced accessibility, internationalization, or adaptive interaction logic — use
    plain CSS/HTML
tradeoffs:
  - choice: Unstyled components
    gain: Complete control over visual design and animation solutions
    cost: Requires manual implementation of all visual styles
