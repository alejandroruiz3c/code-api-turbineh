security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network yes, filesystem no, database yes; external services: stripe."
  - HMAC-SHA256 signature verification
  - Constant-time comparison
  - Replay protection via timestamp tolerance
guarantees:
  - claim: Provides access only to active or trialing subscriptions
    test:
      file: files/tests/unit/billing.test.ts
      title: gives Pro access only to active or trialing subscriptions
  - claim: Verifies Stripe signatures with 5-minute tolerance and constant-time comparison
    test:
      file: files/tests/unit/billing.test.ts
      title: verifies Stripe signatures with replay protection
  - claim: Ensures plan state follows Stripe after subscription
    test:
      file: files/tests/e2e/billing.spec.ts
      title: an owner subscribes to Pro and the plan follows Stripe
limits:
  - Does not handle usage-based billing, taxes or multiple paid tiers out of the box (one Pro plan)
example: |-
  import { hasPaidAccess, verifySignature } from "turbineh/payments.subscriptions.turbineh";

  const isPro = hasPaidAccess("pro", "active");
  const isValid = verifySignature(rawBody, header, secret);
