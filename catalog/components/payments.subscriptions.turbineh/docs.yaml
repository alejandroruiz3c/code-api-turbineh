id: payments.subscriptions.turbineh
does: "Workspace subscriptions with Stripe Billing: hosted Checkout in subscription mode, Customer Portal,
  signed webhooks, requirePlan guard"
does_not: Does not handle usage-based billing, taxes or multiple paid tiers out of the box (one Pro plan)
use_cases:
  - Implementing workspace-based subscriptions using Stripe hosted Checkout and Customer Portal
  - when_not_to_use.instead_of_approach_or_component_id_from_alternatives_catalog_component_id_or_plain_approach_if_the_user_wants_to_handle_usage_based_billing_taxes_or_multiple_paid_tiers_out_of_the_box_or_if_they_only_need_simple_stripe_checkout_without_subscription_management_logic_use_payments.checkout.stripe
when_to_use:
  - When you need to manage workspace subscriptions via Stripe Billing with hosted Checkout and Customer
    Portal.
when_not_to_use:
  - instead: payments.checkout.stripe
    why: If you do not require subscription management, customer portals, or webhook-based plan enforcement.
