  signed webhooks, requirePlan guard. Does not handle usage-based billing, taxes or multiple paid tiers out of
  the box (one Pro plan). Workspace subscription management using Stripe Billing, featuring hosted Checkout,
  Customer Portal, and signed webhooks."
