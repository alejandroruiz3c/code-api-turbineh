schema: turbineh.guide/v0.1
component: data.phone.libphonenumber-js
title: data.phone.libphonenumber-js
summary: Parses, validates and formats international phone numbers. Does not verify that a number is
  reachable. A lightweight rewrite of Google's libphonenumber for parsing, validating, and formatting personal
  international phone numbers.
keywords:
  - libphonenumber-js
  - data.phone
  - data
  - phone
  - parsing
  - formatting
  - validation
  - e.164
  - international
synonyms:
  libphonenumber-js:
    - phone parser
    - phone formatter
use_cases:
  - Parsing international phone numbers from strings
  - Validating phone number formats
  - Formatting phone numbers into E.164 standard
use_when:
  - When you need a small bundle size for web applications
  - When you only need to handle personal phone numbers
avoid_when:
  - If you require support for emergency numbers, short codes, or alphabetic phone numbers — use Google's
    official libphonenumber port
  - If you are looking for a ready-made React component — use react-phone-number-input
tradeoffs:
  - choice: Stripped metadata and rewritten code
    gain: Smaller footprint (approx 145 kB vs 550 kB)
    cost: Skips special cases like emergency numbers, short codes, and combined extensions
config:
  - name: install
    description: pnpm add libphonenumber-js@1.13.14 (exact version, added by TurbineH)
interfaces:
  - name: parsePhoneNumberFromString
    signature: import { parsePhoneNumberFromString } from "libphonenumber-js"
    where: libphonenumber-js
extension_points:
  - what: metadata selection
    where: package configuration
    how: choose which parts of metadata to include
compatibility:
  package: libphonenumber-js@1.13.14
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: validates and formats E.164
    test: contract.test.ts › validates and formats E.164
limits:
  - Does not verify that a number is reachable
  - Does not support emergency numbers (e.g., 911)
  - Does not support short SMS codes
  - Does not support alphabetic phone numbers (e.g., 1-800-GOT-MILK)
example: |-
  import { parsePhoneNumberFromString } from "libphonenumber-js";

  const n = parsePhoneNumberFromString("+34 612 34 56 78");
  console.log(n?.isValid()); // → true
  console.log(n?.format("E.164")); // → "+34612345678"
  console.log(parsePhoneNumberFromString("123")?.isValid() ?? false); // → false
