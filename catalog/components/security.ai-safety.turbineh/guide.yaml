component: security.ai-safety.turbineh
title: security.ai-safety.turbineh
summary: "AI Safety Pack, always installed with the AI orchestrator: refuses prompt-injection requests and
  oversized input, keeps documents as data, optional redaction of personal data, scans answers for secrets,
  per-user rate limit and daily token allowances per user and workspace, tool allow-list with human
  confirmation for irreversible actions, audit record of every AI call (content stored only as a hash). Does
  not replace content moderation by a dedicated model; cannot be switched off. An AI Safety Pack that provides
  prompt-injection refusal, input size validation, PII redaction, secret scanning, rate limiting, and tool
  allow-listing with human confirmation for irreversible actions."
