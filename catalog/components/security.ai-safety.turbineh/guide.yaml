use_cases:
  - Preventing prompt-injection attacks
  - Enforcing per-user and per-workspace token limits
  - Redacting personal data from AI inputs/outputs
  - Auditing AI calls via content hashes
  - Restricting tool usage to an allow-list
use_when:
  - When implementing AI orchestrators requiring integrated safety guardrails
  - When needing to audit AI interactions without storing raw content
avoid_when:
  - Does not replace content moderation by a dedicated model — use dedicated content moderation model
tradeoffs:
  - choice: Audit logging
    gain: Provides an audit record of every AI call
    cost: Content is stored only as a hash
