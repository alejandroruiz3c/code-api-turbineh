  import { guardInput, redactPii, scanOutput } from '@/lib/ai/guard';

  const safeInput = await guardInput(userInput);
  const redacted = redactPii(safeInput);
  const response = await aiCaller.call(redacted);
  const cleanResponse = scanOutput(response);
