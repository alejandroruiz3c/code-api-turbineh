schema: turbineh.component-docs/v1
id: security.ai-safety.turbineh
does: "AI Safety Pack, always installed with the AI orchestrator: refuses prompt-injection requests and
  oversized input, keeps documents as data, optional redaction of personal data, scans answers for secrets,
  per-user rate limit and daily token allowances per user and workspace, tool allow-list with human
  confirmation for irreversible actions, audit record of every AI call (content stored only as a hash)"
does_not: Does not replace content moderation by a dedicated model; cannot be switched off
use_cases:
  - Preventing prompt-injection requests
  - Enforcing per-user and per-workspace token allowances
  - Redacting personal data from AI inputs
  - Scanning AI model outputs for secrets
  - Auditing AI calls via content hashes
when_to_use:
  - When using an AI orchestrator that requires integrated safety controls
  - When irreversible tool actions require human confirmation
when_not_to_use:
  - instead: dedicated content moderation model
    why: Does not replace content moderation by a dedicated model
tradeoffs:
  - Always installed with the AI orchestrator; cannot be switched off
