schema: turbineh.component-docs/v1
id: data.ids.nanoid
does: Compact, URL-safe, cryptographically strong unique IDs
does_not: Does not guarantee ordering by creation time
use_cases:
  - Generating compact, URL-safe unique string IDs
  - Creating custom alphabet ID generators
when_to_use:
  - When needing cryptographically strong IDs that are smaller than UUIDs
  - When requiring high-performance ID generation
when_not_to_use:
  - instead: a sequential integer or timestamp-based approach
    why: Does not guarantee ordering by creation time
tradeoffs:
  - Smaller footprint (117 bytes) and faster than native crypto.randomUUID() at the cost of specific alphabet
    constraints
inputs:
  - name: pnpm add nanoid@6.0.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: nanoid
    kind: export
    about: Generates a compact, URL-safe unique string ID
  - name: customAlphabet
    kind: export
    about: Creates a function to generate IDs using a specific alphabet and length
extension_points: []
dependencies:
  package: nanoid
  version: 6.0.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Uses hardware random generator; safe for use in clusters
guarantees:
  - claim: generates url-safe unique ids
    test:
      file: contract.test.ts
      title: generates url-safe unique ids
limits:
  - Does not guarantee ordering by creation time
example: |-
  import { nanoid, customAlphabet } from "nanoid";

  const id = nanoid();
  const customId = customAlphabet("0123456789", 6)();
keywords:
  - nanoid
  - data.ids
  - data
  - ids
  - unique-id
  - url-safe
  - cryptographically-strong
  - compact
  - javascript
