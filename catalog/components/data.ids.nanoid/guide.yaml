component: data.ids.nanoid
title: data.ids.nanoid
summary: Compact, URL-safe, cryptographically strong unique IDs. Does not guarantee ordering by creation time.
  A compact, URL-safe, and cryptographically strong unique ID generator that uses a hardware random generator.
keywords:
  - nanoid
  - data.ids
  - data
  - ids
  - unique ids
  - url-safe
  - cryptographically strong
  - id generation
synonyms:
  nano id:
    - nanoid
use_cases:
  - Generating short, URL-friendly unique string IDs
  - Creating custom alphabet identifiers
  - Replacing UUIDs with smaller 21-symbol strings
use_when:
  - When compact and URL-safe IDs are required
  - When high performance is needed over native crypto.randomUUID()
avoid_when:
  - Does not guarantee ordering by creation time — use a sequential integer or timestamp-based ID
tradeoffs:
  - choice: Larger alphabet (A-Za-z0-9_-)
    gain: Reduced ID length from 36 to 21 symbols
    cost: Requires specific character handling if non-URL-safe alphabets are used via customAlphabet
config:
  - name: install
    description: pnpm add nanoid@6.0.1 (exact version, added by TurbineH)
interfaces:
  - name: nanoid
    signature: import { nanoid } from "nanoid"
    where: nanoid
  - name: customAlphabet
    signature: import { customAlphabet } from "nanoid"
    where: nanoid
extension_points:
  - what: custom alphabet generation
    where: customAlphabet
    how: provide a string of characters and a length to the customAlphabet function
compatibility:
  package: nanoid@6.0.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Uses hardware random generator
  - Cryptographically strong
guarantees:
  - claim: generates url-safe unique ids
    test: contract.test.ts › generates url-safe unique ids
limits:
  - Does not guarantee ordering by creation time
example: |-
  import { nanoid, customAlphabet } from "nanoid";

  const ids = new Set(Array.from({ length: 1000 }, () => nanoid()));
  console.log(ids.size); // → 1000
  for (const id of ids) console.log(id); // → matches /^[A-Za-z0-9_-]{21}$/
  console.log(customAlphabet("0123456789", 6)()); // → matches /^\d{6}$/
