# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ui.form.react-hook-form
does: Performant React form state with validation resolvers
does_not: Does not render inputs or styles
use_cases:
  - Performant React form state management
  - Form validation using native HTML or external resolvers like Zod, Yup, or AJV
when_to_use:
  - When building complex React forms requiring high performance and minimal re-renders
  - When integration with external validation schemas is required
when_not_to_use:
  - instead: plain HTML forms
    why: Does not render inputs or styles itself
tradeoffs:
  - Small size and no dependencies versus the need to manage input registration manually via hooks
inputs:
  - name: pnpm add react-hook-form@7.89.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: useForm
    kind: hook
    about: Provides methods to manage form state, registration, and validation.
extension_points:
  - Validation resolvers for libraries like Zod, Yup, AJV, Superstruct, and Joi
dependencies:
  package: react-hook-form
  version: 7.89.0
  runtime: node@>=20
  peers:
    react: ^16.8.0 || ^17 || ^18 || ^19
    "@types/react": "*"
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@^16.8.0 || ^17 || ^18 || ^19, @types/react@*."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Relies on native HTML form validation and provided resolvers for security logic.
guarantees:
  - claim: registers fields during server render
    test:
      file: contract.test.ts
      title: registers fields during server render
limits:
  - Does not provide UI components or styling
example: |-
  import { useForm } from 'react-hook-form';

  function App() {
    const { register, handleSubmit } = useForm();
    const onSubmit = (data) => console.log(data);

    return (
      <form onSubmit={handleSubmit(onSubmit)}>
        <input {...register('email')} />
        <button type='submit'>Submit</button>
      </form>
    );
  }
keywords:
  - react-hook-form
  - ui.form
  - ui
  - form
  - react
  - forms
  - validation
  - hooks
  - performance
