schema: turbineh.guide/v0.1
component: ops.concurrency.p-limit
title: ops.concurrency.p-limit
summary: Limits how many async operations run at once. Does not persist queued work. Limits the number of
  concurrent asynchronous operations.
keywords:
  - p-limit
  - ops.concurrency
  - ops
  - concurrency
  - async
  - promise
  - limit
  - throttle
synonyms:
  concurrency limiter:
    - p-limit
use_cases:
  - Running multiple promise-returning functions with a fixed concurrency limit
  - Processing an iterable of inputs with limited concurrency via limit.map
  - Controlling simultaneous executions of a single function
use_when:
  - When you need to prevent resource exhaustion by limiting parallel async tasks
  - When you need to process batches of items without overwhelming a downstream service
avoid_when:
  - If you need to persist queued work — use ops.queue-throttle.p-queue
  - If you require rate limiting instead of simple concurrency control — use
    ops.rate-limit.rate-limiter-flexible
tradeoffs:
  - choice: Passing arguments directly to limit(fn, ...args)
    gain: Avoids creating unnecessary closures for high-volume function calls
    cost: Requires careful management of argument passing
  - choice: "Using clearQueue() with rejectOnClear: true"
    gain: Prevents pending tasks from remaining unresolved after queue teardown
    cost: Rejects pending promises with an AbortError
config:
  - name: install
    description: pnpm add p-limit@7.3.3 (exact version, added by TurbineH)
interfaces:
  - name: pLimit
    signature: import pLimit from "p-limit"
    where: p-limit
extension_points:
  - what: limit(fn, ...args)
    where: the returned limit function
    how: pass a promise-returning/async function and its arguments to avoid closures
compatibility:
  package: p-limit@7.3.3
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: never exceeds the concurrency limit
    test: contract.test.ts › never exceeds the concurrency limit
limits:
  - Does not persist queued work
  - Does not cancel promises that are already running
example: |-
  import pLimit from "p-limit";

  const limit = pLimit(2);
  let active = 0;
  let peak = 0;
  await Promise.all(
    Array.from({ length: 6 }, () =>
      limit(async () => {
        active++;
        peak = Math.max(peak, active);
        await new Promise((r) => setTimeout(r, 5));
        active--;
      }),
    ),
  );
  console.log(peak); // → 2
