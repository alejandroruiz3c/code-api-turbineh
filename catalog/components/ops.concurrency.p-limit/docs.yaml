schema: turbineh.component-docs/v1
id: ops.concurrency.p-limit
does: Limits how many async operations run at once
does_not: Does not persist queued work
use_cases:
  - Run multiple promise-returning or async functions with a concurrency limit
  - Process an iterable of inputs using a mapper function with limited concurrency
when_to_use:
  - When you need to control the number of simultaneous executions of async operations
when_not_to_use:
  - instead: ops.queue-throttle.p-queue
    why: When you need to persist queued work
  - instead: ops.rate-limit.rate-limiter-flexible
    why: When you need rate limiting instead of concurrency limiting
tradeoffs:
  - Avoid calling the same limit function inside a function already limited by it to prevent deadlocks
inputs:
  - name: pnpm add p-limit@7.3.3
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: pLimit
    kind: export
    about: Returns a function that limits the concurrency of passed functions. Accepts a number or an object with
      a concurrency property.
extension_points: []
dependencies:
  package: p-limit
  version: 7.3.3
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No specific security guarantees provided
guarantees:
  - claim: never exceeds the concurrency limit
    test:
      file: contract.test.ts
      title: never exceeds the concurrency limit
limits:
  - Does not persist queued work
  - clearQueue does not cancel promises that are already running
example: |-
  import { pLimit } from 'p-limit';

  const limit = pLimit(1);
  const result = await limit(() => Promise.resolve('done'));
  console.log(result);
keywords:
