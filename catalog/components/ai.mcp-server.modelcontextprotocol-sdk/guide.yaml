compatibility:
  package: "@modelcontextprotocol/sdk@1.31.0"
  runtime: node@>=20
  peers:
    zod: ^3.25 || ^4.0
    "@cfworker/json-schema": ^4.1.1
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Tool handlers must manually check caller permissions using require* helpers
  - Actions with side effects require external confirmation via an AI Safety Pack
guarantees:
  - claim: exposes an app tool to an agent through MCP (no model involved)
    test: contract.test.ts › exposes an app tool to an agent through MCP (no model involved)
limits:
  - Does not call models directly
  - v1.x does not support the 2026-07-28 specification
example: |-
  import { Client, InMemoryTransport, McpServer } from "@modelcontextprotocol/sdk";
  import { createAppToolServer } from "@/integrations/ai-mcp-server";

  const server = createAppToolServer("app-tools");
  const [clientSide, serverSide] = InMemoryTransport.createLinkedPair();
  await server.connect(serverSide);
  const client = new Client({ name: "test", version: "1.0.0" });
  await client.connect(clientSide);
