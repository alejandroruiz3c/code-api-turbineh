component: ai.mcp-server.modelcontextprotocol-sdk
title: ai.mcp-server.modelcontextprotocol-sdk
summary: Exposes the app's own tools and data to AI agents through the Model Context Protocol (server side).
  Does not call models; tool permissions and confirmation come from the AI Safety Pack. A TypeScript
  implementation of the Model Context Protocol (MCP) for creating servers that expose tools, resources, and
  prompts to AI agents.
keywords:
  - "@modelcontextprotocol/sdk"
  - ai.mcp-server
  - ai
  - mcp
  - server
  - model context protocol
  - ai agent
  - server sdk
  - typescript
synonyms:
  mcp server sdk:
    - Model Context Protocol implementation
use_cases:
  - Exposing application-specific tools to LLM agents via a standardized protocol
  - Providing structured context and data to AI models without direct model interaction
  - Building MCP clients to connect to various MCP-compliant servers
use_when:
  - When you need to provide a standardized interface for AI agents to interact with your application's data
    and tools
  - When you want to separate context provision from the LLM interaction logic
avoid_when:
  - Tool permissions and confirmation flows for actions with side effects must be handled by the Safety Pack —
    use AI Safety Pack
  - This SDK does not call models; it only exposes tools and data — use direct model calls
tradeoffs:
  - choice: v1.x SDK
    gain: Receives bug fixes and security updates for at least six months after v2 release
    cost: Does not support the 2026-07-28 specification
