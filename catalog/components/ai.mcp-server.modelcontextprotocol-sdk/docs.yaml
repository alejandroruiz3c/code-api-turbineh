# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ai.mcp-server.modelcontextprotocol-sdk
does: Exposes the app's own tools and data to AI agents through the Model Context Protocol (server side)
does_not: Does not call models; tool permissions and confirmation come from the AI Safety Pack
use_cases:
  - Exposing application tools and data to AI agents via the Model Context Protocol
  - Building MCP clients to connect to standardized MCP servers
  - Implementing server-side resources, prompts, and tools for LLM context
when_to_use:
  - When you need to provide a standardized interface for LLMs to interact with your application's data and
    tools
when_not_to_use:
  - instead: ai.orchestrator.turbineh
    why: When you need an orchestrator rather than a protocol implementation for exposing tools
tradeoffs:
  - Separates context provision from LLM interaction but requires adherence to the MCP specification
inputs:
  - name: pnpm add @modelcontextprotocol/sdk@1.31.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Client
    kind: export
    about: An MCP client that can connect to any MCP server
  - name: InMemoryTransport
    kind: export
    about: A transport mechanism for in-memory communication between client and server
  - name: McpServer
    kind: export
    about: A server implementation used to expose resources, prompts, and tools
  - name: createAppToolServer
    kind: export
    about: Helper function to create an McpServer with name validation
extension_points:
  - Custom transports such as stdio or Streamable HTTP
dependencies:
  package: "@modelcontextprotocol/sdk"
  version: 1.31.0
  runtime: node@>=20
  peers:
    zod: ^3.25 || ^4.0
    "@cfworker/json-schema": ^4.1.1
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: zod@^3.25 || ^4.0, @cfworker/json-schema@^4.1.1."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Tool permissions and confirmation must be handled by the AI Safety Pack; this SDK does not manage model
    calls or safety flows
  - Tool handlers should implement permission checks using require* helpers
guarantees:
  - claim: exposes an app tool to an agent through MCP (no model involved)
    test:
      file: contract.test.ts
      title: exposes an app tool to an agent through MCP (no model involved)
limits:
  - Does not call models directly; tool permissions and confirmation are external to this SDK
example: |-
  import { Client, InMemoryTransport, McpServer } from "@modelcontextprotocol/sdk";
  import { createAppToolServer } from "@/integrations/ai-mcp-server";

  const server = createAppToolServer("app-tools");
  const [clientSide, serverSide] = InMemoryTransport.createLinkedPair();
  await server.connect(serverSide);
  const client = new Client({ name: "test", version: "1.0.0" });
  await client.connect(clientSide);
keywords:
  - "@modelcontextprotocol/sdk"
  - ai.mcp-server
  - ai
  - mcp
  - server
  - model context protocol
  - ai agent
  - llm context
  - typescript sdk
  - server-side tools
