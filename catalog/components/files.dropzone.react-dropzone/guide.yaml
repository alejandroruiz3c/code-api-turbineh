schema: turbineh.guide/v0.1
component: files.dropzone.react-dropzone
title: react-dropzone
summary: Drag-and-drop file selection with type and size filters in the browser. Client-side only; the server
  must still validate. A React hook for creating HTML5-compliant drag-and-drop zones with support for file
  type and size filtering.
keywords:
  - react-dropzone
  - files.upload
  - files
  - upload
  - react
  - drag and drop
  - file upload
  - dropzone
  - hook
synonyms:
  drag-and-drop zone:
    - dropzone
use_cases:
  - Implementing drag-and-drop file upload areas in React applications
  - Filtering file uploads by specific MIME types or extensions
  - Restricting file uploads by maximum file size
use_when:
  - When building client-side file selection interfaces in React
  - When you need to provide visual feedback during drag operations
avoid_when:
  - This component is client-side only; the server must still validate files — use files.upload.busboy
tradeoffs:
  - choice: Client-side filtering
    gain: Immediate user feedback on invalid file types or sizes
    cost: Does not replace server-side validation security.
