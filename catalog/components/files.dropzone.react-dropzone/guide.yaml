  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Client-side validation is not a substitute for server-side validation.
guarantees:
  - claim: renders a drop area with a file input
    test: contract.test.ts › renders a drop area with a file input
limits:
  - Client-side only; requires server-side validation.
example: |-
  import { createElement as h } from "react";
  import { renderToString } from "react-dom/server";
  import { useDropzone } from "react-dropzone";

  function Drop() {
    const { getRootProps, getInputProps } = useDropzone({
      accept: { "application/pdf": [".pdf"] },
      maxSize: 5_000_000,
    });
    return h("div", getRootProps(), h("input", getInputProps()), "Drop files");
  }
  const html = renderToString(h(Drop));
  console.log(html); // → contains 'type="file"'
  console.log(html); // → contains "Drop files"
