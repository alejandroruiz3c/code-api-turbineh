# Component guide (turbineh.guide/v0.1, ADR-0033): read by the decider (keywords, use_when/avoid_when), rendered into
# every app as docs/components/<id>.md for coding agents, and checked by `pnpm catalog:validate`.
schema: turbineh.guide/v0.1
component: ai.orchestrator.turbineh
title: TurbineH AI orchestrator and agent runtime (orchestrate, embed, runAgent)
summary: >-
  Every AI call of the app goes through here. orchestrate() answers or returns structured output; embed() builds
  knowledge-base vectors; runAgent() is the tool-calling runtime: the model may only act through typed tools, irreversible
  tools wait for the person's explicit confirmation, and safety, limits, usage and audit apply to every step. The app
  ships a thin client: TurbineH orchestrates every step on its side (route, safety policy, next action) and returns a
  reply or tool calls, which the app runs itself. Without a TurbineH token, any OpenAI-compatible endpoint configured
  by environment variables can be used instead (plain tool loop).
keywords:
  [ai, llm, agent, tool calling, function calling, assistant, chatbot, orchestrator, runAgent, tools, confirmation,
   openai-compatible, model endpoint, structured output, embeddings, rag, prompt injection, rate limit, usage, audit]
synonyms:
  agent: [assistant, bot, copilot, chatbot, virtual receptionist, concierge]
  tool calling: [function calling, actions, tool use, MCP-like tools, skills]
  openai-compatible endpoint: [LLM_BASE_URL, OPENAI_BASE_URL, model base URL, self-hosted model, vLLM, Ollama endpoint, LiteLLM proxy]
  confirmation: [human in the loop, approval, double opt-in, "are you sure"]
use_cases:
  - "Booking/appointment assistant that checks availability and books, moves or cancels (with domain.bookings.turbineh)"
  - "Support assistant that looks up orders or tickets and escalates to a person"
  - "Sales or intake assistant that qualifies a lead and creates a record after confirmation"
  - "Knowledge-base Q&A with cited documents (orchestrate + embed)"
  - "Batch classify / extract / summarise of records with a Zod schema"
use_when:
  - "The app needs any language-model call: answers, structured output, embeddings or an agent that acts with tools"
  - "A spec asks for 'an OpenAI-compatible endpoint configured by environment variables' (set AI_BASE_URL/AI_API_KEY/AI_MODEL)"
  - "A model must act on the app's data but never without guard rails (validated arguments, confirmation, step limit)"
avoid_when:
  - "No AI is needed: do not add it for deterministic logic (search, rules, calculations)"
  - "Long-running autonomous jobs without a person (runAgent is per turn: ≤12 steps, ≤60 s)"
  - "Streaming token-by-token UIs (replies are returned whole)"
tradeoffs:
  - { choice: "Per-turn runtime with state returned to the app", gain: "Stateless servers, easy to store and audit", cost: "The app stores AgentState (sessions.ts does it for the public assistant)" }
  - { choice: "Confirmation decided by code (yes/no reading or a button)", gain: "A model can never trigger an irreversible action by itself", cost: "One extra turn before create/move/cancel/send" }
  - { choice: "Reply to a confirmed action from the tool's result (its `message`, else the summary + reference), no model call", gain: "The confirmation turn answers in tool time", cost: "The reply is the tool's text (return a person-facing `message` in the person's language); failures still go to the model" }
  - { choice: "Orchestration runs at TurbineH; the app runs its tools", gain: "Tools, data and confirmations stay in the app; no provider keys in the app", cost: "Needs the TurbineH AI gateway (or AI_BASE_URL for a plain local loop)" }
  - { choice: "No SDK, plain fetch through models.ts", gain: "No vendor dependency, one audited transport", cost: "Only the OpenAI-compatible chat/embeddings shapes" }
config:
  - { name: TURBINEH_AI_URL, default: "https://software.turbineh.com/v1/ai", description: "TurbineH AI gateway root" }
  - { name: TURBINEH_AI_TOKEN, default: "", description: "Per-app gateway token (tbh_ai_…); every request is orchestrated by TurbineH" }
  - { name: AI_BASE_URL, default: "", description: "Any OpenAI-compatible endpoint (base URL with /v1); used only when TURBINEH_AI_TOKEN is empty" }
  - { name: AI_API_KEY, default: "", description: "Bearer key for AI_BASE_URL" }
  - { name: AI_MODEL, default: "", description: "Model served by AI_BASE_URL" }
  - { name: AI_TIMEOUT_MS, default: "60000", description: "Per orchestrated request (one transport retry included)" }
  - { name: AI_PUBLIC_MAX_INPUT_CHARS, default: "1000", description: "Public assistant message size" }
  - { name: AI_PUBLIC_REQUESTS_PER_MINUTE, default: "10", description: "Public assistant requests per IP per minute" }
  - { name: AI_PUBLIC_TURNS_PER_CONVERSATION, default: "60", description: "Public assistant turns per conversation" }
interfaces:
  - { name: runAgent, signature: "runAgent({ organizationId, userId, purpose, instructions, input, tools, state?, confirm?, context?, maxSteps?, timeoutMs? }) → Promise<{ status, reply, pending, state, steps, route, model, flags, usage }>", where: src/lib/ai/agent.ts }
  - { name: defineTool, signature: "defineTool({ name, description, parameters: z.object(…), irreversible?, prepare?(args, ctx) → { summary, args? }, execute(args, ctx), timeoutMs? })", where: src/lib/ai/agent.ts }
  - { name: Toolkit, signature: "{ id, title, audience: 'public' | 'staff', instructions, greeting?, tools }", where: src/lib/ai/agent.ts }
  - { name: orchestrate, signature: "orchestrate({ task, input, purpose, organizationId, userId, instructions?, context?, history?, schema?, tools? })", where: src/lib/ai/orchestrator.ts }
  - { name: embed, signature: "embed(texts, { purpose, organizationId, userId }) → number[][]", where: src/lib/ai/orchestrator.ts }
  - { name: "Public assistant", signature: "POST /api/assistant { sessionId?, message, confirm? } → { sessionId, reply, status, pending }; page /assistant; <AssistantWidget>", where: src/app/api/assistant/route.ts }
  - { name: "Agent sessions", signature: "loadAgentSession(id, purpose) / saveAgentSession(id, purpose, state)", where: src/lib/ai/sessions.ts }
extension_points:
  - what: "Add a tool to an existing domain"
    where: "src/<domain>/toolkit.ts"
    how: "defineTool({ name, description, parameters: z.object({...}), execute }) and append it to toolkit.tools; mark irreversible: true and add prepare() (validate + summary) for anything that changes data or sends something."
  - what: "Add a new domain (orders, CRM, tickets…)"
    where: "src/<domain>/toolkit.ts"
    how: "Export `toolkit: Toolkit` (audience public or staff); TurbineH lists it in src/lib/ai/toolkits.ts (re-run the assembler, or add the import there by hand). Add tests/mock-llm/scripts/<domain>.ts so E2E tests drive it offline."
  - what: "A staff-only agent inside the dashboard"
    where: "a server action under src/app/dashboard/"
    how: "Call requireMember(), then runAgent({ organizationId, userId, tools: staffToolkit.tools, state }) and store result.state per user (loadAgentSession/saveAgentSession with your own purpose)."
  - what: "Use a self-hosted or other OpenAI-compatible model"
    where: ".env.local / deployment environment"
    how: "Set AI_BASE_URL, AI_API_KEY and AI_MODEL. No code change; safety, limits, usage and audit still apply."
compatibility:
  runtime: "node >= 20"
  framework: "next ^16 (App Router), drizzle-orm, zod 4"
  recipes: [ai-agents]
  requires: [security.ai-safety.turbineh]
  works_with: [domain.bookings.turbineh]
security:
  - "Prompt-injection requests are refused before any model call; documents and tool results are passed as data (control tokens removed)"
  - "Irreversible tools never run without the person's explicit yes (deterministic reading) or a Confirm button; pending actions expire after 30 min"
  - "Tool arguments validated with Zod; unknown tools refused; errors shown to people never contain internals"
  - "Per-user rate limit and daily token allowances per user/workspace; public assistant adds per-IP limits and message size"
  - "Answers scanned for secrets and PII (AI_REDACT_PII defaults to true; AI_REDACT_PII=false opts out); usage and an audit row (content hashed) for every call"
  - "Keys only from the environment; the Semgrep rule turbineh.ai-direct-model-call flags any model call outside src/lib/ai/models.ts"
  - "When the TurbineH trial of the account is used up, the gateway answers 402 and the person sees its message (who to contact), never a generic failure"
guarantees:
  - { claim: "Irreversible tools run only after an explicit confirmation", test: "tests/unit/ai-agent.test.ts › never executes an irreversible tool before an explicit confirmation" }
  - { claim: "A confirmed action is run by the app and reported to TurbineH, failed or not", test: "tests/unit/ai-agent.test.ts › a confirmed action that fails is reported as failed" }
  - { claim: "The trial limit message reaches the person instead of a generic failure", test: "tests/unit/ai-agent.test.ts › shows TurbineH's trial limit message instead of a generic failure" }
  - { claim: "Invalid arguments and unknown tools are refused; runs stop at the step limit", test: "tests/unit/ai-agent.test.ts › rejects invalid arguments and unknown tools, and stops at the step limit" }
  - { claim: "Prompt injection is refused before any model call", test: "tests/unit/ai-agent.test.ts › refuses prompt injection before any model call" }
  - { claim: "AI_BASE_URL without a TurbineH token selects an OpenAI-compatible endpoint, otherwise the gateway", test: "tests/unit/ai-agent.test.ts › uses an OpenAI-compatible endpoint from the environment, else the TurbineH gateway" }
limits:
  - "runAgent: 6 steps by default (max 12), 60 s per run, 10 s per tool, 4 tool calls per step, 30 messages kept"
  - "Confirmation words: English, Spanish, French, German, Portuguese (short, no digits); buttons work in any language"
  - "PII redaction is on by default (AI_REDACT_PII) and also hides emails from tools: set AI_REDACT_PII=false explicitly for agents that need the person's email"
  - "Per-IP limits of the public assistant need TRUSTED_PROXY_HOPS off Vercel (otherwise visitors share one bucket)"
example: |-
  // Server code in the app (e.g. src/app/api/support/route.ts): an agent turn with one tool that runs in the app.
  import { z } from "zod";
  import { defineTool, runAgent, type AgentState } from "@/lib/ai/agent";

  const lookupOrder = defineTool({
    name: "lookup_order",
    description: "Status of an order by its number",
    parameters: z.object({ order: z.string().regex(/^A-\d+$/) }),
    execute: async ({ order }) => ({ order, status: "shipped" }),
  });

  export async function supportTurn(
    caller: { organizationId: string; userId: string },
    input: string,
    state: AgentState | null,
  ) {
    const r = await runAgent({
      ...caller,
      purpose: "support",
      instructions: "You help customers with their orders.",
      input,
      tools: [lookupOrder],
      state,
    });
    // r.reply → show it; r.state → store it for the next turn; r.pending → show Confirm / Cancel.
    return { reply: r.reply, state: r.state, pending: r.pending };
  }
example_check:
  kind: app
  from: snippet.ts
