schema: turbineh.component-docs/v1
id: ai.orchestrator.turbineh
does: "TurbineH component #001: every AI call of the app is orchestrated — a small open model plans the
  request, TurbineH orchestration decides the route (which open model), whether it is acceptable and which
  tool to use, and the chosen open model answers; structured output validated with zod, embeddings for
  knowledge bases, usage per workspace"
does_not: Does not host models or store prices; does not let app code call model providers directly (TurbineH
  rule turbineh.ai-direct-model-call)
use_cases:
  - Orchestrating AI requests through a planning model and routing logic
  - Managing tool selection and model routing for open models
  - Generating embeddings for knowledge bases with fixed dimensions
  - Validating structured AI outputs using Zod schemas
when_to_use:
  - When you need an orchestration layer to decide routes, tools, and acceptability for AI calls
  - When you require structured output validation and embedding generation within a single workflow
when_not_to_use:
  - instead: ai.mcp-server.modelcontextprotocol-sdk
    why: When you need to implement the Model Context Protocol instead of TurbineH orchestration
  - instead: direct model provider calls
    why: TurbineH rule turbineh.ai-direct-model-call prohibits calling model providers directly from app code
tradeoffs:
  - Centralized orchestration adds a planning step before model execution
inputs:
  - name: "Copied by the assembler from files/ when selected (recipe ai-agents requires it, always with
      security.ai-safety.turbineh): src/lib/ai/{orchestrator,models,decider,plan,usage}.ts,
      src/db/component-ai-orchestrator.ts, tests/unit/ai-orchestrator.test.ts. Decisions are a plain HTTPS
      request to the TurbineH AI gateway (no extra dependency)."
    kind: install
    about: Exact version, added by TurbineH.
