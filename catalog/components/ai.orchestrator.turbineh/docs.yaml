    kind: export
    about: Orchestrates a request by planning, deciding routes, and executing via a chosen model
  - name: embed
    kind: export
    about: Generates embeddings for text
  - name: decideRoute
    kind: export
    about: Determines the appropriate route for an AI request
  - name: parsePlan
    kind: export
    about: Parses the plan generated by the orchestrator
  - name: chat
    kind: export
