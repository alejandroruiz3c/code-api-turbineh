component: data.csv-export.turbineh
title: data.csv-export.turbineh
summary: CSV export of workspace-scoped records with spreadsheet formula-injection neutralisation. Does not
  export binary formats such as XLSX. CSV export of workspace-scoped records with spreadsheet
  formula-injection neutralisation.
keywords:
  - data.csv-export.turbineh
  - data.csv-export
  - data
  - csv
  - export
  - import
  - formula-injection
  - spreadsheet
use_cases:
  - Exporting workspace records to CSV format
  - Generating CSV strings from object arrays with formula protection
use_when:
  - When you need to export data to CSV while preventing spreadsheet formula injection
  - When you require a lightweight, dependency-free CSV utility
avoid_when:
  - If you require more complex CSV generation features — use data.csv-export.csv-stringify
  - This component does not export binary formats such as XLSX — use XLSX formats
tradeoffs:
  - choice: Formula neutralisation
    gain: Prevents spreadsheet formula injection by prefixing special characters with a single quote
    cost: Modifies the string representation of certain values
