# Acceptance criteria → tests (ADR-0033). Each rule: every regex in `covers` must match the criterion (case-insensitive).
- test: "tests/e2e/waitlist-mechanics.spec.ts › a visitor who joins is confirmed only after opening the emailed link (double opt-in), then sees their position and referral link"
  covers: ["double opt-?in|confirm(ation)? (link|e-?mail)"]
- test: "tests/e2e/waitlist-mechanics.spec.ts › a visitor who joins is confirmed only after opening the emailed link (double opt-in), then sees their position and referral link"
  covers: ["position|place in (the )?(line|queue)|referral link"]
- test: "tests/e2e/waitlist-mechanics.spec.ts › every confirmed referral moves the referrer up the list by the configured number of places"
  covers: ["referr", "move|up|boost|position|place"]
- test: "tests/e2e/waitlist-mechanics.spec.ts › the owner sees the list, exports it as CSV and removes an entry"
  covers: ["owner|admin|staff", "export|csv|remov|delet"]
