schema: turbineh.component-docs/v1
id: ui.markdown.markdown-it
does: CommonMark-compliant Markdown parser with safe defaults (HTML disabled)
does_not: Does not render MDX components
use_cases:
  - Parsing CommonMark-compliant Markdown text
  - Converting Markdown syntax to HTML strings
when_to_use:
  - When a pluggable Markdown parser is required
  - When HTML rendering must be disabled by default
when_not_to_use:
  - instead: MDX
    why: Does not render MDX components
tradeoffs:
  - Provides safe defaults by disabling HTML but lacks support for MDX components
inputs:
  - name: pnpm add markdown-it@15.0.2
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: MarkdownIt
    kind: export
    about: A modern pluggable markdown parser class.
extension_points:
  - Pluggable architecture for additional markdown rules or features
dependencies:
  package: markdown-it
  version: 15.0.2
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - escapes raw html by default
guarantees:
  - claim: The parser escapes raw html by default
    test:
      file: contract.test.ts
      title: escapes raw html by default
limits:
  - Does not render MDX components
example: |-
  import { MarkdownIt } from "markdown-it";
  const md = new MarkdownIt();
  const html = md.render('# hello');
