schema: turbineh.component-docs/v1
id: data.ids.cuid2
does: Collision-resistant, unguessable ids
does_not: Not sortable by time
use_cases:
  - Generating collision-resistant, unguessable IDs for horizontal scaling
  - Generating offline-compatible, URL-friendly identifiers
when_to_use:
  - When you need secure IDs that do not reveal information about the data or the sequence
  - When generating IDs across multiple machines without coordination
when_not_to_use:
  - instead: a simple counter
    why: High performance tight loops like render loops where cross-host uniqueness and security are not required
  - instead: sequential ids
    why: The component is not sortable by time
tradeoffs:
  - Uses multiple entropy sources and Sha3 hashing to prevent guessing, which is slower than simple counters
inputs:
  - name: pnpm add @paralleldrive/cuid2@3.3.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: createId
    kind: export
    about: Generates a new collision-resistant, unguessable ID
  - name: isCuid
    kind: export
    about: Validates if a string is a valid Cuid2
extension_points: []
