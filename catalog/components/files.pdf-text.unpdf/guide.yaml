    description: pnpm add unpdf@1.8.1 (exact version, added by TurbineH)
interfaces:
  - name: extractText
    signature: import { extractText } from "unpdf"
    where: unpdf
  - name: getDocumentProxy
    signature: import { getDocumentProxy } from "unpdf"
    where: unpdf
  - name: pdfToText
    signature: "async function pdfToText( data: Uint8Array, opts:"
