compatibility:
  package: unpdf@1.8.1
  runtime: node@>=20
  peers:
    "@napi-rs/canvas": ^0.1.69 || ^1.0.0
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: extracts the text layer of a PDF
    test: contract.test.ts › extracts the text layer of a PDF
limits:
  - Does not run OCR; scanned PDFs return no text
  - Maximum file size is bounded at 25MB in the pdfToText integration
example: |-
  import { extractText, getDocumentProxy } from 'unpdf';

  const pdf = await getDocumentProxy(new Uint8Array(buffer));
  const { totalPages, text } = await extractText(pdf, { mergePages: true });
