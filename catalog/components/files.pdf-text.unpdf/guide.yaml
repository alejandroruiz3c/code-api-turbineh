component: files.pdf-text.unpdf
title: unpdf
summary: "Extracts text and metadata from PDF files on the server (serverless PDF.js build). Does not run OCR:
  scanned PDFs without a text layer return no text. A serverless PDF.js build for extracting text and metadata
  from PDF files across all JavaScript runtimes including Node.js, Deno, Bun, the browser, and edge
  environments like Cloudflare Workers."
keywords:
  - unpdf
  - files.pdf-text
  - files
  - pdf
  - text
  - extraction
  - serverless
  - pdfjs
  - edge
synonyms:
  unpdf:
    - PDF extraction utility
use_cases:
  - Extracting text from PDFs for AI summarization and analysis
  - Serverless PDF processing in edge environments
  - Extracting links and images from PDF documents
use_when:
  - When working in serverless or edge environments like Cloudflare Workers
  - When needing a modern alternative to pdf-parse with broader runtime support
avoid_when:
  - Scanned PDFs without a text layer return no text — use OCR-based approach
  - If you need to modify or create PDF documents rather than just extracting content — use files.pdf.pdf-lib
tradeoffs:
