schema: turbineh.component-docs/v1
id: data.csv-import.papaparse
does: Robust CSV parsing with headers, quoting and type detection
does_not: Does not validate rows against a schema
use_cases:
  - Parsing CSV files directly from local files or network URLs
  - Converting JSON data to CSV format
  - Streaming large CSV files via HTTP or Node.js Readable Streams
  - Parsing delimited text with automatic delimiter detection
when_to_use:
  - When you need to parse CSV in the browser using web workers to keep the UI reactive
  - When you need to handle complex CSV features like line-breaks and quotations correctly
when_not_to_use:
  - instead: data.csv-import.turbineh
    why: If you require a different implementation for CSV import
  - instead: schema validation
    why: Does not validate rows against a schema
tradeoffs:
  - Supports streaming for large files but certain configuration options are unavailable in Node.js streaming
    mode
inputs:
  - name: pnpm add papaparse@5.7.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Papa
    kind: export
    about: Main interface for parsing and unparsing CSV data
extension_points: []
dependencies:
  package: papaparse
  version: 5.7.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external dependencies
guarantees:
  - claim: parses quoted CSV with headers
    test:
      file: contract.test.ts
      title: parses quoted CSV with headers
limits:
  - Does not validate rows against a schema
  - Certain config options like LocalChunkSize and worker are unavailable when parsing Node.js streams
example: |-
  import { Papa } from 'papaparse';

  const results = Papa.parse('name,notes\n"Doe, J","a ""b"""\n', {
    header: true,
    skipEmptyLines: true,
  });
keywords:
