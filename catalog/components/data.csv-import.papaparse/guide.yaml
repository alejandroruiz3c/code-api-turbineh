component: data.csv-import.papaparse
title: papaparse
summary: Robust CSV parsing with headers, quoting and type detection. Does not validate rows against a schema.
  Fast and powerful CSV parser for the browser and Node.js that supports streaming, web workers, and automatic
  delimiter detection.
keywords:
  - papaparse
  - data.csv-import
  - data
  - csv
  - import
  - parser
  - json
  - streaming
  - delimiter
  - rfc4180
synonyms:
  papa parse:
    - papaparse
use_cases:
  - Parsing CSV files directly from local files or network URLs
  - Converting JSON data to CSV format
  - Streaming large files via HTTP or Node.js Readable Streams
  - Processing delimited text in web workers to maintain UI reactivity
use_when:
  - When you need to parse large CSV files without blocking the main thread
  - When you require automatic type detection for numbers and booleans
  - When you need to handle complex quoting and line-breaks according to RFC 4180
avoid_when:
  - Does not validate rows against a schema — use schema validation library
tradeoffs:
  - choice: Web Worker support
    gain: Keeps web pages reactive during large file parsing
    cost: Certain configuration options like LocalChunkSize are unavailable in worker mode
