compatibility:
  package: papaparse@5.7.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: parses quoted CSV with headers
    test: contract.test.ts › parses quoted CSV with headers
limits:
  - Does not validate rows against a schema
  - Certain config options like download and worker are unavailable when parsing Node.js streams via .pipe()
example: |-
  import { Papa } from 'papaparse';

  const r = Papa.parse('name,notes\n"Doe, J","a ""b"""\n', {
    header: true,
    skipEmptyLines: true,
  });
