schema: turbineh.component-docs/v1
id: data.xlsx-export.exceljs
does: Reads and writes Excel workbooks (XLSX) in memory
does_not: Does not evaluate formulas
use_cases:
  - Reading and writing Excel workbooks (XLSX) in memory
  - Managing Excel workbook data structures
when_to_use:
  - When you need to manipulate XLSX files via buffers
  - When you need to add rows and worksheets to an Excel workbook
when_not_to_use:
  - instead: data.csv-export.csv-stringify
    why: If you only need to export data to CSV format
  - instead: a formula evaluation engine
    why: The component does not evaluate formulas
tradeoffs:
  - Operates entirely in memory
inputs:
  - name: pnpm add exceljs@4.4.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: ExcelJS
    kind: export
    about: Workbook manager for reading and writing xlsx and csv files
extension_points: []
dependencies:
  package: exceljs
  version: 4.4.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database effects
guarantees:
  - claim: writes and reads back an xlsx buffer
    test:
      file: contract.test.ts
      title: writes and reads back an xlsx buffer
limits:
  - Does not evaluate formulas
example: |-
  import { ExcelJS } from "exceljs";
  const wb = new ExcelJS.Workbook();
  wb.addWorksheet("Items").addRows([["sku", "qty"], ["A-1", 3]]);
  const buf = await wb.xlsx.writeBuffer();
  const back = new ExcelJS.Workbook();
  await back.xlsx.load(buf);
