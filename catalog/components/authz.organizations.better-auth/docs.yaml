schema: turbineh.component-docs/v1
id: authz.organizations.better-auth
does: Organizations (workspaces) with members, roles (owner, admin, member), invitations and an active
  organization per session
does_not: Does not scope application data by itself; the app must filter every query by the active organization
use_cases:
  - Managing organizations (workspaces) with members and roles (owner, admin, member)
  - Handling organization invitations
  - Maintaining an active organization per session
when_to_use:
  - When you need built-in workspace and role management in a TypeScript application
when_not_to_use:
  - instead: authz.roles.turbineh
    why: If you only require role-based access control without organization/workspace structures
tradeoffs:
  - Does not scope application data by itself; the app must filter every query by the active organization
