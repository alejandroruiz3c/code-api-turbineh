component: authz.organizations.better-auth
title: authz.organizations.better-auth
summary: Organizations (workspaces) with members, roles (owner, admin, member), invitations and an active
  organization per session. Does not scope application data by itself; the app must filter every query by the
  active organization. Provides organization (workspace) management including members, roles (owner, admin,
  member), invitations, and session-based active organization tracking.
