  - authz.organizations
  - authz
  - organizations
  - workspaces
  - roles
  - memberships
  - invitations
  - multi-tenancy
synonyms:
  organizations:
    - workspaces
use_cases:
  - Managing multi-tenant workspaces with distinct roles
  - Handling organization invitations and membership lifecycle
  - Implementing session-based active organization context
use_when:
  - When your application requires built-in support for organizations and role-based access control within a
    TypeScript environment
avoid_when:
  - If you only require role management without the organization/workspace abstraction — use
    authz.roles.turbineh
tradeoffs:
  - choice: Organization abstraction
    gain: Simplified management of members, roles, and invitations per workspace
    cost: Does not scope application data by itself; the app must filter every query by the active organization
