guarantees:
  - claim: sorts rows headlessly
    test: contract.test.ts › sorts rows headlessly
limits:
  - Does not render markup or styles
example: |-
  import { createTable, getCoreRowModel, getSortedRowModel } from "@tanstack/react-table";

  const data = [{ n: "b" }, { n: "a" }];
  const table = createTable({
    data,
    columns: [{ accessorKey: "n" }],
    getCoreRowModel: getCoreRowModel(),
    getSortedRowModel: getSortedRowModel(),
    state: { sorting: [{ id: "n", desc: false }] },
    onStateChange: () => {},
    renderFallbackValue: null,
  });
  console.log(table.getSortedRowModel().rows.map((r) => r.original.n)); // → ["a", "b"]
