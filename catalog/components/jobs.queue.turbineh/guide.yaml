component: jobs.queue.turbineh
title: turbineh jobs.queue
summary: "Postgres-backed background job queue: typed jobs, retries with exponential backoff, safe concurrent
  claiming, cron-triggered runner endpoint. Does not run a long-lived worker process or schedule recurring
  jobs by itself (call the runner endpoint from a scheduler). Postgres-backed background job queue featuring
  typed jobs, exponential backoff retries, and safe concurrent claiming via a runner endpoint."
