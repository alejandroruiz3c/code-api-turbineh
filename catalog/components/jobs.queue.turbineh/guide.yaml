  - claim: Two runners at the same time (overlapping cron calls) never run the same job twice
    test: files/tests/unit/jobs-concurrency.test.ts › two runners at the same time never run the same job twice
  - claim: Enqueues with the same idempotency key in a workspace are one job
    test: files/tests/unit/jobs-concurrency.test.ts › overlapping enqueues with the same idempotency key are one job
  - claim: A side effect wrapped in ctx.once runs at most once per job, across retries and runners
