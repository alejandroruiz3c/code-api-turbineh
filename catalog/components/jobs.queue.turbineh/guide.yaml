  - retry
  - backoff
  - cron
synonyms:
  job queue:
    - background worker
    - task queue
use_cases:
  - Asynchronous task execution with payload validation
  - Background processing with exponential backoff
  - Scheduled job execution via external cron triggers
use_when:
  - When you need a Postgres-backed queue with typed job schemas
  - When you want to trigger job processing via an HTTP endpoint
avoid_when:
  - If you need to manage complex scheduling logic within the application rather than via an external runner
    endpoint — use jobs.scheduler.cron-parser
  - This component does not run a worker process itself; it requires an external scheduler to call the runner
    endpoint — use a long-lived worker process
tradeoffs:
  - choice: HTTP-triggered runner
    gain: No long-lived worker processes required; compatible with serverless environments
    cost: Requires an external scheduler to call the runner endpoint
