component: ops.rate-limit.rate-limiter-flexible
title: ops.rate-limit.rate-limiter-flexible
summary: Rate limiting with memory, Redis or Postgres stores. Does not block bots by fingerprint. Atomic and
  non-atomic counters for rate limiting and protection against DoS and brute-force attacks using memory,
  Redis, or Postgres stores.
keywords:
  - rate-limiter-flexible
  - ops.rate-limit
  - ops
  - rate
  - limit
  - rate limiting
  - dos protection
  - brute-force protection
  - atomic counters
  - redis
  - postgresql
synonyms:
  rate limiter:
    - throttling tool
use_cases:
  - Rate limiting by IP address, user ID, or API route
  - Protection from DoS attacks
  - Brute-force attack prevention
  - Distributed rate limiting across clusters
use_when:
  - When requiring atomic increments to prevent race conditions
  - When needing a unified API for different storage backends (Redis, MongoDB, PostgreSQL, etc.)
avoid_when:
  - If you only need to limit local concurrency rather than global request rates — use ops.concurrency.p-limit
tradeoffs:
  - choice: Distributed storage (Redis/Postgres)
    gain: Scalable rate limiting across multiple application nodes
    cost: Increased network latency compared to in-memory storage
  - choice: In-memory limiter
    gain: Extremely fast and works in the browser
    cost: Limits are local to the specific process or instance
