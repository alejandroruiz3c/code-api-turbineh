schema: turbineh.component-docs/v1
id: ops.rate-limit.rate-limiter-flexible
does: Rate limiting with memory, Redis or Postgres stores
does_not: Does not block bots by fingerprint
use_cases:
  - Rate limiting with memory, Redis, or Postgres stores
  - Protection from DoS and brute-force attacks
  - Atomic increments for distributed environments
when_to_use:
  - When you need a unified API for multiple storage backends (Valkey, Redis, MongoDB, etc.)
  - When you require atomic counters to prevent race conditions
when_not_to_use:
  - instead: ops.concurrency.p-limit
    why: If you only need to limit local concurrency rather than rate limiting based on points and duration
tradeoffs:
  - Memory limiter works in the browser but distributed limiters require external stores
inputs:
  - name: pnpm add rate-limiter-flexible@11.2.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: RateLimiterMemory
    kind: export
    about: In-memory rate limiter that works in Node.js and the browser
extension_points:
  - Unified API for different storage backends (Redis, Memcached, PostgreSQL, etc.)
dependencies:
  package: rate-limiter-flexible
  version: 11.2.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence ISC; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Protection from DoS and brute-force attacks
guarantees:
  - claim: consumes points and rejects over the limit
    test:
      file: contract.test.ts
      title: consumes points and rejects over the limit
limits:
  - Does not block bots by fingerprint
example: |-
  import { RateLimiterMemory } from "rate-limiter-flexible";

  const opts = {
    points: 6,
    duration: 1,
  };
  const rateLimiter = new RateLimiterMemory(opts);

  rateLimiter.consume("ip", 2)
    .then(() => {
      // 2 points consumed
    })
    .catch((rateLimiterRes) => {
      // Not enough points to consume
    });
