schema: turbineh.component-docs/v1
id: ops.queue-throttle.p-queue
does: In-process queue with concurrency and requests-per-interval limits (batch inference, external APIs)
does_not: "Not durable: use jobs.queue for work that must survive restarts"
use_cases:
  - Batch inference tasks
  - Rate-limiting external API calls
  - Controlling CPU or memory-intensive tasks
when_to_use:
  - When you need to limit concurrency or requests per interval in-process
when_not_to_use:
  - instead: jobs.queue
    why: The queue is not durable and work will not survive restarts
tradeoffs:
  - In-process execution means state is lost on restart
inputs:
  - name: pnpm add p-queue@9.3.3
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: PQueue
    kind: export
    about: A promise queue with concurrency and rate limiting capabilities
  - name: createBatchQueue
    kind: export
    about: Creates a PQueue configured for a specific concurrency and requests per minute
extension_points:
  - Custom queueClass with enqueue, dequeue, filter, setPriority, and remove methods
dependencies:
  package: p-queue
  version: 9.3.3
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No specific security guarantees provided in documentation
guarantees:
  - claim: limits concurrency for batch work
    test:
      file: contract.test.ts
      title: limits concurrency for batch work
  - claim: caps requests per interval
    test:
      file: contract.test.ts
      title: caps requests per interval
limits:
  - Not durable; state is lost if the process restarts
example: |-
  import { createBatchQueue } from '@/integrations/ops-queue-throttle';

  const queue = createBatchQueue({ concurrency: 2, perMinute: 10 });
  await queue.add(async () => {
    // task logic
  });
