title: ops.queue-throttle.p-queue
summary: "In-process queue with concurrency and requests-per-interval limits (batch inference, external APIs).
  Not durable: use jobs.queue for work that must survive restarts. In-process promise queue with concurrency
  and rate-limiting capabilities for managing asynchronous tasks."
