    - promise queue
use_cases:
  - Batch inference tasks
  - External API calls with rate limits
  - CPU or memory-intensive task management
use_when:
  - When you need to limit the number of concurrent asynchronous operations
  - When you need to cap requests per time interval
avoid_when:
  - The queue is not durable and work will not survive restarts — use jobs.queue
tradeoffs:
  - choice: In-process queue
    gain: Zero dependencies and low overhead for local task management
    cost: Loss of all queued tasks if the process restarts
