component: data.pagination.turbineh
title: data.pagination.turbineh
summary: Offset pagination and bounded free-text search for server-rendered lists. Does not provide cursor pagination or
  full-text ranking.
keywords:
  - data.pagination.turbineh
  - data.pagination
  - data
  - pagination
  - offset
  - search
  - query parsing
  - server-side
synonyms:
  offset pagination:
    - page parsing
use_cases:
  - Server-side rendering of paginated lists
  - Bounded free-text search via query parameters
use_when:
  - When implementing offset-based pagination for server-rendered content
  - When requiring trimmed and length-limited search queries
avoid_when:
  - Does not provide full-text ranking — use data.fuzzy-search.fuse
  - Does not provide cursor pagination — use cursor pagination
tradeoffs:
  - choice: Offset pagination
    gain: Simpler implementation for server-rendered lists
    cost: Does not provide cursor pagination or full-text ranking
