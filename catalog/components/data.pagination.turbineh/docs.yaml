# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: data.pagination.turbineh
does: Offset pagination and bounded free-text search for server-rendered lists
does_not: Does not provide cursor pagination or full-text ranking
use_cases:
  - Offset pagination for server-rendered lists
  - Bounded free-text search for query parameters
when_to_use:
  - When implementing server-side pagination with fixed page sizes
  - When parsing search queries from URL parameters
when_not_to_use:
  - instead: data.fuzzy-search.fuse
    why: Does not provide full-text ranking
  - instead: cursor pagination
    why: Does not provide cursor pagination
tradeoffs:
  - Uses fixed PAGE_SIZE of 20
  - Requires database interaction for offset-based queries
inputs:
  - name: Included in recipe templates at src/lib/pagination.ts + generated list pages
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: PAGE_SIZE
    kind: export
    about: The fixed number of items per page (20).
  - name: parsePage
    kind: export
    about: Parses a value into page, offset, and limit objects.
  - name: parseQuery
    kind: export
    about: Trims and bounds a search term to 100 characters.
extension_points: []
dependencies:
  package: turbineh/data.pagination.turbineh
  version: 0.1.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database yes."
  - Input values are parsed to finite numbers and bounded to prevent extreme offsets or long strings.
guarantees:
  - claim: The component defaults and bounds the page.
    test:
      file: recipe template template/tests/unit/pagination.test.ts
      title: defaults and bounds the page
  - claim: The component trims and bounds the search query.
    test:
      file: recipe template template/tests/unit/pagination.test.ts
      title: trims and bounds the search query
limits:
  - Maximum page value is 9,999.
  - Maximum query length is 100 characters.
example: |-
  import { PAGE_SIZE, parsePage, parseQuery } from '@/lib/pagination';

  const { page, offset, limit } = parsePage('5');
  const query = parseQuery(['  search term  ']);
  // PAGE_SIZE: 20, page: 5, offset: 80, limit: 20, query: 'search term'
keywords:
  - data.pagination.turbineh
  - data.pagination
  - data
  - pagination
  - offset
  - search
  - query-parsing
  - server-side
