use_cases:
  - Managing, caching and syncing asynchronous and remote data in React
  - Handling parallel and dependent queries
  - Implementing paginated and infinite scroll queries
  - Managing mutations and reactive query refetching
use_when:
  - When you need transport/protocol agnostic data fetching (REST, GraphQL, promises)
  - When you require automatic stale-while-revalidate or window refocus refetching
  - When you need multi-layer cache with automatic garbage collection
avoid_when:
  - The library is specifically for managing asynchronous and remote data via hooks — use manual state
    management
tradeoffs:
  - choice: Automatic caching and background refresh
    gain: Reduced network requests and improved perceived performance
    cost: Increased complexity in managing cache invalidation and stale state
