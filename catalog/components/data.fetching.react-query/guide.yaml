title: data.fetching.react-query
summary: Client data fetching with caching, retries and background refresh. Does not define the API. Client
  data fetching library for React that manages, caches, and syncs asynchronous and remote data using hooks.
keywords:
  - "@tanstack/react-query"
  - data.fetching
