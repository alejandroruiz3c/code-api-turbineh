id: data.fetching.react-query
does: Client data fetching with caching, retries and background refresh
does_not: Does not define the API
use_cases:
  - Managing, caching and syncing asynchronous and remote data in React
  - Handling parallel and dependent queries
  - Implementing paginated and infinite scroll queries
  - Managing mutations and reactive query refetching
when_to_use:
  - When you need transport/protocol agnostic data fetching (REST, GraphQL, promises)
  - When you require automatic stale-while-revalidate, window refocus, or polling
when_not_to_use:
  - instead: manual state management
    why: The library is designed for managing asynchronous data synchronization rather than simple local state.
tradeoffs:
  - Adds a dependency for managing remote data synchronization
