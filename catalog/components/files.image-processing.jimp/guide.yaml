schema: turbineh.guide/v0.1
component: files.image-processing.jimp
title: jimp
summary: Resizes, crops and converts images in pure JavaScript (thumbnails for products and galleries). Slower
  than native libraries for very large images. A pure JavaScript image processing library for resizing,
  cropping, and converting images without native dependencies.
keywords:
  - jimp
  - files.image-processing
  - files
  - image
  - processing
  - image-processing
  - javascript
  - thumbnail
  - resize
  - pure-js
synonyms:
  jimp:
    - JavaScript Image Manipulation Program
use_cases:
  - Generating thumbnails for product galleries
  - Resizing images while maintaining aspect ratio
  - Converting image formats (JPEG, PNG, BMP, TIFF, GIF)
use_when:
  - When zero native dependencies are required
  - When processing small to medium sized images in a pure JS environment
avoid_when:
  - Slower than native libraries for very large images — use native libraries
tradeoffs:
  - choice: Pure JavaScript implementation
    gain: Zero native dependencies and easy installation
    cost: Lower performance compared to native libraries for very large images
config:
  - name: install
    description: pnpm add jimp@1.6.1 (exact version, added by TurbineH)
interfaces:
  - name: Jimp
    signature: import { Jimp } from "jimp"
    where: jimp
  - name: makeThumbnail
    signature: "async function makeThumbnail(input: Buffer, maxWidth"
    where: "@/integrations/files-image-processing"
extension_points:
  - what: Image format support
    where: "@jimp/jpeg, @jimp/png, @jimp/bmp, @jimp/tiff, @jimp/gif"
    how: Install specific format packages
compatibility:
  package: jimp@1.6.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - makeThumbnail rejects inputs larger than 15MB to bound memory and CPU usage
guarantees:
  - claim: creates, resizes and encodes an image
    test: contract.test.ts › creates, resizes and encodes an image
limits:
  - Input buffers larger than 15MB are rejected
  - Image dimensions exceeding 8000px on any side are rejected
example: |-
  import { Jimp } from "jimp";

  const img = new Jimp({ width: 400, height: 200, color: 0xff0000ff });
  img.resize({ w: 100 });
  console.log(img.bitmap.width); // → 100
  console.log(img.bitmap.height); // → 50
  const png = await img.getBuffer("image/png");
  console.log(png.subarray(1, 4).toString()); // → "PNG"
