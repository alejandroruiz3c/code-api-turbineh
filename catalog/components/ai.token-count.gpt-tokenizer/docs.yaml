# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ai.token-count.gpt-tokenizer
does: Counts and truncates text by tokens (BPE) to keep prompts and context within a budget
does_not: Counts are exact for BPE-family tokenizers and an estimate for other model families
use_cases:
  - Counting tokens for BPE-family models to manage prompt budgets
  - Truncating text to fit within specific token limits without splitting inside a token
  - Estimating API usage costs for OpenAI models
when_to_use:
  - When you need to keep prompts and context within a specific token budget
  - When working with OpenAI model families like GPT-4o or o-series
when_not_to_use:
  - instead: ai.text-chunking.sentence-splitter
    why: If you need to split text by semantic sentences rather than BPE tokens
tradeoffs:
  - Counts are exact for BPE-family tokenizers but are only estimates for other model families
inputs:
  - name: pnpm add gpt-tokenizer@4.0.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: decode
    kind: export
    about: Decodes tokens back into text
  - name: encode
    kind: export
    about: Encodes text into BPE tokens
  - name: isWithinTokenLimit
    kind: export
    about: Assesses if text is within a specified token limit without encoding the entire text
  - name: countTokens
    kind: export
    about: Returns the number of tokens in a string
  - name: truncateToTokens
    kind: export
    about: Cuts text to at most maxTokens tokens
extension_points: []
dependencies:
  package: gpt-tokenizer
  version: 4.0.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - No global cache used, preventing accidental memory leaks
guarantees:
  - claim: The library encodes, decodes and checks a token budget
    test:
      file: contract.test.ts
      title: encodes, decodes and checks a token budget
limits:
  - Counts are estimates for non-BPE model families
example: |-
  import { decode, encode, isWithinTokenLimit } from 'gpt-tokenizer';
  import { countTokens, truncateToTokens } from '@/integrations/ai-token-count';

  const text = 'Hello world';
  const tokens = encode(text);
  const decoded = decode(tokens);
  const limitOk = isWithinTokenLimit(text, 100);
  const count = countTokens(text);
  const truncated = truncateToTokens(text, 5);
keywords:
  - gpt-tokenizer
  - ai.token-count
  - ai
  - token
  - count
  - bpe
  - tokenizer
  - openai
  - gpt-4o
  - token-count
  - truncation
