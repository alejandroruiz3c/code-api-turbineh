example: |-
  import { decode, encode, isWithinTokenLimit } from "gpt-tokenizer";

  const text = "Summarise the attached contract in three bullet points.";
  const tokens = encode(text);
  console.log(tokens.length); // → > 5
  console.log(decode(tokens)); // → text
  console.log(isWithinTokenLimit(text, 1000)); // → tokens.length
  console.log(isWithinTokenLimit(text, 2)); // → false
