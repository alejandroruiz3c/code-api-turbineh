schema: turbineh.component-docs/v1
id: ui.command-palette.cmdk
does: Fast, accessible command menu for React
does_not: Does not provide search indexing
use_cases:
  - Fast, accessible command menu for React applications
  - Accessible combobox implementation with automatic filtering and sorting
when_to_use:
  - When you need a composable command menu or combobox that handles item ranking and filtering automatically
when_not_to_use:
  - instead: manual search implementation
    why: Does not provide search indexing
tradeoffs:
  - Provides automatic filtering and sorting but requires manual management of item lists
inputs:
  - name: pnpm add cmdk@1.1.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Command
    kind: export
    about: The root component for the command menu or combobox. Supports value control, custom filtering, and loop
      prop.
extension_points:
  - Custom filter function with access to item value and keywords
  - Composable API allowing wrapping items in other components or static JSX
dependencies:
  package: cmdk
  version: 1.1.1
  runtime: node@>=20
  peers:
    react: ^18 || ^19 || ^19.0.0-rc
    react-dom: ^18 || ^19 || ^19.0.0-rc
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@^18 || ^19 || ^19.0.0-rc, react-dom@^18 || ^19 || ^19.0.0-rc."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database side effects.
guarantees:
  - claim: server-renders a command list
    test:
      file: contract.test.ts
      title: server-renders a command list
limits:
  - Does not provide search indexing
example: |-
  import { Command } from 'cmdk';

  const Example = () => (
    <Command>
      <Command.Input />
      <Command.List>
        <Command.Item>Apple</Command.Item>
      </Command.List>
    </Command>
  );
