schema: turbineh.component-docs/v1
id: ui.drag-drop.dnd-kit
does: Accessible drag and drop for boards, lists and uploads
does_not: Does not include sortable presets (see dnd-kit sortable)
use_cases:
  - boards
  - lists
  - uploads
when_to_use:
  - building performant and accessible drag and drop experiences
when_not_to_use:
  - instead: dnd-kit sortable
    why: Does not include sortable presets
tradeoffs:
  - Requires manual implementation of sorting logic as presets are not included
inputs:
  - name: pnpm add @dnd-kit/core@6.3.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: DndContext
    kind: export
    about: Context provider for drag and drop functionality
  - name: useDraggable
    kind: hook
    about: Hook to make an element draggable
extension_points: []
dependencies:
  package: "@dnd-kit/core"
  version: 6.3.1
  runtime: node@>=20
  peers:
    react: ">=16.8.0"
    react-dom: ">=16.8.0"
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@>=16.8.0, react-dom@>=16.8.0."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database effects
guarantees:
  - claim: renders draggable items with accessibility attributes
    test:
      file: contract.test.ts
      title: renders draggable items with accessibility attributes
limits:
  - Does not include sortable presets
example: |-
  import { DndContext, useDraggable } from "@dnd-kit/core";

  function Card() {
    const { attributes, setNodeRef } = useDraggable({ id: "card-1" });
    return <div ref={setNodeRef} {...attributes}>Card</div>;
  }

  function App() {
    return <DndContext><Card /></DndContext>;
  }
keywords:
  - "@dnd-kit/core"
  - ui.drag-drop
  - ui
  - drag
  - drop
  - drag and drop
  - accessible
  - react
  - performant
