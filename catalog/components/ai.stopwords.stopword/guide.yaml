  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: removes stopwords in several languages
    test: contract.test.ts › removes stopwords in several languages
limits:
  - No stemming or lemmatisation
example: |-
  import { eng, removeStopwords, spa } from "stopword";

  console.log(removeStopwords("the invoice for the customer is late".split(" "), eng)); // → [ "invoice", "customer", "late", ]
  console.log(removeStopwords("la factura del cliente llega tarde".split(" "), spa)); // → [ "factura", "cliente", "llega", "tarde", ]
