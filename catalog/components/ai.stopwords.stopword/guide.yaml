schema: turbineh.guide/v0.1
component: ai.stopwords.stopword
title: ai.stopwords.stopword
summary: Removes stopwords in many languages for keyword extraction and keyword search. No stemming or
  lemmatisation. A module for Node.js and the browser that removes stopwords from text across 62 languages to
  facilitate keyword extraction and search.
keywords:
  - stopword
  - ai.stopwords
  - ai
  - stopwords
  - nlp
  - keyword extraction
  - language support
  - text processing
synonyms:
  stopword removal:
    - stripping stopwords
use_cases:
  - Keyword extraction from text
  - Keyword search preparation
  - Tag generation
use_when:
  - When you need to strip frequent, low-meaning words from a tokenized array of strings
  - When working with multiple languages using pre-defined lists
avoid_when:
  - The component does not perform stemming or lemmatisation — use stemming or lemmatisation
tradeoffs:
  - choice: Pre-defined language lists
    gain: Supports 62 languages out of the box
    cost: Language codes use ISO-639-3 (three characters)
config:
  - name: install
    description: pnpm add stopword@3.1.5 (exact version, added by TurbineH)
