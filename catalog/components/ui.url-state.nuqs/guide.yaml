component: ui.url-state.nuqs
title: ui.url-state.nuqs
summary: Type-safe state in the URL query (filters, search, pagination) for Next.js. Not for private data. A
  type-safe state manager for React that synchronizes state with the URL query string, functioning similarly
  to useState but using the URL as the source of truth.
keywords:
  - nuqs
  - ui.url-state
  - ui
  - url
  - state
  - url-state
  - type-safe
  - search-params
  - nextjs
  - react
  - query-string
synonyms:
  search params manager:
    - URL state manager
use_cases:
  - Managing filters in search interfaces
  - Handling pagination state via URL parameters
  - Synchronizing search queries with the address bar
  - Managing complex UI state across page reloads
use_when:
  - When you need type-safe access to search parameters
  - When you want the URL to be the single source of truth for UI state
  - When using Next.js, Remix, or React Router
avoid_when:
  - Not for private data — use local component state
  - State is stored in the URL query string — use server-side session management
tradeoffs:
  - choice: URL-based state
    gain: Allows users to bookmark or share specific UI configurations (filters, pagination)
    cost: State is visible in the browser address bar and limited by URL length constraints
