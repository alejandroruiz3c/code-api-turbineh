schema: turbineh.component-docs/v1
id: ui.url-state.nuqs
does: Type-safe state in the URL query (filters, search, pagination) for Next.js
does_not: Not for private data
use_cases:
  - Managing type-safe filters, search queries, and pagination via URL search parameters
  - Synchronizing React state with the URL query string for Next.js, Remix, or SPA routers
when_to_use:
  - When the URL should be the single source of truth for UI state
  - When you need to support browser back/forward navigation for state updates
when_not_to_use:
  - instead: local component state
    why: Not for private data
tradeoffs:
  - Shallow mode is default for performance, but requires opt-in to notify server components
inputs:
  - name: pnpm add nuqs@2.10.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: parseAsInteger
    kind: export
    about: Parser for integer values in the URL
  - name: parseAsString
    kind: export
    about: Parser for string values in the URL
  - name: createSerializer
    kind: export
    about: Function to create a serializer for typed URL state
extension_points:
  - Custom parsers for custom types and pretty URLs
  - Adapters for different routing frameworks (Next.js, Remix, React Router)
dependencies:
  package: nuqs
  version: 2.10.1
  runtime: node@>=20
  peers:
    next: ">=14.2.0"
    react: ">=18.2.0 || ^19.0.0-0"
    react-router: ^5 || ^6 || ^7 || ^8
    "@remix-run/react": ">=2"
    react-router-dom: ^5 || ^6 || ^7
    "@tanstack/react-router": ^1
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: next@>=14.2.0, react@>=18.2.0 || ^19.0.0-0, react-router@^5 || ^6 || ^7 || ^8,
    @remix-run/react@>=2, react-router-dom@^5 || ^6 || ^7, @tanstack/react-router@^1."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - Not intended for storing private data
guarantees:
  - claim: parses and serialises typed URL state
    test:
      file: contract.test.ts
      title: parses and serialises typed URL state
limits:
  - Requires framework-specific adapters (NuqsAdapter) to function
example: |-
  import { parseAsInteger, parseAsString, createSerializer } from 'nuqs';

  const serialize = createSerializer({ page: parseAsInteger, q: parseAsString });
  const url = serialize('/list', { page: 2, q: 'red shoes' }); // '/list?page=2&q=red+shoes'
