# Acceptance criteria → tests (ADR-0033). Each rule: every regex in `covers` must match the criterion (case-insensitive).
- test: "tests/e2e/kanban.spec.ts › a card dragged to another status column is saved, with who and when in its history"
  covers: ["kanban|board", "drag|move|between (statuses|columns|stages)"]
- test: "tests/e2e/kanban.spec.ts › a card can be moved with the keyboard alone, and each step is announced"
  covers: ["keyboard|accessib|a11y|screen reader"]
- test: "tests/e2e/kanban.spec.ts › a move the workflow does not allow is refused by the server and the card stays where it was"
  covers: ["board|kanban|drag", "only|allowed|cannot|not allowed|refus|role"]
