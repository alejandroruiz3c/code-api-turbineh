schema: turbineh.component-docs/v1
id: content.markdown-to-text.remove-markdown
does: Turns Markdown (e.g. a model answer) into plain text for SMS, notifications or speech
does_not: "Not a sanitizer: escape or sanitize before rendering as HTML"
use_cases:
  - Converting Markdown model answers into plain text for SMS
  - Generating plain text notifications
  - Preparing Markdown content for speech synthesis
  - Displaying text excerpts in lists without syntax
when_to_use:
  - When you need to strip Markdown formatting to obtain plain text
when_not_to_use:
  - instead: content.html-parse.cheerio
    why: It is not a sanitizer; you must escape or sanitize before rendering as HTML
tradeoffs:
  - Provides plain text extraction but does not handle HTML sanitization
inputs:
  - name: pnpm add remove-markdown@0.7.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: markdownToPlainText
    kind: export
    about: Converts Markdown string to trimmed plain text
extension_points: []
dependencies:
  package: remove-markdown
  version: 0.7.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - "Not a sanitizer: escape or sanitize before rendering as HTML"
guarantees:
  - claim: turns Markdown into plain text
    test:
      file: contract.test.ts
      title: turns Markdown into plain text
limits:
  - Does not provide HTML sanitization
example: |-
  import { markdownToPlainText } from '@/integrations/content-markdown-to-text';

  const text = markdownToPlainText('# Status\n\nYour order **o-42** is [shipped](https://x.test).');
  // 'Status\n\nYour order o-42 is shipped.'
keywords:
