schema: turbineh.guide/v0.1
component: content.markdown-to-text.remove-markdown
title: content.markdown-to-text.remove-markdown
summary: "Turns Markdown (e.g. a model answer) into plain text for SMS, notifications or speech. Not a
  sanitizer: escape or sanitize before rendering as HTML. Strips Markdown formatting from text to produce
  plain text suitable for SMS, notifications, or speech."
keywords:
  - remove-markdown
  - content.markdown-to-text
  - content
  - markdown
  - to
  - text
  - plain text
  - strip
  - formatting
  - sms
  - notifications
synonyms:
  markdown stripper:
    - remove markdown
    - text converter
use_cases:
  - Displaying excerpts from Markdown content in lists
  - Converting model answers to plain text for SMS
  - Preparing text for speech synthesis
  - Generating plain text notifications
use_when:
  - When you need to remove square brackets, asterisks, and other Markdown syntax from a string
avoid_when:
  - It is not a sanitizer; you must escape or sanitize before rendering as HTML — use content.html-dom.linkedom
tradeoffs:
  - choice: Stripping Markdown syntax
    gain: Produces clean text for non-HTML environments like SMS or speech
    cost: Does not provide HTML sanitization
config:
  - name: install
    description: pnpm add remove-markdown@0.7.1 (exact version, added by TurbineH)
interfaces:
  - name: markdownToPlainText
    signature: "function markdownToPlainText(markdown: string): string"
    where: "@/integrations/content-markdown-to-text"
  - name: removeMd
    signature: import removeMd from "remove-markdown"
    where: remove-markdown
extension_points:
  - what: configuration options
    where: removeMd function argument
    how: pass an options object to control stripListLeaders, stripMdxImports, gfm, useImgAltText, abbr,
      replaceLinksWithURL, separateLinksAndTexts, htmlTagsToSkip, or throwError
compatibility:
  package: remove-markdown@0.7.1
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - "Not a sanitizer: escape or sanitize before rendering as HTML."
guarantees:
  - claim: turns Markdown into plain text
    test: contract.test.ts › turns Markdown into plain text
limits:
  - Does not sanitize HTML content.
example: |-
  import removeMd from "remove-markdown";

  console.log(removeMd("# Status\n\nYour order **o-42** is [shipped](https://x.test).").trim()); // → "Status\n\nYour order o-42 is shipped."
