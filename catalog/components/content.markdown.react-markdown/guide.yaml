schema: turbineh.guide/v0.1
component: content.markdown.react-markdown
title: content.markdown.react-markdown
summary: Renders Markdown as React elements without dangerouslySetInnerHTML. Does not edit Markdown. A React
  component that renders Markdown strings into a virtual DOM of React elements without using
  dangerouslySetInnerHTML.
keywords:
  - react-markdown
  - ui.markdown
  - ui
  - markdown
  - react
  - rendering
  - security
  - unified
synonyms:
  react-markdown:
    - Markdown component
use_cases:
  - Rendering Markdown content safely in React applications
  - Transforming Markdown via remark and rehype plugins
  - Customizing HTML element rendering by passing custom React components
use_when:
  - When you need to render Markdown as React elements instead of raw HTML
  - When you require a plugin-based transformation pipeline (unified/remark/rehype)
avoid_when:
  - If you need to use JavaScript and JSX inside your markdown files — use MDX
  - If you prefer a manual hooks-based approach with unified — use react-remark or rehype-react
tradeoffs:
  - choice: Virtual DOM approach
    gain: React only replaces what changed from the syntax tree
    cost: Requires building a syntax tree via unified
config:
  - name: install
    description: pnpm add react-markdown@10.1.0 (exact version, added by TurbineH)
interfaces:
  - name: Markdown
    signature: import Markdown from "react-markdown"
    where: react-markdown
extension_points:
  - what: Plugins
    where: Markdown transformation
    how: Pass remark or rehype plugins to change how markdown is transformed
  - what: Custom Components
    where: Element rendering
    how: Pass your own component to be used instead of standard HTML elements
compatibility:
  package: react-markdown@10.1.0
  runtime: node@>=20
  peers:
    "@types/react": ">=18"
    react: ">=18"
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - "Safe by default: does not use dangerouslySetInnerHTML or allow XSS attacks via raw HTML"
guarantees:
  - claim: renders Markdown and does not execute raw HTML
    test: contract.test.ts › renders Markdown and does not execute raw HTML
limits:
  - Does not edit Markdown content
example: |-
  import { createElement as h } from "react";
  import { renderToString } from "react-dom/server";
  import Markdown from "react-markdown";

  const html = renderToString(h(Markdown, null, "# Title\n\n<script>alert(1)</script>"));
  console.log(html); // → contains "<h1>Title</h1>"
  console.log(html); // → does not contain "<script>"
