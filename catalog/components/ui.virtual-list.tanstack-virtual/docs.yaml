    || ^19.0.0."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - No network, filesystem, or database access required
guarantees:
  - claim: computes the total size of a long list
    test:
      file: contract.test.ts
      title: computes the total size of a long list
limits:
  - Does not fetch data
example: >-
  import { Virtualizer, observeElementOffset, observeElementRect, elementScroll } from
  "@tanstack/react-virtual";


  const v = new Virtualizer({
    count: 10000,
    getScrollElement: () => null,
    estimateSize: () => 32,
    scrollToFn: elementScroll,
    observeElementRect,
    observeElementOffset,
  });
