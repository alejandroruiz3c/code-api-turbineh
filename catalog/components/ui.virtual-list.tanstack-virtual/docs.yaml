  package: "@tanstack/react-virtual"
  version: 3.14.13
  runtime: node@>=20
  peers:
    react: ^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0
    react-dom: ^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0
  requires: []
