schema: turbineh.component-docs/v1
id: ui.virtual-list.tanstack-virtual
does: Renders very long lists and tables efficiently (virtualisation)
does_not: Does not fetch data
use_cases:
  - Rendering very long lists efficiently
  - Rendering very long tables efficiently
when_to_use:
  - When you need to virtualize scrollable elements in React
when_not_to_use:
  - instead: manual DOM management
    why: If the list is small and does not require virtualization
tradeoffs:
  - Headless UI provides no built-in styles
inputs:
  - name: pnpm add @tanstack/react-virtual@3.14.13
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Virtualizer
    kind: export
    about: Core class for managing virtualization logic
  - name: observeElementOffset
    kind: export
    about: Utility to observe element offset changes
  - name: observeElementRect
    kind: export
    about: Utility to observe element rectangle changes
  - name: elementScroll
    kind: export
    about: Utility for handling element scrolling
extension_points: []
