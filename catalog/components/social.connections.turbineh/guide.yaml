schema: turbineh.guide/v0.1
component: social.connections.turbineh
title: Social accounts connected with OAuth 2.0 (LinkedIn, Facebook Pages + Instagram, X) and tokens encrypted at rest
summary: >-
  Lets the people who manage a workspace connect its social media accounts with each provider's official OAuth 2.0
  flow: a LinkedIn member (Sign In with LinkedIn + Share on LinkedIn), the Facebook Pages a person manages and the
  Instagram professional accounts linked to them (Facebook Login for Business, Page tokens), and X accounts
  (Authorization Code with PKCE). The state sent to the provider is single use and bound to the person, the workspace
  and the provider. Tokens are encrypted with AES-256-GCM under SOCIAL_TOKEN_KEY, bound to their own row, refreshed
  before use when the provider gives a refresh token, revoked at the provider on disconnect where it offers a way (X,
  Meta), and never appear in a screen, an export or a log. It is the base of social.publish.turbineh and
  social.metrics.turbineh, and ships the offline mocks of the three providers they all test against.
keywords:
  [social media, social accounts, connect linkedin, connect facebook, connect instagram, connect x, twitter, oauth,
   oauth2, pkce, facebook login for business, instagram business, linkedin share, token encryption, revoke access]
synonyms:
  social account: [social profile, connected account, social channel, social network account]
  X: [Twitter, tweet]
  Facebook Page: [Facebook business page, Meta page]
use_cases:
  - "A small business connects its LinkedIn profile, its Facebook Page with the linked Instagram account and its X account to publish from the app"
  - "An agency workspace connects several Facebook Pages a manager administers in one consent"
use_when:
  - "The request connects, links or authorises LinkedIn, Facebook, Instagram or X (Twitter) accounts to post or read engagement"
  - "Third-party social tokens must be stored safely (encrypted, write-only, revocable)"
avoid_when:
  - "Social sign-in for the app's own users (auth.oauth / better-auth social providers)"
  - "LinkedIn company pages (needs the Community Management API and w_organization_social, not covered), TikTok, YouTube, Pinterest, Threads, Bluesky, Mastodon"
  - "Share buttons or links to profiles (plain web content, no component needed)"
tradeoffs:
  - { choice: "Tokens sealed with AES-256-GCM bound to the row (AAD)", gain: "A database dump or a copied value is useless without the key and outside its row", cost: "Losing SOCIAL_TOKEN_KEY means every account must be connected again" }
  - { choice: "One Meta grant per Facebook user", gain: "One consent connects every Page and its Instagram account", cost: "Disconnecting one of them revokes the grant, so all of that person's Pages are disconnected" }
  - { choice: "Official flows only (no scraping, no password storage)", gain: "Works within each platform's terms; tokens can be revoked by the account owner", cost: "Each platform's app review is needed before real customers can connect" }
config:
  - { name: "src/social/params/connections.json", default: "{ providers: [linkedin, meta, x] }", description: "Providers this app connects (from the request)" }
  - { name: SOCIAL_TOKEN_KEY, description: "32 random bytes, base64 (openssl rand -base64 32). Without it connecting is refused. SOCIAL_TOKEN_KEY_PREVIOUS decrypts during a rotation" }
  - { name: "LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET", description: "LinkedIn developer app with the products Sign In with LinkedIn using OpenID Connect and Share on LinkedIn" }
  - { name: "META_APP_ID / META_APP_SECRET (+ META_LOGIN_CONFIG_ID)", description: "Meta app (Business type) with Facebook Login for Business; the configuration id replaces the scope list when set" }
  - { name: "X_CLIENT_ID / X_CLIENT_SECRET", description: "X developer app with OAuth 2.0 enabled as a confidential client (Web App)" }
  - { name: "Redirect URIs", description: "<APP_URL>/api/social/oauth/linkedin/callback, …/meta/callback, …/x/callback registered with each provider" }
  - { name: "LINKEDIN_VERSION / META_GRAPH_VERSION", default: "202609 / v26.0", description: "Pinned API versions; LinkedIn versions are supported about a year" }
interfaces:
  - { name: "Connect", signature: "GET /api/social/oauth/<linkedin|meta|x>/start → provider consent page; GET …/callback → stores the accounts", where: "src/app/api/social/oauth/[provider]/" }
  - { name: listConnections, signature: "listConnections(organizationId) → ConnectionView[] (no token fields)", where: src/social/connections.ts }
  - { name: accessTokenFor, signature: "accessTokenFor(organizationId, connectionId, now?) → { token, accountId, network } — refreshes when needed, marks expired otherwise", where: src/social/connections.ts }
  - { name: disconnect, signature: "disconnect(ctx, connectionId) → { revoked: 'revoked' | 'local', note }", where: src/social/connections.ts }
  - { name: "OAuth", signature: "authorizeUrl, exchangeCode, refreshTokens, accountsFor, revokeGrant (pure, per provider)", where: src/social/oauth.ts }
  - { name: "Crypto", signature: "encryptToken(plain, binding, key?) / decryptToken(sealed, binding, keys?)", where: src/social/crypto.ts }
extension_points:
  - what: "Use a connected account from new code (e.g. read comments)"
    where: "src/social/connections.ts"
    how: "Call accessTokenFor(organizationId, connectionId) right before the provider call and never store or return the token; on a ProviderError with unauthorized, the connection is marked expired."
  - what: "Request more permissions (e.g. LinkedIn organization posting)"
    where: "src/social/networks.ts (SCOPES)"
    how: "Add the scope, get it approved by the platform for your app, then connect the accounts again; add a contract test against the mock first."
  - what: "Rotate the encryption key"
    where: "SOCIAL_TOKEN_KEY, SOCIAL_TOKEN_KEY_PREVIOUS"
    how: "Move the current key to SOCIAL_TOKEN_KEY_PREVIOUS, set a new SOCIAL_TOKEN_KEY, ask owners to reconnect each account (new tokens are sealed with the new key), then remove the previous key."
compatibility:
  runtime: "node >= 20"
  framework: "next ^16 route handlers and server actions, drizzle-orm with PostgreSQL, zod 4"
  recipes: [saas-crud, ai-agents]
  requires: []
  works_with: [social.publish.turbineh, social.metrics.turbineh, domain.audit-log.turbineh]
  notes: "Connecting and disconnecting need can(role, \"configure\") (owners and admins in the base policy)."
security:
  - "Tokens are AES-256-GCM ciphertext bound to workspace, network, account and kind (AAD); the key comes only from the environment"
  - "Queries for screens select explicit columns without tokens; provider error messages are redacted before they are stored or shown"
  - "OAuth state: random, single use, 10 minutes, bound to the person, the workspace and the provider; PKCE S256 for X"
  - "Every Graph API call carries appsecret_proof; API calls never follow redirects"
guarantees:
  - { claim: "Tokens are encrypted with AES-256-GCM and bound to their row", test: "tests/unit/social-connections.test.ts › social tokens are stored encrypted with AES-256-GCM: the ciphertext never contains the token and decrypts only with the key and its own row" }
  - { claim: "X uses PKCE; LinkedIn and Meta the documented code flow and scopes", test: "tests/unit/social-connections.test.ts › X uses Authorization Code with PKCE (S256); LinkedIn and Meta use the authorization code flow with the documented scopes" }
  - { claim: "LinkedIn flow matches LinkedIn's documented endpoints", test: "tests/unit/social-oauth-contract.test.ts › LinkedIn: authorization code → access token (60 days) → the member from /v2/userinfo; refresh refused without programmatic refresh; no revocation API" }
  - { claim: "Meta flow gives Page tokens and Instagram accounts; revocation removes the grant", test: "tests/unit/social-oauth-contract.test.ts › Meta: code → short-lived → long-lived user token → each Page (Page token) and its Instagram account; revoking removes the grant" }
  - { claim: "X flow: PKCE, Basic client auth, rotating refresh tokens, revocation", test: "tests/unit/social-oauth-contract.test.ts › X: PKCE code exchange with HTTP Basic client auth, refresh tokens rotate, revoke invalidates the tokens" }
  - { claim: "Owners connect the three providers through their consent pages", test: "tests/e2e/social-connections.spec.ts › a workspace owner connects LinkedIn, Facebook Pages with their Instagram account, and X through each provider's OAuth consent page" }
  - { claim: "Tokens are encrypted in the database and never on a page", test: "tests/e2e/social-connections.spec.ts › access tokens are stored encrypted (AES-256-GCM) and never appear on a page" }
  - { claim: "Forged or reused state is refused", test: "tests/e2e/social-connections.spec.ts › the OAuth callback refuses a state it did not issue to this person (single use)" }
  - { claim: "Disconnect revokes at the provider and deletes the tokens", test: "tests/e2e/social-connections.spec.ts › disconnecting an account revokes its tokens at the provider and deletes them here" }
limits:
  - "Proven against local mocks recorded from each provider's documentation (2026-10), not against the live platforms: no live sandbox run was possible without real app credentials, and LinkedIn and X offer no public sandbox"
  - "Platform approval: Meta App Review (advanced access to pages_manage_posts, pages_read_engagement, instagram_content_publish, instagram_manage_insights, business_management) and Business Verification before non-developer accounts can connect; LinkedIn self-serve products (Sign In with LinkedIn, Share on LinkedIn) for members, Community Management API approval for company pages (not covered); X API access is paid per request (pay-per-use credits)"
  - "LinkedIn: no refresh tokens unless LinkedIn enables programmatic refresh for the app (members reconnect every 60 days) and no revocation API (tokens are deleted here; members remove the app in their LinkedIn settings)"
  - "Instagram: only professional (business or creator) accounts linked to a Facebook Page; Instagram Login (graph.instagram.com) is not used"
  - "Rate limits are the platforms' (e.g. X users/me 75 per 15 min); this component adds none of its own"
example: |
  // A server-only provider call with a connected account:
  const { token, accountId } = await accessTokenFor(ctx.organizationId, connectionId);
  const res = await fetch(`https://api.x.com/2/users/${accountId}`, { headers: { authorization: `Bearer ${token}` } });
params:
  file: src/social/params/connections.json
  schema: params.schema.json
  fields:
    - { name: "providers[]", description: "linkedin, meta (Facebook Pages and their Instagram accounts), x — from the networks the request names" }
  example: |
    { "providers": ["linkedin", "meta", "x"] }
