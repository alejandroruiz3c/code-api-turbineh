# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: ai.prompt-templates.mustache
does: "Logic-less templates for prompts and messages: values are inserted, never executed"
does_not: Templates must be written by the app owner, never by end users
use_cases:
  - Rendering logic-less prompt templates for LLMs
  - Generating HTML content from data objects
  - Creating configuration files or source code via tag expansion
when_to_use:
  - When you need to insert values into a template without allowing logic like if/else or loops
  - When you need to render prompts where values must be inserted verbatim without HTML escaping
when_not_to_use:
  - instead: end users writing templates
    why: Templates must be written by the app owner, never by end users
tradeoffs:
  - Logic-less nature prevents complex conditional rendering within the template itself
inputs:
  - name: pnpm add mustache@4.2.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Mustache
    kind: export
    about: The core logic-less template engine implementation
  - name: renderPrompt
    kind: export
    about: Renders a prompt template with values inserted verbatim (no HTML escaping)
  - name: renderHtml
    kind: export
    about: Renders an HTML template with values HTML-escaped
extension_points: []
dependencies:
  package: mustache
  version: 4.2.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Templates must be authored by the application owner to prevent injection; do not allow end users to
    provide templates.
guarantees:
  - claim: renders logic-less templates; values are inserted, never executed
    test:
      file: contract.test.ts
      title: renders logic-less templates; values are inserted, never executed
limits:
  - Missing values in the data object render as empty strings.
example: |-
  import { renderPrompt, renderHtml } from "@/integrations/ai-prompt-templates";

  const prompt = renderPrompt("Hello {{name}}", { name: "World" });
  const html = renderHtml("<div>{{content}}</div>", { content: "<b>Hi</b>" });
keywords:
  - mustache
  - ai.prompt-templates
  - ai
  - prompt
  - templates
  - logic-less
  - prompt-engineering
  - rendering
  - html-escaping
