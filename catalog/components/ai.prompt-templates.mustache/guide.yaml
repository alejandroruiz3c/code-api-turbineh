component: ai.prompt-templates.mustache
title: ai.prompt-templates.mustache
summary: "Logic-less templates for prompts and messages: values are inserted, never executed. Templates must
  be written by the app owner, never by end users. Logic-less template engine for rendering prompts and HTML
  messages by inserting values into tags without executing code."
keywords:
  - mustache
  - ai.prompt-templates
  - ai
  - prompt
  - templates
  - logic-less
  - prompt engineering
  - rendering
synonyms:
  mustache.js:
    - logic-less templates
use_cases:
  - Rendering LLM prompts with verbatim value insertion
  - Generating HTML content with automatic escaping
  - Creating configuration files or source code templates
use_when:
  - When you need to inject data into predefined prompt structures
  - When you require a logic-less syntax to prevent complex execution within templates
avoid_when:
  - Templates must be written by the app owner, never by end users — use end users writing templates
tradeoffs:
  - choice: Logic-less design
    gain: Prevents complex logic and unintended code execution within templates
    cost: No support for if statements, else clauses, or for loops
config:
  - name: install
    description: pnpm add mustache@4.2.0 (exact version, added by TurbineH)
