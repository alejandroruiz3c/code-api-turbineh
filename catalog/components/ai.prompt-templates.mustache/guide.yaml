extension_points:
  - what: Custom escaping behavior
    where: Mustache.render options
    how: Provide an escape function in the options object to control how values are processed during rendering.
compatibility:
  package: mustache@4.2.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Templates must be authored by the application owner to prevent injection attacks from end users.
guarantees:
  - claim: renders logic-less templates; values are inserted, never executed
    test: contract.test.ts › renders logic-less templates; values are inserted, never executed
limits:
  - Missing values render as empty strings.
  - No support for conditional logic or loops beyond tag expansion.
example: |-
