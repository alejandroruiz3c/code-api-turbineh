schema: turbineh.component-docs/v1
id: ui.form.hookform-resolvers
does: Connects react-hook-form with Zod schemas for typed client validation
does_not: Requires react-hook-form
use_cases:
  - Integrating Zod schemas with react-hook-form for client-side validation
  - Providing typed form values by inferring output types from Zod schemas
when_to_use:
  - When using react-hook-form and requiring external schema validation libraries like Zod
when_not_to_use:
  - instead: writing custom validation logic
    why: If you are not using an external validation library
tradeoffs:
  - Requires installing a validation library (e.g., zod) alongside the resolvers package
inputs:
