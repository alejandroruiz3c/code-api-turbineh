schema: turbineh.component-docs/v1
id: jobs.scheduler.croner
does: Cron scheduler and next-run evaluation without dependencies
does_not: Does not persist schedules across restarts
use_cases:
  - Trigger functions based on cron expressions
  - Evaluate next scheduled run times without starting a scheduler
when_to_use:
  - When you need a dependency-free cron scheduler for all environments
  - When you need to calculate the next execution time of a cron expression
when_not_to_use:
  - instead: jobs.queue.turbineh
    why: When you require persistent schedules across restarts
  - instead: jobs.scheduler.cron-parser
    why: When you only need to parse expressions without scheduling functionality
tradeoffs:
  - Provides high feature parity with no external dependencies at the cost of not persisting schedules
inputs:
  - name: pnpm add croner@10.0.1
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Cron
    kind: export
    about: A class used to trigger functions or evaluate cron expressions.
extension_points: []
dependencies:
  package: croner
  version: 10.0.1
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database access required.
guarantees:
  - claim: evaluates next runs without starting
    test:
      file: contract.test.ts
      title: evaluates next runs without starting
limits:
  - Does not persist schedules across restarts
example: |-
  import { Cron } from "croner";
  const job = new Cron("0 9 * * *", { paused: true, timezone: "UTC" });
  const next = job.nextRun(new Date("2026-10-13T10:00:00Z"));
keywords:
  - croner
  - jobs.scheduler
  - jobs
  - scheduler
  - cron
