  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - parses and builds XML without external entities
guarantees:
  - claim: parses and builds XML without external entities
    test: contract.test.ts › parses and builds XML without external entities
limits:
  - No XSLT support
example: |-
  import { XMLBuilder, XMLParser } from "fast-xml-parser";

  const data = new XMLParser().parse("<product><sku>A1</sku><price>9.5</price></product>");
  console.log(data.product.sku); // → "A1"
  console.log(new XMLBuilder().build({ a: { b: 1 } })); // → "<a><b>1</b></a>"
