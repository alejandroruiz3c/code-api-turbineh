schema: turbineh.guide/v0.1
component: data.xml.fast-xml-parser
title: data.xml.fast-xml-parser
summary: Parses and builds XML (feeds, product imports, sitemaps). No XSLT. A pure JavaScript library for
  parsing XML to JS objects and building XML from JS objects. It supports XML, HTML, and DOCTYPE entities,
  handles large files up to 100mb, and preserves tag order.
keywords:
  - fast-xml-parser
  - data.xml
  - data
  - xml
  - parser
  - builder
  - javascript
  - pure-js
synonyms:
  fast-xml-parser:
    - XMLParser
    - XMLBuilder
use_cases:
  - Parsing XML feeds
  - Processing product imports
  - Generating sitemaps
use_when:
  - When a pure JS implementation is required without C/C++ dependencies
  - When tag order preservation is necessary in JS objects
avoid_when:
  - For more advanced validation features or when excluding specific tags from validation — use
    fast-xml-validator
  - For more features and faster XML to JS Object building — use fast-xml-builder
  - If you need higher speed when not preserving tag order or need to process incomplete XML/HTML with less
    memory — use Flexible-XML-Parser
tradeoffs:
  - choice: Pure JS implementation
    gain: No C/C++ dependencies and high compatibility (CommonJS, ESM, browser)
    cost: May be slower than C/C++ based alternatives
config:
  - name: install
    description: pnpm add fast-xml-parser@5.11.1 (exact version, added by TurbineH)
