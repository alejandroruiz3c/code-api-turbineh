component: data.money.decimal-js
title: data.money.decimal-js
summary: Arbitrary-precision decimal arithmetic for money and quantities. Does not format currencies (use
  Intl.NumberFormat). An arbitrary-precision Decimal type for JavaScript that handles integers, floats, and
  non-integer powers while replicating many methods of JavaScript's Number.prototype and Math objects.
keywords:
  - decimal.js
  - data.money
  - data
  - money
  - decimal
  - arbitrary-precision
  - math
  - bignumber
synonyms:
  decimal type:
    - BigDecimal
use_cases:
  - Arbitrary-precision arithmetic for money
  - Calculating quantities with high precision
  - Mathematical operations involving trigonometric functions
use_when:
  - When precision is required in terms of significant digits rather than decimal places
  - When performing calculations that must avoid binary floating point errors
avoid_when:
  - This component does not format currencies — use Intl.NumberFormat
tradeoffs:
  - choice: Using strings for initialization
    gain: Avoids potential loss of precision from numeric literals
    cost: Requires manual conversion of numbers to strings
