schema: turbineh.component-docs/v1
id: data.money.decimal-js
does: Arbitrary-precision decimal arithmetic for money and quantities
does_not: Does not format currencies (use Intl.NumberFormat)
use_cases:
  - Arbitrary-precision decimal arithmetic for money
  - Calculating quantities with high precision
  - Handling hexadecimal, binary, and octal values
  - Performing trigonometric functions and non-integer powers
when_to_use:
  - When precision is required in terms of significant digits rather than decimal places
  - When avoiding binary floating point errors is necessary
when_not_to_use:
  - instead: Intl.NumberFormat
    why: The component does not format currencies
tradeoffs:
  - Larger library size than big.js due to trigonometric functions and non-integer power support
inputs:
  - name: pnpm add decimal.js@10.6.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: Decimal
    kind: export
    about: A constructor function that accepts a number, string, or Decimal instance for arbitrary-precision
      arithmetic.
extension_points: []
dependencies:
  package: decimal.js
  version: 10.6.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - No external network, filesystem, or database dependencies
guarantees:
  - claim: avoids binary floating point errors
    test:
      file: contract.test.ts
      title: avoids binary floating point errors
limits:
  - Passing numeric literals with more than 15 significant digits may cause precision loss; use strings instead
example: |-
  import { Decimal } from 'decimal.js';
  const x = new Decimal('0.1');
  const y = x.plus('0.2');
  console.log(y.toString()); // '0.3'
