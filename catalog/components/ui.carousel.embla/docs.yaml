schema: turbineh.component-docs/v1
id: ui.carousel.embla
does: Accessible, lightweight carousels and sliders for testimonials, galleries and products
does_not: Does not include visual styles
use_cases:
  - testimonials
  - galleries
  - products
when_to_use:
  - when fluid motion and swipe precision are required
  - when building accessible carousels and sliders
when_not_to_use:
  - instead: ui.animation.motion
    why: if you need general purpose animation rather than a carousel-specific library
  - instead: adding visual styles manually
    why: the component does not include visual styles
tradeoffs:
  - requires manual implementation of visual styles
inputs:
  - name: pnpm add embla-carousel-react@8.6.0
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: useEmblaCarousel
    kind: hook
    about: A hook to initialize the Embla carousel functionality on a DOM element.
extension_points: []
dependencies:
  package: embla-carousel-react
  version: 8.6.0
  runtime: node@>=20
  peers:
    react: ^16.8.0 || ^17.0.1 || ^18.0.0 || ^19.0.0 || ^19.0.0-rc
  requires: []
  conflicts: []
compatibility:
  - "node@>=20; peers: react@^16.8.0 || ^17.0.1 || ^18.0.0 || ^19.0.0 || ^19.0.0-rc."
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-11.
  - "Effects: network no, filesystem no, database no."
  - no external services, network, filesystem, or database access required
guarantees:
  - claim: renders slides on the server
    test:
      file: contract.test.ts
      title: renders slides on the server
limits:
  - does not include visual styles
example: |-
  import { useEmblaCarousel } from "embla-carousel-react";

  function Carousel() {
    const [ref] = useEmblaCarousel({ loop: true });
    return (
      <div ref={ref}>
        <div>Slide 1</div>
        <div>Slide 2</div>
      </div>
    );
  }
keywords:
