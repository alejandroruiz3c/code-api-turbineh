component: email.parsing.mailparser
title: email.parsing.mailparser
summary: "Parses raw emails (MIME): headers, text, HTML and attachments, for inbox-processing agents. Does not
  fetch mail (IMAP/POP); attachments are untrusted input. An advanced Node.js MIME parser for raw emails,
  extracting headers, text, HTML, and attachments via streams."
keywords:
  - mailparser
  - email.parsing
  - email
  - parsing
  - mime
  - parser
  - attachments
  - node.js
synonyms:
  mailparser:
    - MIME parser
use_cases:
  - Inbox-processing agents
  - Parsing raw MIME email streams
  - Extracting attachment metadata
use_when:
  - When processing raw email buffers or strings in Node.js environments
avoid_when:
  - If you only need to convert HTML to plain text — use email.plain-text.html-to-text
  - This component does not fetch mail from servers — use IMAP/POP protocols
tradeoffs:
  - choice: Stream-based parsing
    gain: Ability to parse large messages (100MB+) with relatively low overhead
    cost: Complexity in handling non-fatal errors via callbacks or promises
