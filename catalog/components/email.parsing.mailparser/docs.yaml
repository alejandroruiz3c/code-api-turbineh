schema: turbineh.component-docs/v1
id: email.parsing.mailparser
does: "Parses raw emails (MIME): headers, text, HTML and attachments, for inbox-processing agents"
does_not: Does not fetch mail (IMAP/POP); attachments are untrusted input
use_cases:
  - Parsing raw MIME emails into structured data
  - Extracting headers, text, HTML, and attachments for inbox-processing agents
when_to_use:
  - When you have raw email buffers or strings that need to be decomposed into components
when_not_to_use:
  - instead: email.smtp.nodemailer
    why: When you need to send emails rather than parse them
  - instead: IMAP/POP protocols
    why: When you need to fetch mail from a server; this component only parses provided data
tradeoffs:
  - "Maintenance mode: only security updates and critical bug fixes are provided"
inputs:
  - name: pnpm add mailparser@3.9.31
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: simpleParser
    kind: export
    about: "Parses raw email content and replaces cid: image references with data: URLs"
  - name: parseEmail
    kind: export
    about: High-level wrapper that parses raw email with a 25MB size limit
extension_points:
  - updateImageLinks() callback for custom URL handling
dependencies:
  package: mailparser
  version: 3.9.31
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Attachments are untrusted input
guarantees:
  - claim: parses a raw MIME email with an attachment
    test:
      file: contract.test.ts
      title: parses a raw MIME email with an attachment
limits:
  - Inlined images are capped by maxInlinedImagesSize (default 20 MB)
  - Module is in maintenance mode
example: |-
  import { simpleParser } from "mailparser";
  const mail = await simpleParser("From: a@b.com\r\n\r\nHello");
keywords:
  - mailparser
  - email.parsing
  - email
  - parsing
  - mime
  - attachments
  - headers
  - node.js
  - parser
