  - Composable React charts (line, bar, area, pie)
  - Rendering bar charts via BarChart and Bar components
when_to_use:
  - When building React applications that require composable chart components
when_not_to_use:
  - instead: a dashboard framework
    why: Does not provide dashboards
  - instead: a data fetching library
    why: Does not provide data fetching
tradeoffs:
  - Requires external logic for data fetching and dashboard layout
