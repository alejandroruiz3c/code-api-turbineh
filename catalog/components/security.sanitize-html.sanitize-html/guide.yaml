schema: turbineh.guide/v0.1
component: security.sanitize-html.sanitize-html
title: security.sanitize-html.sanitize-html
summary: Allow-list HTML sanitizer for user-generated rich text. Does not sanitize CSS in style attributes
  unless configured. An allow-list based HTML sanitizer designed for cleaning user-generated rich text
  fragments while preserving permitted tags and attributes.
keywords:
  - sanitize-html
  - security.sanitize-html
  - security
  - sanitize
  - html
  - sanitizer
  - rich-text
  - allow-list
synonyms:
  html sanitizer:
    - allow-list sanitizer
use_cases:
  - Cleaning HTML fragments from rich text editors like CKEditor
  - Removing unwanted CSS when copying and pasting from Word
  - Sanitizing HTML for immediate browser preview
use_when:
  - When you need to permit specific HTML tags and attributes on a per-element basis
  - When you need to validate href and src attributes against specific protocols (http, https, ftp, mailto)
avoid_when:
  - If you only need to escape all HTML characters rather than allow specific tags — use
    security.html-escape.he
tradeoffs:
  - choice: Allow-list approach
    gain: Granular control over which elements and attributes are permitted
    cost: Requires manual configuration of permitted tags and attributes
config:
  - name: install
    description: pnpm add sanitize-html@2.17.7 (exact version, added by TurbineH)
interfaces:
  - name: sanitizeHtml
    signature: import sanitizeHtml from "sanitize-html"
    where: sanitize-html
extension_points:
  - what: configure permitted tags and attributes
    where: sanitizeHtml
    how: specify the tags you want to permit, and the permitted attributes for each of those tags
compatibility:
  package: sanitize-html@2.17.7
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Strips scripts and event handlers
  - Validates href and src URLs to ensure they use allowed protocols (http, https, ftp, mailto)
guarantees:
  - claim: strips scripts and event handlers
    test: contract.test.ts › strips scripts and event handlers
limits:
  - Does not sanitize CSS in style attributes unless configured
  - HTML comments are not preserved
example: |-
  import sanitizeHtml from "sanitize-html";

  const out = sanitizeHtml(
    '<p onclick="x()">hi<script>alert(1)</script><a href="javascript:x">l</a></p>',
  );
  console.log(out); // → "<p>hi<a>l</a></p>"
