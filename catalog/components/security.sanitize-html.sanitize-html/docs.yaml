schema: turbineh.component-docs/v1
id: security.sanitize-html.sanitize-html
does: Allow-list HTML sanitizer for user-generated rich text
does_not: Does not sanitize CSS in style attributes unless configured
use_cases:
  - Cleaning up user-submitted HTML fragments from rich text editors like CKEditor
  - Removing unwanted CSS when copying and pasting from Word
  - Validating href and src attributes to ensure they use allowed protocols (http, https, ftp, mailto)
when_to_use:
  - When you need an allow-list based sanitizer for user-generated rich text fragments
when_not_to_use:
  - instead: security.html-escape.he
    why: If you only need to escape HTML characters rather than allow specific tags and attributes
tradeoffs:
  - Does not sanitize CSS in style attributes unless configured
inputs:
  - name: pnpm add sanitize-html@2.17.7
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: sanitizeHtml
    kind: export
    about: An allow-list HTML sanitizer that preserves specified tags and attributes while escaping text content.
extension_points: []
dependencies:
  package: sanitize-html
  version: 2.17.7
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Strips scripts and event handlers from HTML strings
  - Escapes ampersands, greater-than, less-than, and quotation marks in attribute values
guarantees:
  - claim: strips scripts and event handlers
    test:
      file: contract.test.ts
      title: strips scripts and event handlers
limits:
  - Does not sanitize CSS in style attributes unless configured
  - HTML comments are not preserved
example: |-
  import { sanitizeHtml } from "sanitize-html";

  const clean = sanitizeHtml('<p onclick="x()">hi<script>alert(1)</script></p>');
keywords:
  - sanitize-html
  - security.sanitize-html
  - security
  - sanitize
  - html
  - sanitizer
  - allow-list
  - rich-text
  - node.js
