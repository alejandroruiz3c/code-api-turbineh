component: files.office-text.officeparser
title: officeparser
summary: "Extracts text from PowerPoint, Excel and OpenDocument files for search and AI processing. Text only:
  no formatting, charts or images. A Node.js and Browser library for parsing Office documents (docx, pptx,
  xlsx), OpenDocument files, PDFs, and more into an Abstract Syntax Tree (AST) or generating high-fidelity
  outputs."
keywords:
  - officeparser
  - files.office-text
  - files
  - office
  - text
  - parser
  - docx
  - pptx
  - xlsx
  - pdf
  - ast
  - extraction
synonyms:
  office parser:
    - Universal Office Document Parser & Generator
use_cases:
  - Extracting text from PowerPoint, Excel, and OpenDocument files for search indexing
  - Converting office documents into Markdown, HTML, or LaTeX for RAG processing
  - Generating high-fidelity DOCX or PDF documents from structured data
use_when:
  - When you need to convert complex office formats into a structured AST
  - When you require layout-faithful text extraction from PDFs
avoid_when:
  - If you only need simple DOCX to HTML conversion without full AST support — use files.docx-text.mammoth
  - If you need to preserve formatting, charts, or images as the output is text only — use plain text
    extraction
tradeoffs:
  - choice: AST-based parsing
    gain: Provides hierarchical structure including headings, tables, and lists
    cost: Higher complexity than flat text extraction
