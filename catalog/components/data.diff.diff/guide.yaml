component: data.diff.diff
title: data.diff.diff
summary: Text and line diffs for change history and reviews. Does not merge conflicting edits. A JavaScript
  implementation for calculating text and line-based differences.
keywords:
  - diff
  - data.diff
  - data
  - text
  - lines
  - comparison
  - change-history
synonyms:
  text diffing:
    - line diff
use_cases:
  - Generating change history for text documents
  - Performing code reviews via line diffs
use_when:
  - When you need to identify added or removed lines in a string
avoid_when:
  - The component does not merge conflicting edits — use merging conflicting edits
tradeoffs:
  - choice: line-based diffing
    gain: Identifies specific added and removed lines
    cost: Does not provide automated merging of changes
config:
  - name: install
    description: pnpm add diff@9.0.0 (exact version, added by TurbineH)
interfaces:
  - name: diffLines
    signature: import { diffLines } from "diff"
    where: diff
extension_points:
