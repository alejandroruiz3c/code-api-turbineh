    where: diff
    how: import { diffLines } from "diff"
compatibility:
  package: diff@9.0.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence BSD-3-Clause; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
guarantees:
  - claim: reports added and removed lines
    test: contract.test.ts › reports added and removed lines
limits:
  - Does not merge conflicting edits
example: |-
  import { diffLines } from "diff";

  const parts = diffLines("a\nb\n", "a\nc\n");
  console.log(parts.filter((p) => p.added).map((p) => p.value)); // → ["c\n"]
  console.log(parts.filter((p) => p.removed).map((p) => p.value)); // → ["b\n"]
