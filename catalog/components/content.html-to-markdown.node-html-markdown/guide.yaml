schema: turbineh.guide/v0.1
component: content.html-to-markdown.node-html-markdown
title: node-html-markdown
summary: Converts HTML to Markdown fast and without a browser DOM (compact context for models, imports). Does
  not execute scripts or fetch pages. A fast HTML to Markdown converter compatible with Node.js and the
  browser that operates without a browser DOM.
keywords:
  - node-html-markdown
  - content.html-to-markdown
  - content
  - html
  - to
  - markdown
  - html-to-markdown
  - converter
  - fast
  - no-dom
  - llm-context
synonyms:
  nhm:
    - node-html-markdown
use_cases:
  - Converting large volumes of HTML to Markdown for LLM context compression
  - Generating clean, human-readable Markdown from HTML strings
use_when:
  - When high-speed conversion of gigabytes of HTML is required
  - When you need a compact Markdown output for model inputs
avoid_when:
  - If you require a full DOM environment — use content.html-dom.linkedom
  - If you need to parse and manipulate the HTML structure before conversion — use content.html-parse.cheerio
tradeoffs:
  - choice: No browser DOM dependency
    gain: Increased speed and lower resource usage
    cost: Cannot execute scripts or fetch external pages within the HTML
  - choice: Instance reuse
    gain: Saves time when performing multiple conversions
    cost: Requires managing the instance lifecycle
config:
  - name: install
    description: pnpm add node-html-markdown@2.0.0 (exact version, added by TurbineH)
interfaces:
  - name: NodeHtmlMarkdown
    signature: import { NodeHtmlMarkdown } from "node-html-markdown"
    where: node-html-markdown
  - name: htmlToMarkdown
    signature: "function htmlToMarkdown(html: string): string"
    where: "@/integrations/content-html-to-markdown"
extension_points:
  - what: customTranslators
    where: NodeHtmlMarkdown.translate or NodeHtmlMarkdown constructor
    how: Pass an object containing custom translation logic.
  - what: customCodeBlockTranslators
    where: NodeHtmlMarkdown.translate or NodeHtmlMarkdown constructor
    how: Pass logic to handle specific code block transformations.
  - what: customTransformers
    where: NodeHtmlMarkdown constructor
    how: Pass custom transformation logic during instantiation.
compatibility:
  package: node-html-markdown@2.0.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-12.
  - "Effects: network no, filesystem no, database no."
  - Does not execute scripts contained in the provided HTML.
guarantees:
  - claim: converts HTML to compact Markdown
    test: contract.test.ts › converts HTML to compact Markdown
limits:
  - Maximum input length of 2,000,000 characters when using htmlToMarkdown.
  - Does not fetch pages or execute scripts.
example: |-
  import { NodeHtmlMarkdown } from "node-html-markdown";

  const md = NodeHtmlMarkdown.translate(
    '<h1>Pricing</h1><p>Plans start at <strong>9 EUR</strong>. <a href="https://x.test/p">Details</a></p><ul><li>One</li><li>Two</li></ul>',
  );
  console.log(md); // → contains "# Pricing"
  console.log(md); // → contains "**9 EUR**"
  console.log(md); // → contains "[Details](https://x.test/p)"
  console.log(md); // → matches /\* One|- One/
