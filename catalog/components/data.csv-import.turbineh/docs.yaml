# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: data.csv-import.turbineh
does: CSV import with size and row limits where every row is validated before insert
does_not: Does not map arbitrary column names or merge duplicates
use_cases:
  - Importing CSV data into a database with size and row constraints
  - Parsing RFC 4180 compliant CSV text into objects
when_to_use:
  - When you need to validate every row before insertion and enforce strict resource limits
when_not_to_use:
  - instead: data.csv-import.papaparse
    why: When you need to map arbitrary column names or merge duplicates
  - instead: data.csv-export.turbineh
    why: When you only need to generate CSV strings from data
tradeoffs:
  - Provides built-in protection against formula injection at the cost of not supporting complex column mapping
inputs:
  - name: Included in recipe templates at src/lib/csv.ts + generated import actions
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: toCsv
    kind: export
    about: Converts an array of records into a CSV string with formula neutralization
  - name: CSV_LIMITS
    kind: export
    about: Default constraints for maxBytes and maxRows
  - name: parseCsv
    kind: export
    about: Parses RFC 4180 CSV text into objects keyed by the header row subject to limits
extension_points: []
dependencies:
  package: turbineh/data.csv-import.turbineh
  version: 0.1.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database yes."
  - Neutralises spreadsheet formula injection by prefixing suspicious characters with a single quote
guarantees:
  - claim: neutralises formula injection and quotes special characters
    test:
      file: recipe template template/tests/unit/csv.test.ts
      title: neutralises formula injection and quotes special characters
  - claim: round-trips quoted fields and CRLF
    test:
      file: recipe template template/tests/unit/csv.test.ts
      title: round-trips quoted fields and CRLF
  - claim: enforces limits on file size and row count
    test:
      file: recipe template template/tests/unit/csv.test.ts
      title: enforces limits
limits:
  - maxBytes defaults to 1,000,000
  - maxRows defaults to 1,000
example: |-
  import { toCsv, CSV_LIMITS, parseCsv } from '@/lib/csv';

  const data = [{ name: 'John', age: 30 }];
  const csv = toCsv(data, ['name', 'age']);
  const parsed = parseCsv(csv, CSV_LIMITS);
keywords:
  - data.csv-import.turbineh
  - data.csv-import
  - data
  - csv
  - import
  - parse
  - rfc4180
  - limits
  - validation
