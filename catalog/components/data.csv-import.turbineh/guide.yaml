schema: turbineh.guide/v0.1
component: data.csv-import.turbineh
title: data.csv-import.turbineh
summary: CSV import with size and row limits where every row is validated before insert. Does not map
  arbitrary column names or merge duplicates. CSV import utility that parses RFC 4180 text into objects while
  enforcing size and row limits. Every row is validated before insertion.
keywords:
  - data.csv-import.turbineh
  - data.csv-import
  - data
  - csv
  - import
  - parser
  - rfc4180
  - limits
synonyms:
  csv parser:
    - RFC 4180 parser
use_cases:
  - Importing bounded CSV datasets into a database
  - Parsing RFC 4180 compliant text files
use_when:
  - When you need to parse CSV data with strict row and byte limits
  - When you require an RFC 4180 parser that returns objects keyed by header row
avoid_when:
  - When you need more advanced parsing features or different dependency profiles — use
    data.csv-import.papaparse
  - When you need to map arbitrary column names or merge duplicates — use manual mapping
tradeoffs:
  - choice: Strict size and row limits
    gain: Prevents resource exhaustion during import
    cost: Throws errors if the input exceeds defined bounds
config:
  - name: install
    description: Included in recipe templates at src/lib/csv.ts + generated import actions (exact version, added
      by TurbineH)
interfaces:
  - name: toCsv
    signature: "function toCsv(rows: Record<string, unknown>[], columns: string[]): string"
    where: "@/lib/csv"
  - name: CSV_LIMITS
    signature: const CSV_LIMITS
    where: "@/lib/csv"
  - name: parseCsv
    signature: "function parseCsv( text: string, limits:"
    where: "@/lib/csv"
extension_points:
  - what: Custom limit configuration
    where: parseCsv
    how: Pass a custom limits object containing maxBytes and maxRows as the second argument.
compatibility:
  package: turbineh/data.csv-import.turbineh@0.1.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database yes."
  - Neutralises spreadsheet formula injection by prefixing suspicious characters with a single quote
guarantees:
  - claim: Enforces byte and row count constraints
    test: recipe template template/tests/unit/csv.test.ts › enforces limits
  - claim: Correctly handles quoted fields and CRLF line endings
    test: recipe template template/tests/unit/csv.test.ts › round-trips quoted fields and CRLF
  - claim: Prevents formula injection attacks
    test: recipe template template/tests/unit/csv.test.ts › neutralises formula injection and quotes special
      characters
limits:
  - maxBytes defaults to 1,000,000
  - maxRows defaults to 1,000
example: |-
  import { parseCsv, CSV_LIMITS } from '@/lib/csv';

  const data = parseCsv('name,age\nAlice,30\nBob,25', CSV_LIMITS);
