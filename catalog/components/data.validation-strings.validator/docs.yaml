schema: turbineh.component-docs/v1
id: data.validation-strings.validator
does: String validators and sanitizers (emails, URLs, IBAN, etc.)
does_not: Does not validate structured objects
use_cases:
  - Validating email address formats
  - Validating URL structures
  - Validating IBAN numbers
  - Sanitizing strings by escaping HTML characters
when_to_use:
  - When you need to validate or sanitize specific string formats like emails, URLs, or IBANs
when_not_to_use:
  - instead: structured object validation
    why: The library validates and sanitizes strings only and does not validate structured objects
tradeoffs:
  - Requires manual type coercion to string if input type is uncertain
inputs:
  - name: pnpm add validator@13.15.35
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: validator
    kind: export
    about: A library of string validators and sanitizers
extension_points: []
dependencies:
  package: validator
  version: 13.15.35
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - Provides an escape function to sanitize HTML characters in strings
guarantees:
  - claim: validates common string formats
    test:
      file: contract.test.ts
      title: validates common string formats
limits:
  - Passing anything other than a string will result in an error
example: |-
  import validator from 'validator';

  validator.isEmail('a@b.co');
  validator.isURL('https://example.com');
  validator.isIBAN('ES9121000418450200051332');
  validator.escape('<b>');
keywords:
