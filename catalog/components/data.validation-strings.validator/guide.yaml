component: data.validation-strings.validator
title: data.validation-strings.validator
summary: String validators and sanitizers (emails, URLs, IBAN, etc.). Does not validate structured objects. A
  library of string validators and sanitizers for common formats including emails, URLs, and IBANs.
keywords:
