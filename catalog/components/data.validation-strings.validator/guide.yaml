  - validation
  - sanitization
  - strings
  - email
  - url
  - iban
synonyms:
  string validator:
    - sanitizer
use_cases:
  - Validating email address formats
  - Verifying URL structures
  - Checking IBAN compliance
  - Sanitizing HTML strings via escaping
use_when:
  - When you need to validate or sanitize primitive string inputs
  - When checking for specific string patterns like ABA routing numbers or alphabetic characters
avoid_when:
  - The library does not validate structured objects — use structured object validation
  - For complex date manipulation and logic — use data.dates.date-fns
tradeoffs:
  - choice: String-only focus
    gain: High performance and specialized logic for string patterns
    cost: Requires manual type coercion to strings before passing input
