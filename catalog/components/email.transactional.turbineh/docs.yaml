# Component documentation (turbineh.component-docs/v1). Narrative sections drafted by gemma-4-26b-a4b-it from the
# code, tests and README, then checked by code (see generated.checked). Edit freely; keep facts true.
schema: turbineh.component-docs/v1
id: email.transactional.turbineh
does: Transactional email through the Resend HTTP API, with a local outbox log when no API key is configured
does_not: Does not provide email templates, bounce handling or bulk sending
use_cases:
  - Sending transactional emails via Resend HTTP API
  - Logging email metadata to a local outbox file for development or sandboxed testing
when_to_use:
  - When a RESEND_API_KEY is available for production delivery
  - When local outbox logging is preferred for E2E testing via EMAIL_OUTBOX_FILE
when_not_to_use:
  - instead: email.transactional.resend
    why: If you require direct Resend integration without the local outbox fallback mechanism
  - instead: email.smtp.nodemailer
    why: If you need SMTP support instead of HTTP API
  - instead: bulk sending
    why: The component does not provide bulk sending capabilities
tradeoffs:
  - Uses Resend HTTP API which requires network access
  - Provides a local fallback log when no API key is configured, but never logs message bodies
inputs:
  - name: Included in recipe templates at src/lib/email.ts
    kind: install
    about: Exact version, added by TurbineH.
  - name: EMAIL_OUTBOX_FILE
    kind: env
    about: Read by the component's code.
  - name: RESEND_API_KEY
    kind: env
    about: Read by the component's code.
  - name: EMAIL_FROM
    kind: env
    about: Read by the component's code.
interfaces:
  - name: sendEmail
    kind: export
    about: Sends a transactional email using Resend or logs to an outbox if no API key is present
extension_points: []
dependencies:
  package: turbineh/email.transactional.turbineh
  version: 0.1.0
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network yes, filesystem no, database no; external services: resend."
  - Does not log message bodies to the outbox file
guarantees:
  - claim: The component matches emails case-insensitively and denies by default
    test:
      file: recipe template saas-crud/tests/unit/staff.test.ts
      title: matches emails case-insensitively and denies by default
limits:
  - Does not provide email templates
  - Does not provide bounce handling
  - Does not provide bulk sending
example: |-
  import { sendEmail } from "@/lib/email";

  await sendEmail({
    to: "user@example.com",
    subject: "Hello",
    text: "World"
  });
keywords:
  - email.transactional.turbineh
  - email.transactional
  - email
  - transactional
  - resend
  - transactional email
  - outbox
  - http api
  - email delivery
