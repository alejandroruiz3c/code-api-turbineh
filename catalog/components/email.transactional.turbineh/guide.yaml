schema: turbineh.guide/v0.1
component: email.transactional.turbineh
title: email.transactional.turbineh
summary: Transactional email through the Resend HTTP API. Production refuses to start without an API key
  unless EMAIL_DELIVERY=disabled; development and tests record emails in a local outbox file. Links and bodies are
  never written to the console or logs. Does not provide email templates, bounce handling or bulk sending.
keywords:
  - email.transactional.turbineh
  - email.transactional
  - email
  - transactional
  - resend
  - outbox
  - logging
synonyms:
  transactional email:
    - resend wrapper
use_cases:
  - Sending verification links
  - Sending password reset emails
  - Transactional notifications
use_when:
  - When RESEND_API_KEY is configured for production delivery
  - When a local outbox file is needed for development or sandboxed tests
avoid_when:
  - If you require a different implementation of Resend integration — use email.transactional.resend
  - If you need SMTP support — use email.smtp.nodemailer
  - The component does not provide bulk sending — use bulk sending
tradeoffs:
  - choice: Local outbox mode
    gain: Allows testing and development without an API key through a local outbox file (never the console)
    cost: Emails are not actually delivered to recipients
config:
  - name: install
    description: Included in recipe templates at src/lib/email.ts (exact version, added by TurbineH)
  - name: EMAIL_OUTBOX_FILE
    description: Local outbox file (tests set it; development defaults to .turbineh/email-outbox.jsonl).
  - name: RESEND_API_KEY
    description: Required in production (the app refuses to start without it unless EMAIL_DELIVERY=disabled).
  - name: EMAIL_DELIVERY
    description: "disabled: run without sending email on purpose (nothing is sent, links are never logged)."
  - name: EMAIL_FROM
    description: Environment variable read by the component's code.
interfaces:
  - name: sendEmail
    signature: "async function sendEmail(msg:"
    where: "@/lib/email"
extension_points:
  - what: Email content and recipient details
    where: sendEmail argument object
    how: "Pass to: to, subject, text, and link"
compatibility:
  package: turbineh/email.transactional.turbineh@0.1.0
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence Apache-2.0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network yes, filesystem no, database no; external services: resend."
  - Never writes an action link, a body or a recipient to the console or server logs (ADR-0054).
guarantees:
  - claim: The component matches emails case-insensitively and denies by default
    test: recipe template saas-crud/tests/unit/staff.test.ts › matches emails case-insensitively and denies by
      default
limits:
  - Does not provide email templates
  - Does not provide bounce handling
  - Does not provide bulk sending
example: |-
  // Server code in the app (e.g. src/app/dashboard/invoices/actions.ts).
  import { sendEmail } from "@/lib/email";

  export async function notifyInvoiceSent(to: string, invoiceUrl: string): Promise<boolean> {
    // Resend when RESEND_API_KEY is set; otherwise nothing is sent (development writes a local outbox file).
    const r = await sendEmail({
      to,
      subject: "Your invoice is ready",
      text: `Open your invoice: ${invoiceUrl}`,
      link: invoiceUrl,
    });
    return r.delivered;
  }
