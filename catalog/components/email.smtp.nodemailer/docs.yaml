schema: turbineh.component-docs/v1
id: email.smtp.nodemailer
does: SMTP email sending
does_not: Licence MIT-0 is outside the beta allow-list
use_cases:
  - SMTP email sending
  - Transactional email delivery
when_to_use:
  - When needing to send emails from Node.js applications using SMTP or JSON transports
when_not_to_use:
  - instead: email.transactional.resend
    why: If you prefer calling an HTTP API instead of maintaining SMTP connections
  - instead: email.transactional.turbineh
    why: If you prefer calling an HTTP API instead of maintaining SMTP connections
tradeoffs:
  - Requires managing SMTP connections and firewall settings compared to HTTP-based APIs
inputs:
  - name: pnpm add nodemailer@10.0.10
    kind: install
    about: Exact version, added by TurbineH.
interfaces:
  - name: nodemailer
    kind: export
    about: Main entry point for creating transports and sending mail
extension_points: []
dependencies:
  package: nodemailer
  version: 10.0.10
  runtime: node@>=20
  peers: {}
  requires: []
  conflicts: []
compatibility:
  - node@>=20.
  - "Verified with the TurbineH stack: Next.js (App Router), TypeScript strict, pnpm."
security:
  - Licence MIT-0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - TLS certificate validation can be configured via tls options; note that Cloudflare Workers do not allow
    turning certificate validation off
guarantees:
  - claim: builds a message with the JSON transport
    test:
      file: contract.test.ts
      title: builds a message with the JSON transport
limits:
  - Requires Node.js 20 or later for version 10+
  - Cloudflare Workers only support SMTP-based transports; sendmail requires a child process which is
    unavailable
example: |-
  import nodemailer from "nodemailer";
  const t = nodemailer.createTransport({ jsonTransport: true });
  await t.sendMail({
    from: "a@example.com",
    to: "b@example.com",
    subject: "s",
    text: "t",
  });
keywords:
  - nodemailer
  - email.transactional
  - email
  - transactional
  - smtp
  - node.js
