schema: turbineh.guide/v0.1
component: email.smtp.nodemailer
title: email.smtp.nodemailer
summary: SMTP email sending. Licence MIT-0 is outside the beta allow-list. SMTP email sending for Node.js
  applications.
keywords:
  - nodemailer
  - email.transactional
  - email
  - transactional
  - smtp
  - node.js
synonyms:
  nodemailer:
    - SMTP client
use_cases:
  - Sending transactional emails via SMTP
  - Sending emails from Node.js 20+ environments
  - Email sending in Bun or Cloudflare Workers (SMTP transports only)
use_when:
  - When you need to send emails from a Node.js application using SMTP or JSON transports
avoid_when:
  - Licence MIT-0 is outside the beta allow-list — use email.transactional.resend
  - Licence MIT-0 is outside the beta allow-list — use email.transactional.turbineh
tradeoffs:
  - choice: SMTP transport
    gain: Direct control over email sending via SMTP servers
    cost: Requires managing firewall settings and potential ETIMEDOUT errors
config:
  - name: install
    description: pnpm add nodemailer@10.0.10 (exact version, added by TurbineH)
interfaces:
  - name: nodemailer
    signature: import nodemailer from "nodemailer"
    where: nodemailer
extension_points:
  - what: JSON transport
    where: nodemailer.createTransport
    how: "pass { jsonTransport: true } as an option"
compatibility:
  package: nodemailer@10.0.10
  runtime: node@>=20
  stack: Verified with Next.js (App Router), TypeScript strict, pnpm
security:
  - Licence MIT-0; 0 known advisories (OSV) on 2026-10-10.
  - "Effects: network no, filesystem no, database no."
  - TLS 1.2 or higher required by latest Node versions
  - "Cloudflare Workers does not allow turning off certificate validation via tls.rejectUnauthorized: false"
guarantees:
  - claim: builds a message with the JSON transport
    test: contract.test.ts › builds a message with the JSON transport
limits:
  - Requires Node.js 20 or newer for version 10+
  - Cloudflare Workers does not support sendmail transport due to child process restrictions
example: |-
  import nodemailer from "nodemailer";

  const t = nodemailer.createTransport({ jsonTransport: true });
  const info = await t.sendMail({
    from: "a@example.com",
    to: "b@example.com",
    subject: "s",
    text: "t",
  });
  console.log(JSON.parse(info.message as string).subject); // → "s"
